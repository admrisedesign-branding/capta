<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8734A">
<title>My Robot — Recepção</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --laranja:#E8734A; --laranja-2:#F59B3C; --laranja-esc:#C4552F;
  --roxo:#6543BC; --creme:#FFF6F0;
  --card:#FFFFFF; --linha:#F0E2D8; --ink:#2A1B14; --muted:#8A7568; --faint:#B8A99E;
  --verde:#16A34A; --verde-bg:#E6F6EC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--creme);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;border:0}
.tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .32s ease}
.tela.on{opacity:1;pointer-events:auto}
.tela.rolavel{justify-content:flex-start;overflow-y:auto;padding-top:26px}

/* robô */
.robo{width:180px;height:180px;position:relative;animation:flutua 3.2s ease-in-out infinite}
.robo.g{width:230px;height:230px}
.robo.p{width:96px;height:96px;animation-duration:2.6s}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.robo.pula{animation:pula .6s cubic-bezier(.3,1.4,.5,1) 3}
@keyframes pula{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-26px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}}
.robo svg{width:100%;height:100%;overflow:visible}
.olho{transform-origin:center;animation:pisca 4.6s infinite}
@keyframes pisca{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.antena{transform-origin:50% 100%;animation:balanca 2.8s ease-in-out infinite}
@keyframes balanca{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.braco{animation:acena 1.6s ease-in-out infinite}
@keyframes acena{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-24deg)}}

/* splash */
#splash{background:linear-gradient(160deg,var(--laranja) 0%,var(--laranja-2) 100%);color:#fff}
#splash h1{font-size:min(9vw,54px);font-weight:900;letter-spacing:-.03em;margin-top:26px;text-align:center;line-height:1.05}
#splash p{font-size:min(4.4vw,21px);font-weight:600;opacity:.92;margin-top:12px;text-align:center}
.toque{margin-top:38px;font-size:16px;font-weight:700;opacity:.75;animation:respira 2.4s ease-in-out infinite;text-transform:uppercase;letter-spacing:.12em}
@keyframes respira{0%,100%{opacity:.45}50%{opacity:.95}}
.bolhas{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bolhas i{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:sobe linear infinite}
@keyframes sobe{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}

/* escolha */
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:780px;margin-top:32px}
@media(max-width:700px){.escolha{grid-template-columns:1fr}}
.big{background:var(--card);border:3px solid var(--linha);border-radius:28px;padding:34px 26px;text-align:center;transition:.14s}
.big:active{transform:scale(.97)}
.big .ic{font-size:52px;line-height:1}
.big b{display:block;font-size:26px;font-weight:900;margin-top:12px;letter-spacing:-.01em}
.big span{display:block;font-size:15px;color:var(--muted);margin-top:6px;font-weight:600}
.big.entrar{border-color:var(--laranja);background:linear-gradient(180deg,#FFF3EC,#fff)}
.big.sair{border-color:var(--roxo);background:linear-gradient(180deg,#F4F0FF,#fff)}
h2.tit{font-size:min(7vw,34px);font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1.15}
p.sub{font-size:17px;color:var(--muted);font-weight:600;margin-top:8px;text-align:center}

/* busca e cards */
.topo-tela{width:100%;max-width:860px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.voltar{background:var(--card);border:2px solid var(--linha);border-radius:16px;padding:12px 18px;font-size:16px;font-weight:800;color:var(--muted)}
.busca{width:100%;max-width:860px;position:relative;margin-bottom:18px}
.busca input{width:100%;border:3px solid var(--linha);border-radius:20px;padding:20px 22px 20px 58px;font-size:20px;font-family:inherit;font-weight:600;background:var(--card);color:var(--ink)}
.busca input:focus{outline:0;border-color:var(--laranja)}
.busca .lupa{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.5}
.lista{width:100%;max-width:860px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:40px}
.pes{background:var(--card);border:3px solid var(--linha);border-radius:22px;padding:20px 22px;text-align:left;animation:entra .32s backwards;transition:.12s}
.pes:active{transform:scale(.97)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pes .n{font-size:22px;font-weight:800;line-height:1.15}
.pes .s{font-size:14.5px;color:var(--muted);margin-top:5px;font-weight:600}
.pes .et{display:inline-block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:99px;margin-top:10px}
.et.exp{background:#FFEDE4;color:var(--laranja-esc)}.et.aluno{background:#EFEAFF;color:var(--roxo)}
.pes.dentro{border-color:var(--verde);background:var(--verde-bg)}
.pes.dentro .et{background:#D6F0DF;color:var(--verde)}
.pes.novo{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:104px;color:var(--laranja);font-weight:800;font-size:18px;text-align:center}
.nada{grid-column:1/-1;text-align:center;color:var(--faint);font-size:18px;padding:34px;font-weight:600;line-height:1.6}

/* confirmação e comemoração */
.balao{background:var(--card);border:3px solid var(--linha);border-radius:26px;padding:26px 30px;max-width:560px;text-align:center;margin-top:20px;position:relative}
.balao:before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(45deg);width:24px;height:24px;background:var(--card);border-left:3px solid var(--linha);border-top:3px solid var(--linha)}
.balao b{font-size:26px;font-weight:900;display:block;line-height:1.2}
.balao span{font-size:17px;color:var(--muted);font-weight:600;display:block;margin-top:8px}
.acoes{display:flex;gap:14px;margin-top:26px;width:100%;max-width:560px}
.acoes button{flex:1;border-radius:20px;padding:20px;font-size:19px;font-weight:800}
.acoes .ok{background:var(--laranja);color:#fff;box-shadow:0 8px 24px rgba(232,115,74,.35)}
.acoes .ok:disabled{opacity:.4;box-shadow:none}
.acoes .g{background:var(--card);border:3px solid var(--linha);color:var(--muted)}

/* feedback */
.estrelas{display:flex;gap:10px;justify-content:center;margin-top:22px}
.estrelas button{font-size:46px;background:transparent;line-height:1;filter:grayscale(1) opacity(.35);transition:.14s;padding:4px}
.estrelas button.on{filter:none;transform:scale(1.12)}
.ops{display:grid;gap:12px;width:100%;max-width:560px;margin-top:22px}
.ops button{background:var(--card);border:3px solid var(--linha);border-radius:20px;padding:18px 20px;font-size:18px;font-weight:700;color:var(--ink);text-align:left}
.ops button.on{border-color:var(--laranja);background:#FFF3EC;color:var(--laranja-esc)}
.ops.duo{grid-template-columns:1fr 1fr}
.ops .sim{border-color:var(--verde);color:var(--verde);text-align:center}.ops .sim.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.ops .nao{text-align:center}.ops .nao.on{background:var(--muted);color:#fff;border-color:var(--muted)}
.passos{display:flex;gap:6px;justify-content:center;margin-top:24px}
.passos i{width:8px;height:8px;border-radius:50%;background:var(--linha)}.passos i.on{background:var(--laranja);width:22px;border-radius:99px}
.campo{width:100%;max-width:560px;margin-top:16px}
.campo label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.campo input{width:100%;border:3px solid var(--linha);border-radius:18px;padding:16px 18px;font-size:18px;font-family:inherit;font-weight:600;background:var(--card)}
.campo input:focus{outline:0;border-color:var(--laranja)}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confete i{position:absolute;width:10px;height:14px;border-radius:2px;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.rel{position:fixed;top:20px;right:26px;font-size:17px;font-weight:800;color:var(--faint);z-index:5}
#splash.on ~ .rel{color:rgba(255,255,255,.75)}
</style>
</head>
<body>

<div class="tela on" id="splash" onclick="ir('escolha')">
  <div class="bolhas" id="bolhas"></div>
  <div class="robo g" id="robo-splash"></div>
  <h1>Bem-vindo à<br>My Robot Manaus</h1>
  <p>O futuro é aqui 🤖</p>
  <div class="toque">toque na tela para começar</div>
</div>

<div class="tela" id="escolha">
  <div class="robo" id="robo-escolha"></div>
  <h2 class="tit" style="margin-top:18px">Oi! O que você quer fazer?</h2>
  <div class="escolha">
    <button class="big entrar" onclick="abrirLista('in')"><div class="ic">👋</div><b>Cheguei!</b><span>fazer check-in</span></button>
    <button class="big sair" onclick="abrirLista('out')"><div class="ic">🎒</div><b>Vou embora</b><span>fazer check-out</span></button>
  </div>
  <button class="voltar" style="margin-top:30px" onclick="ir('splash')">voltar</button>
</div>

<div class="tela rolavel" id="lista">
  <div class="topo-tela"><button class="voltar" onclick="ir('escolha')">← voltar</button>
    <div><h2 class="tit" style="text-align:left;font-size:26px" id="lista-tit"></h2><p class="sub" style="text-align:left" id="lista-sub"></p></div></div>
  <div class="busca"><span class="lupa">🔎</span><input id="q" placeholder="Digite seu nome" oninput="filtrar()" autocomplete="off"></div>
  <div class="lista" id="cards"></div>
</div>

<div class="tela" id="confirma">
  <div class="robo" id="robo-confirma"></div>
  <div class="balao"><b id="conf-nome"></b><span id="conf-sub"></span></div>
  <div class="acoes"><button class="g" onclick="ir('lista')">Não sou eu</button><button class="ok" id="conf-ok">Sou eu!</button></div>
</div>

<div class="tela" id="comemora">
  <div class="robo g pula" id="robo-festa"></div>
  <div class="balao"><b id="fim-titulo"></b><span id="fim-sub"></span></div>
</div>

<div class="tela rolavel" id="feedback" style="align-items:center">
  <div class="robo p" id="robo-fb" style="margin-top:10px"></div>
  <h2 class="tit" id="fb-tit" style="margin-top:14px"></h2>
  <p class="sub" id="fb-sub"></p>
  <div id="fb-corpo" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <div class="acoes"><button class="g" onclick="voltarPasso()">Voltar</button><button class="ok" id="fb-ok">Continuar</button></div>
  <div class="passos" id="fb-passos"></div>
</div>

<div class="rel" id="rel"></div>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hh = t => String(t||'').slice(0,5);
const primeiro = n => String(n||'').trim().split(/\s+/)[0] || '';
const PAGTOS = ['Pix','Cartão','Boleto','Mensalidade recorrente'];
const MOTIVOS = ['Precisa conversar em casa','O valor','O horário não bate','A distância','A criança não se adaptou','Só estávamos conhecendo'];
let D = null, MODO = 'in', SEL = null, F = {}, PASSO = 0, ocioso = null;

// Robô provisório — trocar pelo mascote oficial da My Robot quando tiver o arquivo
const ROBO = (cor = '#2A1B14', fundo = '#fff') => `
<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g class="antena"><line x1="60" y1="26" x2="60" y2="12" stroke="${cor}" stroke-width="5" stroke-linecap="round"/><circle cx="60" cy="9" r="6" fill="#F59B3C"/></g>
  <rect x="22" y="26" width="76" height="60" rx="20" fill="${fundo}" stroke="${cor}" stroke-width="5"/>
  <rect x="33" y="40" width="54" height="30" rx="13" fill="${cor}"/>
  <g class="olho"><circle cx="49" cy="54" r="6" fill="#fff"/><circle cx="71" cy="54" r="6" fill="#fff"/></g>
  <path d="M52 64 q8 7 16 0" stroke="#F59B3C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <g class="braco" style="transform-origin:15px 58px"><rect x="8" y="56" width="14" height="30" rx="7" fill="${fundo}" stroke="${cor}" stroke-width="5"/></g>
  <rect x="98" y="56" width="14" height="30" rx="7" fill="${fundo}" stroke="${cor}" stroke-width="5"/>
  <rect x="38" y="86" width="44" height="22" rx="10" fill="${fundo}" stroke="${cor}" stroke-width="5"/>
  <circle cx="60" cy="97" r="4" fill="#F59B3C"/>
</svg>`;
document.getElementById('robo-splash').innerHTML = ROBO('#fff', 'rgba(255,255,255,.16)');
['robo-escolha','robo-confirma','robo-festa','robo-fb'].forEach(id => document.getElementById(id).innerHTML = ROBO());
(function(){ const c = document.getElementById('bolhas'); for (let i = 0; i < 14; i++) { const b = document.createElement('i');
  const s = 20 + Math.random()*90; b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${12+Math.random()*14}s;animation-delay:-${Math.random()*20}s`; c.appendChild(b); } })();

async function api(acao, extra = {}) {
  const r = await fetch('/api/capta-whatsapp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ acao, slug:SLUG, token:TOKEN, ...extra }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`); return d;
}
function ir(tela){ document.querySelectorAll('.tela').forEach(t => t.classList.toggle('on', t.id === tela));
  clearTimeout(ocioso); if (tela !== 'splash') ocioso = setTimeout(() => ir('splash'), 90000);
  if (tela === 'lista') setTimeout(() => document.getElementById('q').focus(), 260); }
function relogio(){ document.getElementById('rel').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
async function carregar(){ try { D = await api('recepcao'); } catch(e){} }
const pres = (alunoId, agId) => (D?.presencas||[]).find(x => (alunoId && x.aluno_id === alunoId) || (agId && x.agendamento_id === agId));
const leadDe = a => (D?.leads||[]).find(l => l.id === a.lead_id) || {};

function pessoas(){
  if (!D) return [];
  const out = (D.agendamentos||[]).map(a => { const pr = pres(null, a.id); const l = leadDe(a);
    return { tipo:'exp', id:a.id, nome:a.crianca_nome || l.nome || 'Visitante', sub:`aula experimental · ${hh(a.hora_inicio)}${a.crianca_idade?` · ${a.crianca_idade} anos`:''}`, dentro: !!pr && !pr.saida_em, fim: !!(pr && pr.saida_em) };
  });
  for (const t of (D.turmas||[])) for (const al of (D.alunos||[]).filter(x => x.turma_id === t.id)) {
    const pr = pres(al.id); out.push({ tipo:'aluno', id:al.id, nome: al.nome_curto || al.nome, sub:`turma ${hh(t.hora_inicio)}${al.kit?` · ${al.kit}`:''}`, dentro: !!pr && !pr.saida_em, fim: !!(pr && pr.saida_em) });
  }
  return out;
}
function abrirLista(modo){
  MODO = modo; document.getElementById('q').value = '';
  document.getElementById('lista-tit').textContent = modo === 'in' ? 'Quem chegou?' : 'Quem está indo embora?';
  document.getElementById('lista-sub').textContent = modo === 'in' ? 'Toque no seu nome' : 'Toque no seu nome pra finalizar';
  ir('lista'); filtrar(); carregar().then(filtrar);
}
function filtrar(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  let lista = pessoas().filter(x => MODO === 'in' ? (!x.dentro && !x.fim) : x.dentro);
  if (q) lista = lista.filter(x => x.nome.toLowerCase().includes(q));
  document.getElementById('cards').innerHTML = lista.map((x,i) => `<button class="pes ${x.dentro?'dentro':''}" style="animation-delay:${Math.min(i*40,400)}ms" onclick='escolher(${JSON.stringify(x).replace(/'/g,"&#39;")})'>
      <div class="n">${esc(x.nome)}</div><div class="s">${esc(x.sub)}</div>
      <span class="et ${x.tipo==='exp'?'exp':'aluno'}">${x.tipo==='exp'?'aula experimental':'aluno'}</span></button>`).join('')
    + (MODO === 'in' ? `<button class="pes novo" onclick="novoVisitante()">+ Não achei meu nome</button>` : '')
    + (!lista.length ? `<div class="nada">${MODO==='in' ? 'Ninguém esperando agora.<br>Se você é visitante, toque em “Não achei meu nome”.' : 'Ninguém em aula no momento 🤖'}</div>` : '');
}
function escolher(x){
  SEL = x; F = {}; PASSO = 0;
  document.getElementById('conf-nome').textContent = x.nome;
  document.getElementById('conf-sub').textContent = MODO === 'in' ? 'Vamos fazer seu check-in?' : 'Vamos finalizar sua visita?';
  document.getElementById('conf-ok').onclick = () => MODO === 'in' ? fazerEntrada() : (SEL.tipo === 'exp' ? iniciarFeedback() : fazerSaida());
  ir('confirma');
}
async function fazerEntrada(){
  try { await api('checkin', SEL.tipo === 'exp' ? { agendamento_id: SEL.id } : { aluno_id: SEL.id });
    festa(`Boaaa, ${primeiro(SEL.nome)}! 🎉`, SEL.tipo === 'exp' ? 'Feliz em te ver aqui! Aproveita sua aula experimental 🤖' : 'Bom te ver de novo! Bora aprender 🤖');
    carregar(); } catch(e){ alert(e.message); }
}
async function fazerSaida(){
  try { await api('checkin', { aluno_id: SEL.id, saida: true });
    festa(`Até a próxima, ${primeiro(SEL.nome)}! 👋`, 'Foi ótimo ter você aqui hoje.'); carregar(); } catch(e){ alert(e.message); }
}
function festa(titulo, sub){
  document.getElementById('fim-titulo').textContent = titulo;
  document.getElementById('fim-sub').textContent = sub;
  ir('comemora'); confete(); setTimeout(() => ir('splash'), 5200);
}
function confete(){
  const c = document.createElement('div'); c.className = 'confete'; document.body.appendChild(c);
  const cores = ['#E8734A','#F59B3C','#6543BC','#16A34A','#FFD166'];
  for (let i = 0; i < 60; i++) { const s = document.createElement('i');
    s.style.cssText = `left:${Math.random()*100}%;top:-20px;background:${cores[i%cores.length]};animation-duration:${1.8+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*360}deg)`; c.appendChild(s); }
  setTimeout(() => c.remove(), 4200);
}
function checarNovo(){ document.getElementById('fb-ok').disabled = !(F.crianca && String(F.fone||'').replace(/\D/g,'').length >= 10); }
function novoVisitante(){
  SEL = { tipo:'novo' }; F = {};
  document.getElementById('fb-tit').textContent = 'Que bom que você veio! 🤖';
  document.getElementById('fb-sub').textContent = 'Me conta quem é você';
  document.getElementById('fb-corpo').innerHTML = `
    <div class="campo"><label>Nome da criança</label><input id="v-crianca" placeholder="Ex.: João Vitor" oninput="F.crianca=this.value;checarNovo()"></div>
    <div class="campo"><label>Idade</label><input id="v-idade" type="number" inputmode="numeric" placeholder="Ex.: 8" oninput="F.idade=this.value"></div>
    <div class="campo"><label>WhatsApp do responsável</label><input id="v-fone" type="tel" inputmode="numeric" placeholder="(92) 9 9999-9999" oninput="F.fone=this.value;checarNovo()"></div>`;
  document.getElementById('fb-passos').innerHTML = '';
  const ok = document.getElementById('fb-ok'); ok.textContent = 'Pronto!'; ok.disabled = true; ok.onclick = salvarVisitante;
  ir('feedback');
}
async function salvarVisitante(){
  try { await api('visita_avulsa', { crianca: F.crianca, idade: F.idade || null, telefone: F.fone });
    await carregar(); festa(`Boaaa, ${primeiro(F.crianca)}! 🎉`, 'Feliz em te ver aqui! Já avisei a recepção 🤖'); }
  catch(e){ alert(e.message); }
}

const PASSOS = ['nota','matricula','detalhe'];
function iniciarFeedback(){ PASSO = 0; F = {}; ir('feedback'); pintarPasso(); }
function pintarPasso(){
  const nome = primeiro(SEL.nome), passo = PASSOS[PASSO], corpo = document.getElementById('fb-corpo'), ok = document.getElementById('fb-ok');
  ok.onclick = proximoPasso; ok.textContent = PASSO === PASSOS.length - 1 ? 'Concluir' : 'Continuar';
  if (passo === 'nota') {
    document.getElementById('fb-tit').textContent = `E aí, ${nome}? Conta pra gente!`;
    document.getElementById('fb-sub').textContent = 'O que você achou da aula de hoje?';
    corpo.innerHTML = `<div class="estrelas">${[1,2,3,4,5].map(v => `<button class="${F.nota>=v?'on':''}" onclick="F.nota=${v};pintarPasso()">⭐</button>`).join('')}</div>
      ${F.nota && F.nota <= 3 ? `<div class="campo"><label>O que faltou pra ficar melhor?</label><input value="${esc(F.comentario||'')}" placeholder="Pode escrever aqui" oninput="F.comentario=this.value"></div>` : ''}`;
    ok.disabled = !F.nota;
  } else if (passo === 'matricula') {
    document.getElementById('fb-tit').textContent = 'Vamos garantir a vaga?';
    document.getElementById('fb-sub').textContent = 'A matrícula pode ser feita agora, aqui na recepção';
    corpo.innerHTML = `<div class="ops duo"><button class="sim ${F.paga===true?'on':''}" onclick="F.paga=true;pintarPasso()">Sim! 🎉</button><button class="nao ${F.paga===false?'on':''}" onclick="F.paga=false;pintarPasso()">Agora não</button></div>`;
    ok.disabled = F.paga === undefined;
  } else if (F.paga) {
    document.getElementById('fb-tit').textContent = 'Que alegria! 🎉';
    document.getElementById('fb-sub').textContent = 'Como vai ser o pagamento?';
    corpo.innerHTML = `<div class="ops">${PAGTOS.map(v => `<button class="${F.pagamento===v?'on':''}" onclick="F.pagamento='${v}';pintarPasso()">${v}</button>`).join('')}</div>`;
    ok.disabled = !F.pagamento;
  } else {
    document.getElementById('fb-tit').textContent = 'Tudo bem 😊';
    document.getElementById('fb-sub').textContent = 'O que pesou pra não fechar hoje?';
    corpo.innerHTML = `<div class="ops">${MOTIVOS.map(v => `<button class="${F.motivo===v?'on':''}" onclick="F.motivo='${v}';pintarPasso()">${v}</button>`).join('')}</div>`;
    ok.disabled = !F.motivo;
  }
  document.getElementById('fb-passos').innerHTML = PASSOS.map((_,i) => `<i class="${i===PASSO?'on':''}"></i>`).join('');
}
function voltarPasso(){ if (PASSO === 0) return ir('lista'); PASSO--; pintarPasso(); }
async function proximoPasso(){
  if (PASSO < PASSOS.length - 1) { PASSO++; return pintarPasso(); }
  try {
    await api('feedback', { agendamento_id: SEL.id, nota: F.nota ?? null, paga_hoje: F.paga, motivo: F.motivo || null,
      pagamento: F.pagamento || null, comentario: F.comentario || null, atendente: 'recepção' });
    await carregar();
    festa(F.paga ? `Bem-vindo à família, ${primeiro(SEL.nome)}! 🎉` : `Obrigado, ${primeiro(SEL.nome)}! 🤖`,
          F.paga ? 'Sua matrícula foi registrada. Até a próxima aula!' : 'Adorei te conhecer. A gente se fala em breve 😊');
  } catch(e){ alert(e.message); }
}
relogio(); setInterval(relogio, 20000);
if (!SLUG || !TOKEN) document.getElementById('splash').innerHTML = '<h1 style="font-size:28px">Abra pelo link da recepção</h1>';
else { carregar(); setInterval(carregar, 45000); }
</script>
