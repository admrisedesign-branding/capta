<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funil — Capta</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2E5BFF; --brand-deep:#1E44D6; --brand-2:#5B8DEF;
  --brand-soft:rgba(46,91,255,.10); --brand-softer:rgba(46,91,255,.06);
  --bg:#F4F6FB; --card:#FFFFFF; --line:#E9ECF3; --line-2:#F1F3F8;
  --ink:#141A2E; --muted:#697089; --faint:#9AA1B4;
  --quente:#E03127; --quente-bg:rgba(224,49,39,.12);
  --morno:#C47A08;  --morno-bg:rgba(224,147,15,.14);
  --frio:#3E6FD6;   --frio-bg:rgba(91,141,239,.15);
  --verde:#16A34A;  --verde-bg:rgba(22,163,74,.12);
  --gray-bg:rgba(105,112,137,.12);
  --r:16px; --shadow:0 1px 2px rgba(20,26,46,.04),0 6px 20px rgba(20,26,46,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;
  background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.voltar{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:10px;text-decoration:none;transition:.14s}
.voltar:hover{border-color:var(--brand);color:var(--brand)}
.dica{margin-left:auto;color:var(--faint);font-size:12.5px}
@media(max-width:760px){.dica{display:none}}

.raia-area{padding:20px 26px 40px;overflow-x:auto}
.raias{display:flex;gap:14px;align-items:stretch;min-height:calc(100vh - 150px)}
body.embed .raias{min-height:calc(100vh - 120px)}

.raia{flex:1 1 240px;min-width:240px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:76vh}
.raia.alvo{border-color:var(--brand);background:var(--brand-softer)}
.raia-cab{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.raia-cor{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.raia-nome{font-weight:700;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.raia-qtd{font-size:12px;font-weight:700;color:var(--muted);background:var(--gray-bg);border-radius:99px;padding:2px 8px}
.raia-corpo{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}

.lead{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:grab;transition:.14s}
.lead:hover{border-color:var(--brand-2);box-shadow:0 2px 8px rgba(20,26,46,.06)}
.lead.arrastando{opacity:.4}
.lead-nome{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-sub{color:var(--muted);font-size:12px;margin-top:2px}
.lead-fim{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}

.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.t-Quente{background:var(--quente-bg);color:var(--quente)}
.t-Morno{background:var(--morno-bg);color:var(--morno)}
.t-Frio{background:var(--frio-bg);color:var(--frio)}
.parado{font-size:11px;color:var(--faint)}
.t-at{background:var(--gray-bg);color:var(--muted);text-transform:none;letter-spacing:0}
.kommo-lnk{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand);text-decoration:none}
.kommo-lnk:hover{text-decoration:underline}
.parado.alerta{color:var(--morno);font-weight:600}
.parado.grave{color:var(--quente);font-weight:700}

.vazia{color:var(--faint);font-size:12.5px;text-align:center;padding:18px 8px;line-height:1.6}
.aviso{margin:20px 26px 0;border:1px dashed var(--line);border-radius:var(--r);padding:36px;text-align:center;
  color:var(--faint);font-size:13.5px;line-height:1.7}


/* ---- painel lateral do lead ---- */
.tela{display:flex;align-items:flex-start}
.tela > .raia-area,.tela > #raiz{flex:1;min-width:0}
#painel{position:fixed;top:0;right:0;height:100vh;width:0;overflow:hidden;transition:.22s cubic-bezier(.4,0,.2,1);border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;z-index:60;box-shadow:-10px 0 40px rgba(20,26,46,.12)}
#painel.aberto{width:480px;max-width:94vw}
#scrim-p{position:fixed;inset:0;background:rgba(20,26,46,.18);z-index:55;display:none}#scrim-p.on{display:block}

.p-cab{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.p-cab .av{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;flex:0 0 36px}
.p-cab h3{font-size:14.5px;font-weight:800;line-height:1.2}
.p-cab .sub{font-size:12px;color:var(--muted);margin-top:2px}
.p-cab .x{margin-left:auto;border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1}
.p-abas{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.p-abas button{border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);padding:10px 10px;border-bottom:2px solid transparent}
.p-abas button.on{color:var(--brand);border-color:var(--brand)}
.p-corpo{flex:1;overflow-y:auto;padding:12px 16px}
.p-sec{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.ganha.on{background:var(--verde);border-color:var(--verde)} .chip.perdida.on{background:var(--faint);border-color:var(--faint)}
.campo select,.campo input,.campo textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--card)}
.campo textarea{min-height:70px;resize:vertical}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:8px 10px;border-radius:12px;font-size:13px;line-height:1.45;background:var(--line-2);align-self:flex-start;white-space:pre-wrap}
.msg.saida{background:var(--brand-soft);align-self:flex-end}
.msg small{display:block;color:var(--faint);font-size:10.5px;margin-top:3px}
.enviar{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.enviar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px}
.aviso-p{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--faint);font-size:12.5px;line-height:1.6;text-align:center}
.vaga{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;background:var(--brand-softer)}
.vaga b{font-size:14px}
.vaga .liv{color:var(--muted);font-size:12px;margin-top:2px}
.vaga .acs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.filtros .chip{padding:4px 9px;font-size:11.5px}
.ag-item{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between}
.ag-item .st{color:var(--muted)}
.salvo{font-size:11.5px;color:var(--verde);font-weight:600;margin-left:8px}
@media(max-width:760px){#painel.aberto{position:fixed;inset:0;top:0;width:100%;flex-basis:100%;height:100%;z-index:40}}

.filtros-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
body.embed .topbar{display:none}
.fb-busca,.fb-sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.fb-busca{min-width:200px}.fb-chk{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.fb-n{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.fundo{position:fixed;inset:0;background:rgba(20,26,46,.42);display:grid;place-items:center;padding:20px;z-index:50}
.janela{background:var(--card);border-radius:var(--r);padding:22px;width:100%;max-width:400px;
  box-shadow:0 20px 50px rgba(20,26,46,.2)}
.janela h3{font-size:16px;font-weight:700}
.janela p{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:4px}
.campo{margin-top:14px}
.campo label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.campo select,.campo input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--card)}
.janela-fim{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px}
.btn.g{background:var(--card);color:var(--muted);border:1px solid var(--line)}
</style>
<style>body.embed .voltar,body.embed .topbar h1{display:none}body.embed .topbar{height:auto;min-height:0;background:transparent;backdrop-filter:none;border-bottom:0;padding:10px 18px 0;position:static;justify-content:flex-end}body.embed .topbar:not(:has(.ferr)):not(:has(.abas)):not(:has(button)){display:none}</style><script>if(new URLSearchParams(location.search).get('embed')==='1'){document.documentElement.classList.add('embed');document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('embed'));}</script>
<style>
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink,#141A2E);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(20,26,46,.25);display:flex;align-items:center;gap:12px;animation:tin .18s ease-out;max-width:560px}
.toast.erro{background:#B3261E}.toast.ok{background:#1F7A4D}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
.toast button:hover{background:rgba(255,255,255,.24)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<script>
// aviso discreto no rodapé, com ação opcional (ex.: desfazer)
function toast(msg, opts){ opts = opts || {}; let box = document.getElementById('toasts'); if(!box){ box = document.createElement('div'); box.id='toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast' + (opts.tipo?' '+opts.tipo:''); el.innerHTML = `<span>${msg}</span>${opts.acao?`<button type="button">${opts.acao}</button>`:''}`;
  if(opts.acao) el.querySelector('button').onclick = () => { el.remove(); opts.onAcao && opts.onAcao(); };
  box.appendChild(el); setTimeout(() => el.remove(), opts.ms || (opts.acao ? 7000 : 3500)); return el; }
// mensagem pro painel (quando embutido): trocar de tela sem sair
function irPara(pagina){ if(window.parent !== window) window.parent.postMessage({ capta:'ir', pagina }, '*'); else location.href = pagina + location.search; }
</script>

<script>
// Quem está usando: vem do login (?u=Nome&papel=) e fica salvo por negócio.
window.CaptaUser = (function(){
  const q = new URLSearchParams(location.search); const slug = q.get('t') || '';
  const K = 'capta_user_' + slug;
  let u = null; try { u = JSON.parse(localStorage.getItem(K) || 'null'); } catch(e){}
  if (q.get('u')) { u = { nome: q.get('u'), papel: q.get('papel') || 'atendente' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} }
  return {
    nome: () => (u && u.nome) || '',
    papel: () => (u && u.papel) || '',
    definir: nome => { u = { nome, papel: (u && u.papel) || 'atendente' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    sair: () => { try { localStorage.removeItem(K); } catch(e){} }
  };
})();
</script>

<body>
<div class="topbar">
  <a class="voltar" id="voltar" href="/dashboard.html">← Painel</a>
  <h1>Funil</h1>
  <span class="dica">Arraste o card para mudar de etapa</span>
</div>

<div class="tela"><div id="raiz" class="aviso">Carregando…</div></div>
<div id="modal"></div>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
document.getElementById('voltar').href = `/dashboard.html?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;

let etapas = [], leads = [], motivos = [], arrastado = null;

async function api(acao, extra = {}) {
  const r = await fetch('/api/capta-whatsapp', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ acao, slug: SLUG, token: TOKEN, ...extra })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`);
  return d;
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// "Parado há X dias" é o dado que o Kommo não dá sem abrir card por card.
function parado(iso) {
  if (!iso) return { txt: '', cls: '' };
  const dias = Math.floor((Date.now() - new Date(iso)) / 864e5);
  if (dias < 1)  return { txt: 'hoje', cls: '' };
  if (dias === 1) return { txt: 'ontem', cls: '' };
  const txt = `parado há ${dias} dias`;
  if (dias >= 14) return { txt, cls: 'grave' };
  if (dias >= 7)  return { txt, cls: 'alerta' };
  return { txt, cls: '' };
}

async function carregar() {
  try {
    const d = await api('funil');
    etapas = d.etapas; leads = d.leads; motivos = d.motivos || [];
    if (!etapas.length) {
      document.getElementById('raiz').className = 'aviso';
      document.getElementById('raiz').innerHTML =
        'Nenhuma etapa cadastrada ainda.<br>Cadastre as etapas do seu funil para começar.';
      return;
    }
    desenhar();
    try { const pd = JSON.parse(localStorage.getItem('capta_abrir_lead')||'null'); if (pd && Date.now() - pd.t < 60000) { localStorage.removeItem('capta_abrir_lead'); if (leads.find(x => x.id === pd.id)) LeadPainel.abrir(pd.id, pd.aba || 'conversa'); } } catch(e){}
  } catch (e) {
    document.getElementById('raiz').className = 'aviso';
    document.getElementById('raiz').textContent = e.message;
  }
}

const F = { parado: 0, temp: '', busca: '', ordem: 'recente', esconderFrios: false };
const diasParado = l => Math.floor((Date.now() - new Date(l.etapa_em || l.criado_em).getTime()) / 864e5);
function filtrar(lista) {
  const q = F.busca.trim().toLowerCase();
  let out = lista.filter(l => (!F.parado || diasParado(l) >= F.parado)
    && (!F.temp || (l.temperatura||'').toLowerCase() === F.temp)
    && (!q || (l.nome||'').toLowerCase().includes(q) || (l.contato||'').includes(q))
    && !(F.esconderFrios && (l.temperatura||'').toLowerCase() === 'frio' && diasParado(l) >= 30));
  const peso = { quente: 0, morno: 1, frio: 2 };
  if (F.ordem === 'temperatura') out.sort((a,b) => (peso[(a.temperatura||'').toLowerCase()] ?? 3) - (peso[(b.temperatura||'').toLowerCase()] ?? 3) || diasParado(b) - diasParado(a));
  else if (F.ordem === 'parado') out.sort((a,b) => diasParado(b) - diasParado(a));
  else out.sort((a,b) => new Date(b.etapa_em||b.criado_em) - new Date(a.etapa_em||a.criado_em));
  return out;
}
function barraFiltros(total, vis) {
  return `<div class="filtros-bar">
    <input class="fb-busca" placeholder="Buscar nome ou telefone" value="${esc(F.busca)}" oninput="F.busca=this.value;desenhar()">
    <select class="fb-sel" onchange="F.parado=+this.value;desenhar()"><option value="0" ${F.parado===0?'selected':''}>Parado: qualquer</option><option value="3" ${F.parado===3?'selected':''}>Parado há 3+ dias</option><option value="7" ${F.parado===7?'selected':''}>7+ dias</option><option value="30" ${F.parado===30?'selected':''}>30+ dias</option></select>
    <select class="fb-sel" onchange="F.temp=this.value;desenhar()"><option value="" ${!F.temp?'selected':''}>Temperatura: todas</option><option value="quente" ${F.temp==='quente'?'selected':''}>Quer fechar</option><option value="morno" ${F.temp==='morno'?'selected':''}>Considerando</option><option value="frio" ${F.temp==='frio'?'selected':''}>Só conhecendo</option></select>
    <select class="fb-sel" onchange="F.ordem=this.value;desenhar()"><option value="recente" ${F.ordem==='recente'?'selected':''}>Mais recente primeiro</option><option value="temperatura" ${F.ordem==='temperatura'?'selected':''}>Quentes primeiro</option><option value="parado" ${F.ordem==='parado'?'selected':''}>Mais parado primeiro</option></select>
    <label class="fb-chk"><input type="checkbox" ${F.esconderFrios?'checked':''} onchange="F.esconderFrios=this.checked;desenhar()"> esconder frios parados há 30+ dias</label>
    <span class="fb-n">${vis} de ${total}</span></div>`;
}
function desenhar() {
  const raiz = document.getElementById('raiz');
  raiz.className = 'raia-area';

  const vis = filtrar(leads);
  const semEtapa = vis.filter(l => !l.etapa_id);
  const colunas = etapas.map(e => ({ e, itens: vis.filter(l => l.etapa_id === e.id) }));
  if (semEtapa.length) colunas.unshift({ e: { id: '', nome: 'Sem etapa', cor: '#9AA1B4' }, itens: semEtapa });

  raiz.innerHTML = barraFiltros(leads.length, vis.length) + `<div class="raias">${colunas.map(c => `
    <section class="raia" data-etapa="${c.e.id}">
      <div class="raia-cab">
        <span class="raia-cor" style="background:${esc(c.e.cor || '#2E5BFF')}"></span>
        <span class="raia-nome">${esc(c.e.nome)}</span>
        <span class="raia-qtd">${c.itens.length}</span>
      </div>
      <div class="raia-corpo">
        ${c.itens.length ? c.itens.map(cartao).join('') : '<div class="vazia">Nenhum lead aqui' + (c.e.id ? '' : '') + '</div>'}
      </div>
    </section>`).join('')}</div>`;

  ligar();
}

function cartao(l) {
  const pd = parado(l.etapa_em || l.criado_em);
  return `<article class="lead" draggable="true" data-lead="${l.id}" onclick="abrirLead('${l.id}')">
    <div class="lead-nome">${esc(l.nome || 'Sem nome')}</div>
    <div class="lead-sub">${esc(l.contato || '')}${l.origem ? ' · ' + esc(l.origem) : ''}</div>
    <div class="lead-fim">
      ${l.temperatura ? `<span class="tag t-${esc(l.temperatura)}">${esc(l.temperatura)}</span>` : ''}
      ${l.atendente ? `<span class="tag t-at">${esc(l.atendente)}</span>` : ''}
      <span class="parado ${pd.cls}">${pd.txt}</span>
      ${l.kommo_lead_id ? `<a class="kommo-lnk" href="https://roboticanorte.kommo.com/leads/detail/${l.kommo_lead_id}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Abrir no Kommo">Kommo ↗</a>` : ''}
    </div>
  </article>`;
}

function ligar() {
  document.querySelectorAll('.lead').forEach(el => {
    el.addEventListener('dragstart', e => {
      arrastado = el.dataset.lead;
      el.classList.add('arrastando');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('arrastando'); arrastado = null; });
  });

  document.querySelectorAll('.raia').forEach(r => {
    r.addEventListener('dragover', e => { e.preventDefault(); r.classList.add('alvo'); });
    r.addEventListener('dragleave', () => r.classList.remove('alvo'));
    r.addEventListener('drop', async e => {
      e.preventDefault();
      r.classList.remove('alvo');
      const etapaId = r.dataset.etapa;
      if (!arrastado || !etapaId) return;

      const lead = leads.find(l => l.id === arrastado);
      if (!lead || lead.etapa_id === etapaId) return;

      const etapa = etapas.find(x => x.id === etapaId);
      // Etapa de perda exige motivo — é o que alimenta o relatório de
      // "por que as pessoas não fecham".
      if (etapa && etapa.tipo === 'perdida') return janelaMotivo(lead, etapa);

      await mover(lead.id, etapaId, null);
    });
  });
}

async function mover(leadId, etapaId, motivo) {
  const l = leads.find(x => x.id === leadId);
  const antes = l.etapa_id;
  l.etapa_id = etapaId; l.etapa_em = new Date().toISOString();
  if (motivo) l.motivo_perda = motivo;
  desenhar();                                   // move na hora, sem esperar a rede
  try {
    await api('mover', { lead_id: leadId, etapa_id: etapaId, motivo });
    const de = etapas.find(x => x.id === antes), para = etapas.find(x => x.id === etapaId);
    toast(`<b>${esc(l.nome||'Lead')}</b> → ${esc(para ? para.nome : '')} · Kommo atualizado`, { acao: 'desfazer', onAcao: () => mover(leadId, antes, null) });
  }
  catch (e) { l.etapa_id = antes; desenhar(); toast(e.message,{tipo:'erro'}); }
}

function fechar() { document.getElementById('modal').innerHTML = ''; }

function janelaMotivo(lead, etapa) {
  const lista = motivos.filter(m => m.etapa === 'nao_matriculou' || !m.etapa);
  document.getElementById('modal').innerHTML = `
    <div class="fundo" id="fundo"><div class="janela">
      <h3>Por que não avançou?</h3>
      <p>${esc(lead.nome || 'Este lead')} vai para ${esc(etapa.nome)}. O motivo é o que permite saber depois o que mais atrapalha as matrículas.</p>
      <div class="campo"><label for="mv">Motivo</label>
        ${lista.length
          ? `<select id="mv">${lista.map(m => `<option>${esc(m.nome)}</option>`).join('')}</select>`
          : `<input id="mv" placeholder="Ex.: preço acima do esperado" autofocus>`}
      </div>
      <div class="janela-fim">
        <button class="btn g" onclick="fechar()">Cancelar</button>
        <button class="btn" id="ok">Confirmar</button>
      </div>
    </div></div>`;

  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fechar(); };
  document.getElementById('ok').onclick = async () => {
    const v = document.getElementById('mv').value.trim();
    fechar();
    await mover(lead.id, etapa.id, v || null);
  };
}


// ===================== gaveta do lead (componente compartilhado) =====================
LeadPainel.init({
  slug: SLUG, token: TOKEN,
  getLead: id => leads.find(x => x.id === id),
  getEtapas: () => etapas,
  onMover: async (l, etapaId, motivo) => { await api('mover', { lead_id: l.id, etapa_id: etapaId, motivo }); desenhar(); },
  onAgendou: () => desenhar(),
  onAtualizou: () => desenhar()
});
function abrirLead(id) { LeadPainel.abrir(id, 'conversa'); }

if (!SLUG || !TOKEN) {
  document.getElementById('raiz').textContent = 'Abra esta página pelo painel do seu negócio.';
} else {
  carregar();
}
</script>
