<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capta · Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2E5BFF; --brand-deep:#1E44D6; --brand-2:#5B8DEF;
  --brand-soft:rgba(46,91,255,.10); --brand-softer:rgba(46,91,255,.06);
  --bg:#F4F6FB; --card:#FFFFFF; --line:#E9ECF3; --line-2:#F1F3F8;
  --ink:#141A2E; --muted:#697089; --faint:#9AA1B4;
  --quente:#E03127; --quente-bg:rgba(224,49,39,.12);
  --morno:#C47A08;  --morno-bg:rgba(224,147,15,.14);
  --frio:#3E6FD6;   --frio-bg:rgba(91,141,239,.15);
  --verde:#16A34A;  --verde-bg:rgba(22,163,74,.12);
  --gray-bg:rgba(105,112,137,.12);
  --r:16px; --shadow:0 1px 2px rgba(20,26,46,.04),0 6px 20px rgba(20,26,46,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
h2{font-size:16px;font-weight:700}

.layout{display:flex;min-height:100%}
.side{width:238px;flex:0 0 238px;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 60px;max-width:1240px;width:100%;margin:0 auto}

.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand-c{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 12px var(--brand-soft)}
.store{display:flex;align-items:center;gap:8px;background:var(--brand-softer);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.store::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde);flex:0 0 auto}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-lbl{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:10px 11px;border-radius:11px;text-align:left;transition:.14s}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor}
.nav-item:hover{background:var(--line-2);color:var(--ink)}
.nav-item.on{background:var(--brand-soft);color:var(--brand)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.who{display:flex;flex-direction:column;padding:4px 8px}
.who b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--faint);text-transform:capitalize}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{display:none;border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:10px;font-size:17px;color:var(--ink)}
.crumb{font-size:17px;font-weight:700;letter-spacing:-.01em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-tag{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 11px;border-radius:99px}
.acct{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}

.reveal{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.upsell{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,var(--brand),#4670FF 60%,var(--brand-2));color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:20px;box-shadow:0 10px 26px var(--brand-soft)}
.up-l{display:flex;align-items:center;gap:13px;min-width:0}
.up-spark{width:38px;height:38px;flex:0 0 auto;background:rgba(255,255,255,.18);border-radius:11px;display:grid;place-items:center;font-size:18px}
.up-l b{display:block;font-size:15px;font-weight:700}
.up-l span{display:block;font-size:12.5px;opacity:.9;margin-top:1px}
.up-btn{margin-left:auto;flex:0 0 auto;background:#fff;color:var(--brand);border:0;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:10px;transition:.14s}
.up-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.15)}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.m-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;background:var(--brand-soft);color:var(--brand)}
.m-ico svg{width:19px;height:19px;stroke:currentColor}
.m-ico.q{background:var(--quente-bg);color:var(--quente)} .m-ico.ok{background:var(--verde-bg);color:var(--verde)}
.m-ico.lock{background:var(--gray-bg);color:var(--faint)}
.m-lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.m-val{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.m-val .lim{font-size:15px;color:var(--faint);font-weight:700}
.m-sub{font-size:12px;color:var(--faint)}

.row2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-eb{font-size:12.5px;color:var(--muted);font-weight:600}
.card-big{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.card-big span{font-size:12.5px;color:var(--faint);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:16px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:22px;background:linear-gradient(180deg,var(--brand),var(--brand-2));border-radius:6px 6px 3px 3px;transition:.2s}
.bar-col:hover .bar{filter:brightness(1.08)}
.bar-col span{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;height:12px}
.tbrow{display:flex;align-items:center;gap:9px;margin-top:13px;font-size:13px}
.tbrow:first-of-type{margin-top:16px}
.tdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.tdot.q{background:var(--quente)}.tdot.m{background:var(--morno)}.tdot.f{background:var(--frio)}
.tlbl{width:52px;color:var(--muted);font-weight:600}
.tbar{flex:1;height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:99px}
.tbar i.q{background:var(--quente)}.tbar i.m{background:var(--morno)}.tbar i.f{background:var(--frio)}
.tbrow b{width:26px;text-align:right;font-variant-numeric:tabular-nums}
.lockcard{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.lockbig{font-size:30px}.muted{color:var(--faint);font-size:12.5px}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.see{font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.see:hover{text-decoration:underline}

.ltable-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ltable{width:100%;border-collapse:collapse;font-size:13.5px}
.ltable th{text-align:left;font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;background:var(--line-2);border-bottom:1px solid var(--line)}
.ltable td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ltable tbody tr{cursor:pointer;transition:.12s}
.ltable tbody tr:hover{background:var(--brand-softer)}
.ltable tbody tr:last-child td{border-bottom:0}
.cell-lead{display:flex;align-items:center;gap:10px}
.cell-lead .nm{font-weight:600;color:var(--ink)}
.cell-lead .sub{font-size:12px;color:var(--faint)}
.av{width:38px;height:38px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
.av.sm{width:34px;height:34px;border-radius:9px;font-size:12px}
.score-cell{font-weight:700;font-variant-numeric:tabular-nums}
.locked-cell{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;justify-content:center}
.tbadge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.tbadge.q{background:var(--quente-bg);color:var(--quente)}
.tbadge.m{background:var(--morno-bg);color:var(--morno)}
.tbadge.f{background:var(--frio-bg);color:var(--frio)}
.tbadge.lock{background:var(--gray-bg);color:var(--faint)}
.lockmini{color:var(--faint)}
.status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:capitalize;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.novo{background:var(--brand-soft);color:var(--brand)}
.status.contatado{background:var(--morno-bg);color:var(--morno)}
.status.fechado{background:var(--verde-bg);color:var(--verde)}
.status.perdido{background:var(--gray-bg);color:var(--muted)}
.mini-up{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:8px}

.lcards{display:none;flex-direction:column;gap:10px}
.lead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.lead.locked{cursor:default;opacity:.9}
.lead .mid{flex:1;min-width:0}
.lead .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .meta{font-size:12px;color:var(--faint);display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.lead .meta .stbadge{text-transform:capitalize;color:var(--muted);font-weight:600}
.lead .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.temp{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.temp.q{background:var(--quente-bg);color:var(--quente)}.temp.m{background:var(--morno-bg);color:var(--morno)}.temp.f{background:var(--frio-bg);color:var(--frio)}
.temp.lock,.score.lock{background:var(--gray-bg);color:var(--faint)}
.score{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.av.lockav{background:var(--gray-bg);color:var(--faint);font-size:16px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--faint);font-size:13.5px;line-height:1.7}

.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:99px;transition:.14s}
.chip:hover{border-color:var(--brand-2);color:var(--ink)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.note{font-size:13px;color:var(--muted);line-height:1.6}
.link-box{display:flex;gap:8px;margin-bottom:16px}
.link-box input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-family:inherit;font-size:13.5px;color:var(--ink)}
.link-box button{border:0;background:var(--brand);color:#fff;font-weight:700;padding:0 20px;border-radius:11px}
.plancard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.feat{position:relative;padding-left:26px;font-size:13.5px;color:var(--ink);margin:9px 0}
.feat::before{content:"✓";position:absolute;left:0;top:-1px;width:18px;height:18px;background:var(--brand-soft);color:var(--brand);border-radius:50%;font-size:11px;font-weight:800;display:grid;place-items:center}
.feat.sm{font-size:12.5px;margin:7px 0}
.plano-eb{font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13.5px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}.row .v{font-weight:700}
.upcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:11px;box-shadow:var(--shadow);position:relative}
.upcard.featured{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow)}
.up-tag{position:absolute;top:-9px;right:16px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:99px}
.upcard-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.upcard-h b{font-size:18px;font-weight:800}.upcard-h span{font-size:14px;font-weight:700;color:var(--brand)}
.btn-up{width:100%;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;padding:11px;border-radius:11px;transition:.14s;margin-top:6px}
.start-card{background:linear-gradient(135deg,rgba(46,91,255,.07),rgba(91,141,239,.04));border:1px solid var(--brand-soft);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.start-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.start-badge{background:var(--brand);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.start-h h3{font-size:18px;font-weight:800;margin:0}
.start-sub{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.start-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.start-step{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.start-step .stn{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--line-2);color:var(--muted)}
.start-step .stn.done{background:rgba(22,163,74,.14);color:#16A34A}
.start-btns{display:flex;gap:10px;flex-wrap:wrap}
.start-btns .btn-up{width:auto;flex:1;min-width:180px;margin-top:0}
.start-btns .btn-ghost{width:auto;flex:1;min-width:160px}
.site-promo{background:linear-gradient(135deg,#141A2E,#243056);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:18px}
.site-promo-t{font-size:16px;margin-bottom:5px}
.site-promo-p{font-size:13px;color:rgba(255,255,255,.82);line-height:1.6;margin-bottom:12px}
.site-promo .btn-up{width:auto;background:#fff;color:var(--brand);margin-top:0}
.zap-mini{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:rgba(37,211,102,.12);text-decoration:none;font-size:16px;line-height:1;transition:.14s;flex:0 0 auto}
.zap-mini:hover{background:rgba(37,211,102,.22);transform:scale(1.06)}
.ltable td:last-child{text-align:right;width:52px}
.btn-up:hover{background:var(--brand-deep)}.btn-up.sm{font-size:12.5px;padding:9px}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.free{background:var(--gray-bg);color:var(--muted)}

.ia-box{margin:16px 0}
.ia-card{background:linear-gradient(135deg,#fff,var(--brand-softer));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.ia-card.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.ia-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ia-h b{font-size:15px;font-weight:700}
.ia-tag{background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;padding:2px 10px;border-radius:99px}
.ia-sub{font-size:12.8px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.ia-f{display:block;margin-bottom:10px}
.ia-f span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ia-f input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:14px;padding:11px 12px}
.ia-f input:focus{outline:none;border-color:var(--brand)}
.ia-err{color:var(--quente);font-size:12.5px;min-height:16px;margin-bottom:6px}
.ia-q{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px}
.ia-qt{font-size:13.5px;font-weight:700;margin-bottom:8px}
.ia-opt{display:flex;justify-content:space-between;align-items:center;font-size:12.8px;color:var(--muted);padding:5px 0;border-top:1px solid var(--line-2)}
.ia-pt{font-weight:800;color:var(--verde)}
.ia-btns{display:flex;gap:9px;margin-top:4px}.ia-btns .btn-up{flex:1;margin-top:0}
.btn-ghost{border:1.5px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:11px 14px;border-radius:11px}
.ia-check{width:42px;height:42px;border-radius:50%;background:var(--verde-bg);color:var(--verde);font-size:22px;font-weight:800;display:grid;place-items:center;margin-bottom:8px}
.ia-spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.scrim,.scrim2{position:fixed;inset:0;background:rgba(20,26,46,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on,.scrim2.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:50;background:var(--card);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -10px 40px rgba(20,26,46,.2)}
.drawer{right:0;top:0;height:100%;width:420px;max-width:92vw;transform:translateX(100%);padding:26px 24px;overflow-y:auto}
.drawer.on{transform:none}
.grab{display:none}
.d-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.d-head h3{font-size:18px;font-weight:800}
.d-head .meta{font-size:12.5px;color:var(--faint)}
.scorebar{background:var(--brand-softer);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:16px}
.scorebar.locked{background:var(--line-2)}
.topl{display:flex;justify-content:space-between;align-items:center}
.topl b{font-size:13px;color:var(--muted)}
.big{font-size:16px;font-weight:800}.big.lock{color:var(--faint);font-size:14px}
.qa{margin-bottom:18px}
.qa .row{padding:8px 0}.qa .a{font-weight:800;color:var(--verde)}
.stbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
.stbtns button{border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:12px;padding:9px 4px;border-radius:10px;text-transform:capitalize;transition:.12s}
.stbtns button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.zap{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;font-weight:700;font-size:14.5px;padding:13px;border-radius:12px;text-decoration:none}

@media(max-width:860px){
  .side{position:fixed;z-index:45;left:0;top:0;height:100%;transform:translateX(-100%);box-shadow:0 0 40px rgba(20,26,46,.18)}
  .side.open{transform:none}
  .burger{display:grid;place-items:center}
  .topbar{padding:0 16px}
  .content{padding:16px 16px 70px}
  .metrics{grid-template-columns:repeat(2,1fr);gap:12px}
  .row2{grid-template-columns:1fr;gap:12px}
  .ltable-wrap{display:none}
  .lcards{display:flex}
  .drawer{left:0;right:0;top:auto;bottom:0;width:100%;max-width:100%;height:auto;max-height:88vh;border-radius:22px 22px 0 0;transform:translateY(100%);padding:20px 18px 30px}
  .drawer.on{transform:none}
  .grab{display:block;width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
  .up-l span{display:none}
  .upsell{padding:14px}
  .m-val{font-size:24px}
}
@media(max-width:400px){ .metrics{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand"><span class="brand-c">C</span>capta</div>
    <div class="store" id="store">—</div>
    <nav class="nav">
      <span class="nav-lbl">Menu</span>
      <button class="nav-item on" data-t="painel"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</button>
      <button class="nav-item" data-t="leads"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Leads</button>
      <button class="nav-item" data-t="forms"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Formulários</button>
      <button class="nav-item" data-t="form"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>Divulgar</button>
      <button class="nav-item" data-t="plano"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6l-8-4z"/></svg>Plano</button>
    </nav>
    <div class="side-foot"><div class="who"><b id="who-nome">—</b><span id="who-plan">—</span></div></div>
  </aside>
  <div class="scrim2" id="side-scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger">☰</button>
      <div class="crumb" id="page-title">Painel</div>
      <div class="top-right">
        <div class="demo-tag" id="demo-tag" style="display:none">Demonstração</div>
        <div class="acct" id="acct">—</div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><div class="grab"></div><div id="drawer-body"></div></div>

<script>
const params   = new URLSearchParams(location.search);
const SLUG     = params.get('t');
const TOKEN    = params.get('k');
const LEADS_API = '/api/capta-leads';
const COLORS   = ['#2E5BFF','#16A34A','#E0930F','#9B5BFF','#E03127','#5B8DEF'];
const ini      = n => (n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const color    = n => COLORS[(n||'A').charCodeAt(0) % COLORS.length];
const tcss     = t => t==='Quente'?'q':t==='Morno'?'m':'f';
const TITLES   = { painel:'Painel', leads:'Leads', forms:'Formulários', form:'Seu link', plano:'Plano' };
const FORMS_API  = '/api/capta-forms';
const CONFIG_API = '/api/capta-config';
const MAYA_API   = '/api/capta-maya';
let CONFIG = { maya:false };
let FORMS  = null;
const IC = {
  users:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2s5 4 5 9a5 5 0 0 1-10 0c0-1.5.6-2.8 1.4-3.8C8 9 9 10 9 11c0-2 1-4 3-9z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
};

let DATA = { tenant:{nome:'—',plano:'free'}, leads:[] };
let DEMO = false, filter = 'all';

const FREE_LIMIT = 30;
const PLAN_PRICE = { free:0, pro:97, business:197, gestao:397 };
const CHECKOUT   = { essencial:'', pro:'', gestao:'' };
const planoAtual = () => DATA.tenant.plano || 'free';
const isFree     = () => planoAtual() === 'free';
const lockedCount = () => DATA.leads.filter(l => l._locked).length;

function applyPlanLimits(){
  DATA.leads.forEach(l => l._locked = false);
  if(!isFree()) return;
  const now = new Date();
  const doMes = DATA.leads
    .filter(l => { const d=new Date(l.criado_em); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); })
    .sort((a,b) => new Date(a.criado_em) - new Date(b.criado_em));
  const trava = new Set(doMes.slice(FREE_LIMIT).map(l => l.id));
  DATA.leads.forEach(l => l._locked = trava.has(l.id));
}

window.goTab = (name) => { const el=document.querySelector('.nav-item[data-t="'+name+'"]'); if(el) el.click(); };
window.goPlano = () => window.goTab('plano');
window.goPlanoFromDrawer = () => { scrim.classList.remove('on'); drawer.classList.remove('on'); window.goPlano(); };
window.goCheckout = (key) => {
  const url = CHECKOUT[key];
  if(url) location.href = url;
  else alert('Assinatura do plano '+key+': cole o link do Mercado Pago em CHECKOUT.'+key+' no dashboard.html.');
};

const view  = document.getElementById('view');
const scrim = document.getElementById('scrim');
const drawer = document.getElementById('drawer');
const dbody  = document.getElementById('drawer-body');
const side   = document.getElementById('side');
const sideScrim = document.getElementById('side-scrim');

function closeSide(){ side.classList.remove('open'); sideScrim.classList.remove('on'); }
document.getElementById('burger').onclick = () => { side.classList.add('open'); sideScrim.classList.add('on'); };
sideScrim.onclick = closeSide;

document.querySelectorAll('.nav-item').forEach(t => t.onclick = () => {
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('page-title').textContent = TITLES[t.dataset.t];
  render(t.dataset.t);
  closeSide();
});
scrim.onclick = () => { scrim.classList.remove('on'); drawer.classList.remove('on'); };

load();

async function load(){
  if(SLUG && TOKEN){
    try{
      const r = await fetch(`${LEADS_API}?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`);
      if(r.ok){ DATA = await r.json(); }
      else throw new Error('api '+r.status);
    } catch(e){ console.warn('caindo p/ demo:', e.message); DEMO=true; DATA=demoData(); }
  } else { DEMO=true; DATA=demoData(); }
  const _po = params.get('plano'); if(_po) DATA.tenant.plano = _po;
  try { const rc = await fetch(CONFIG_API); if(rc.ok) CONFIG = await rc.json(); } catch(e){}
  applyPlanLimits();
  document.getElementById('store').textContent = DATA.tenant.nome;
  document.getElementById('who-nome').textContent = DATA.tenant.nome;
  document.getElementById('who-plan').textContent = 'Plano '+planoAtual();
  document.getElementById('acct').textContent = ini(DATA.tenant.nome);
  document.getElementById('demo-tag').style.display = DEMO ? '' : 'none';
  render('painel');
  if(params.get('tour')==='1') setTimeout(startTour, 500);
}

/* ===== Tour de boas-vindas (primeira entrada) ===== */
function startTour(){
  const steps = [
    { emoji:'🎉', ttl:'Bem-vinda(o) ao Capta!', txt:'Este é o seu painel. Aqui você acompanha, em tempo real, todo mundo que preenche seu formulário — já separado por interesse.' },
    { emoji:'📋', ttl:'Crie seus formulários', txt:'Na aba <b>Formulários</b> você monta perguntas e ganha um link pra divulgar. Cada pessoa que responde vira um lead qualificado aqui.' },
    { emoji:'🔥', ttl:'Leads quentes primeiro', txt:'O Capta pontua cada lead e marca como <b>Quente</b>, <b>Morno</b> ou <b>Frio</b> — você fala primeiro com quem tem mais chance de fechar.' },
    { emoji:'🔒', ttl:'Você está no plano Free', txt:'Os <b>cadeados</b> e selos <b>PRO</b> mostram o que abre no upgrade: mais leads, qualificação por IA e formulários ilimitados. Faça upgrade quando quiser.' },
  ];
  let i = 0;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(20,26,46,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px';
  ov.innerHTML = `<div id="tour-card" style="background:var(--card,#fff);border-radius:20px;max-width:400px;width:100%;padding:28px 26px;box-shadow:0 24px 70px rgba(20,26,46,.4);text-align:center"></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  function paint(){
    const s = steps[i];
    ov.querySelector('#tour-card').innerHTML = `
      <div style="font-size:40px;margin-bottom:10px">${s.emoji}</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:8px;color:var(--ink,#141A2E)">${s.ttl}</div>
      <p style="font-size:14px;line-height:1.6;color:var(--muted,#697089);margin-bottom:20px">${s.txt}</p>
      <div style="display:flex;justify-content:center;gap:6px;margin-bottom:18px">
        ${steps.map((_,k)=>`<span style="width:7px;height:7px;border-radius:50%;background:${k===i?'var(--brand,#2E5BFF)':'var(--line,#E9ECF3)'}"></span>`).join('')}
      </div>
      <button id="tour-next" style="width:100%;border:0;background:var(--brand,#2E5BFF);color:#fff;font-family:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:12px;cursor:pointer">${i<steps.length-1?'Próximo →':'Começar a usar 🚀'}</button>
      ${i<steps.length-1?'<button id="tour-skip" style="margin-top:10px;border:0;background:transparent;color:var(--faint,#9AA1B4);font-family:inherit;font-size:13px;cursor:pointer">Pular tour</button>':''}
    `;
    ov.querySelector('#tour-next').onclick = () => { if(i<steps.length-1){ i++; paint(); } else close(); };
    const sk = ov.querySelector('#tour-skip'); if(sk) sk.onclick = close;
  }
  paint();
}

function counts(){
  const now=new Date(), mes=now.getMonth(), ano=now.getFullYear();
  const isHoje = d => d.toDateString()===now.toDateString();
  let q=0,m=0,f=0,mesC=0,hoje=0;
  DATA.leads.forEach(l => {
    if(l.temperatura==='Quente') q++; else if(l.temperatura==='Morno') m++; else f++;
    const d = new Date(l.criado_em);
    if(d.getMonth()===mes && d.getFullYear()===ano) mesC++;
    if(isHoje(d)) hoje++;
  });
  return {q,m,f,mes:mesC,hoje,total:DATA.leads.length,fechados:DATA.leads.filter(l=>l.status==='fechado').length};
}

function render(tab){ ({painel:renderPainel,leads:renderLeads,forms:renderForms,form:renderForm,plano:renderPlano}[tab])(); }

function freeBanner(c){
  const lk = lockedCount();
  return `<div class="upsell">
    <div class="up-l"><span class="up-spark">✦</span><div>
      <b>${lk>0 ? `${lk} lead${lk>1?'s':''} bloqueado${lk>1?'s':''} este mês` : 'Desbloqueie o plano Pro'}</b>
      <span>${c.mes}/${FREE_LIMIT} leads no mês · temperatura e pontuação liberados no Pro</span>
    </div></div>
    <button class="up-btn" onclick="goPlano()">Fazer upgrade</button>
  </div>`;
}

function metric(icon, cls, label, value, sub){
  return `<div class="metric">
    <div class="m-ico ${cls}">${icon}</div>
    <div class="m-lbl">${label}</div>
    <div class="m-val">${value}</div>
    <div class="m-sub">${sub}</div>
  </div>`;
}

function leadsPorDia(days){
  const today=new Date(); today.setHours(0,0,0,0);
  const b=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); b.push({d,n:0}); }
  DATA.leads.forEach(l=>{ const d=new Date(l.criado_em); d.setHours(0,0,0,0);
    const hit=b.find(x=>x.d.getTime()===d.getTime()); if(hit) hit.n++; });
  return b;
}
function chartCard(){
  const b=leadsPorDia(14), max=Math.max(1,...b.map(x=>x.n));
  const total=b.reduce((s,x)=>s+x.n,0);
  const bars=b.map((x,i)=>{
    const h=Math.max(4,Math.round(x.n/max*100));
    const lbl=(i%2===0)?x.d.getDate():'';
    return `<div class="bar-col"><div class="bar" style="height:${h}%" title="${x.n} lead(s) em ${x.d.toLocaleDateString('pt-BR')}"></div><span>${lbl}</span></div>`;
  }).join('');
  return `<div class="card">
    <div class="card-eb">Leads por dia</div>
    <div class="card-big">${total}<span> nos últimos 14 dias</span></div>
    <div class="bars">${bars}</div>
  </div>`;
}
function tempCard(c){
  if(isFree()) return `<div class="card lockcard"><div class="card-eb">Temperatura</div><div class="lockbig">🔒</div><div class="muted">Disponível no plano Pro</div></div>`;
  const tot=Math.max(1,c.q+c.m+c.f);
  const row=(lbl,n,cls)=>`<div class="tbrow"><span class="tdot ${cls}"></span><span class="tlbl">${lbl}</span><span class="tbar"><i class="${cls}" style="width:${Math.round(n/tot*100)}%"></i></span><b>${n}</b></div>`;
  return `<div class="card"><div class="card-eb">Temperatura dos leads</div>
    ${row('Quente',c.q,'q')}${row('Morno',c.m,'m')}${row('Frio',c.f,'f')}</div>`;
}

function renderPainel(){
  const c = counts();
  const free = isFree();
  const semLeads = (c.total||0) === 0;
  view.innerHTML = `<div class="reveal">
    ${semLeads ? startCard() : ''}
    ${(!free && !semLeads) ? sitePromo() : ''}
    ${free ? freeBanner(c) : ''}
    <div class="metrics">
      ${metric(IC.users,'','Leads no mês', `${c.mes}${free?`<span class="lim">/${FREE_LIMIT}</span>`:''}`, `${c.total} no total`)}
      ${metric(IC.bolt,'','Novos hoje', c.hoje, 'novos contatos')}
      ${free ? metric(IC.flame,'lock','Quentes','🔒','no plano Pro')
             : metric(IC.flame,'q','Quentes', c.q, 'prontos pra fechar')}
      ${metric(IC.check,'ok','Fechados', c.fechados, 'negócios ganhos')}
    </div>
    <div class="row2">${chartCard()}${tempCard(c)}</div>
    <div class="sec-h"><h2>Últimos leads</h2><span class="see" onclick="goTab('leads')">Ver todos</span></div>
    ${leadsList(DATA.leads.slice(0,6))}
  </div>`;
  bindLeads();
}

// Card de primeiros passos — aparece enquanto não há nenhum lead
function startCard(){
  return `<div class="start-card">
    <div class="start-h"><span class="start-badge">Comece aqui</span><h3>Seu formulário já está pronto ✅</h3></div>
    <p class="start-sub">Agora falta o principal: <b>divulgar seu link</b>. Cole na bio do Instagram, no anúncio ou mande no story — cada pessoa que responder vira um lead qualificado aqui.</p>
    <div class="start-steps">
      <div class="start-step"><span class="stn done">✓</span> Formulário criado e qualificando</div>
      <div class="start-step"><span class="stn">2</span> Copie seu link e divulgue</div>
      <div class="start-step"><span class="stn">3</span> Os leads aparecem no painel</div>
    </div>
    <div class="start-btns">
      <button class="btn-up" onclick="copiarLinkPrincipal(this)">📋 Copiar meu link</button>
      <button class="btn-ghost" onclick="goTab('form')">Ver opções de divulgação</button>
    </div>
  </div>`;
}
async function copiarLinkPrincipal(btn){
  let link = '';
  try{
    if(!FORMS) await loadForms();
    const f = (FORMS&&FORMS.forms||[]).find(x=>x.ativo) || (FORMS&&FORMS.forms||[])[0];
    if(f) link = `${location.origin}/capta.html?t=${encodeURIComponent(SLUG)}&f=${encodeURIComponent(f.pubid)}`;
  }catch(e){}
  if(!link) link = `${location.origin}/capta.html?t=${encodeURIComponent(SLUG)}`;
  try{ await navigator.clipboard.writeText(link); if(btn){ const o=btn.textContent; btn.textContent='✓ Link copiado!'; setTimeout(()=>btn.textContent=o,1800); } }
  catch(e){ prompt('Copie seu link:', link); }
}
// Upsell do site — só pra quem já paga (Pro), no Painel
function sitePromo(){
  return `<div class="site-promo">
    <div class="site-promo-t"><b>🚀 Quer um site que capta sozinho?</b></div>
    <p class="site-promo-p">A RISE cria um site profissional pro seu negócio, com formulário inteligente <b>já conectado ao seu Capta</b> — todo lead cai aqui, qualificado.</p>
    <button class="btn-up" onclick="falarRise('site')">Quero meu site → Falar com a RISE</button>
  </div>`;
}

function renderLeads(){
  const c = counts();
  const free = isFree();
  const f = free ? DATA.leads : DATA.leads.filter(l => filter==='all' || tcss(l.temperatura)===filter);
  view.innerHTML = `<div class="reveal">
    ${free ? freeBanner(c) : `<div class="chips">
      <button class="chip ${filter==='all'?'on':''}" data-f="all">Todos ${c.total}</button>
      <button class="chip ${filter==='q'?'on':''}" data-f="q">Quentes ${c.q}</button>
      <button class="chip ${filter==='m'?'on':''}" data-f="m">Mornos ${c.m}</button>
      <button class="chip ${filter==='f'?'on':''}" data-f="f">Frios ${c.f}</button>
    </div>`}
    ${leadsList(f)}
  </div>`;
  if(!free) document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { filter=ch.dataset.f; renderLeads(); });
  bindLeads();
}

function leadsList(leads){
  if(!leads.length) return emptyState();
  const rows = leads.map(l=>leadRow(l, DATA.leads.indexOf(l))).join('');
  const cards = leads.map(l=>leadCard(l, DATA.leads.indexOf(l))).join('');
  return `<div class="ltable-wrap"><table class="ltable">
    <thead><tr><th>Lead</th><th>Origem</th><th>Quando</th><th>Temperatura</th><th>Score</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="lcards">${cards}</div>`;
}
function zapHref(l){
  let n = (l.contato||'').replace(/\D/g,'');
  if(!n) return '';
  if(n.length<=11 && !n.startsWith('55')) n = '55'+n;
  const primeiro = (l.nome||'').split(' ')[0];
  const msg = encodeURIComponent(`Oi ${primeiro}! Sou da ${DATA.tenant.nome}. Vi seu contato pelo formulário — posso te ajudar?`);
  return `https://wa.me/${n}?text=${msg}`;
}

function leadRow(l,i){
  const free=isFree();
  if(l._locked){
    return `<tr class="locked-row"><td colspan="6"><div class="locked-cell">🔒 Lead bloqueado — acima do limite Free <button class="mini-up" onclick="event.stopPropagation();goPlano()">Liberar</button></div></td></tr>`;
  }
  const temp = free ? `<span class="tbadge lock">🔒</span>` : `<span class="tbadge ${tcss(l.temperatura)}">${esc(l.temperatura||'—')}</span>`;
  const score = free ? `<span class="lockmini">🔒</span>` : `${l.score??'–'}`;
  const zap = zapHref(l);
  return `<tr data-i="${i}">
    <td><div class="cell-lead"><span class="av sm" style="background:${color(l.nome)}">${ini(l.nome)}</span><div><div class="nm">${esc(l.nome)}</div><div class="sub">${esc(l.contato||'')}</div></div></div></td>
    <td>${l.origem?esc(l.origem):'—'}</td>
    <td>${timeAgo(l.criado_em)}</td>
    <td>${temp}</td>
    <td class="score-cell">${score}</td>
    <td><span class="status ${l.status||'novo'}">${l.status||'novo'}</span></td>
    <td>${zap?`<a class="zap-mini" href="${zap}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Chamar no WhatsApp">💬</a>`:''}</td>
  </tr>`;
}

function leadCard(l, i){
  if(l._locked){
    return `<div class="lead locked">
      <div class="av lockav">🔒</div>
      <div class="mid"><div class="nm">Lead bloqueado</div><div class="meta"><span>${timeAgo(l.criado_em)}</span> · acima do limite Free</div></div>
      <div class="right"><button class="mini-up" onclick="goPlano()">Liberar</button></div>
    </div>`;
  }
  const right = isFree()
    ? `<span class="temp lock">🔒</span><span class="score lock">🔒</span>`
    : `<span class="temp ${tcss(l.temperatura)}">${esc(l.temperatura||'—')}</span><span class="score">${l.score??'–'}/100</span>`;
  const zap = zapHref(l);
  return `<div class="lead" data-i="${i}">
    <div class="av" style="background:${color(l.nome)}">${ini(l.nome)}</div>
    <div class="mid">
      <div class="nm">${esc(l.nome)}</div>
      <div class="meta">${l.origem?'<span>'+esc(l.origem)+'</span>·':''}<span>${timeAgo(l.criado_em)}</span>${l.status&&l.status!=='novo'?'·<span class="stbadge">'+esc(l.status)+'</span>':''}</div>
    </div>
    <div class="right">${right}${zap?`<a class="zap-mini" href="${zap}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Chamar no WhatsApp">💬</a>`:''}</div>
  </div>`;
}

function emptyState(){ return `<div class="empty">Nenhum lead ainda.<br>Divulgue seu link e eles aparecem aqui — já pontuados.</div>`; }
function bindLeads(){ document.querySelectorAll('tr[data-i], .lead[data-i]').forEach(el => el.onclick=()=>openLead(+el.dataset.i)); }

function openLead(i){
  const l = DATA.leads[i];
  const respostas = Object.values(l.respostas||{});
  const msg = encodeURIComponent(`Oi ${(l.nome||'').split(' ')[0]}! Sou da ${DATA.tenant.nome}. Vi seu contato pelo formulário — posso te ajudar?`);
  const zapNum = (l.contato||'').replace(/\D/g,'');
  const STATUSES = ['novo','contatado','fechado','perdido'];
  const corTemp = tcss(l.temperatura)==='q' ? 'var(--quente)' : tcss(l.temperatura)==='m' ? 'var(--morno)' : 'var(--frio)';
  const scorebar = isFree()
    ? `<div class="scorebar locked">
        <div class="topl"><b>Pontuação</b><span class="big lock">🔒 Disponível no Pro</span></div>
        <button class="btn-up sm" style="margin-top:10px" onclick="goPlanoFromDrawer()">Liberar temperatura e score → upgrade</button>
      </div>`
    : `<div class="scorebar">
        <div class="topl"><b>Pontuação</b><span class="big" style="color:${corTemp}">${l.score??'–'}/100 · ${esc(l.temperatura||'')}</span></div>
      </div>`;
  dbody.innerHTML = `
    <div class="d-head">
      <div class="av" style="background:${color(l.nome)}">${ini(l.nome)}</div>
      <div><h3>${esc(l.nome)}</h3><div class="meta">${esc(l.contato||'')}${l.origem?' · '+esc(l.origem):''}</div></div>
    </div>
    ${scorebar}
    <div class="qa">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)">Respostas no formulário</div>
      ${respostas.length
        ? respostas.map(r=>`<div class="row"><span>${esc(r.label)}</span><span class="a">+${r.pontos}</span></div>`).join('')
        : '<div class="row"><span style="color:var(--faint)">Sem perguntas neste funil</span></div>'}
    </div>
    <div class="stbtns">${STATUSES.map(s=>`<button class="${l.status===s?'on':''}" data-s="${s}">${s}</button>`).join('')}</div>
    <a class="zap" href="https://wa.me/${zapNum}?text=${msg}" target="_blank" rel="noopener">💬 Responder no WhatsApp</a>`;
  dbody.querySelectorAll('.stbtns button').forEach(b => b.onclick=()=>setStatus(l,b.dataset.s));
  scrim.classList.add('on'); drawer.classList.add('on');
}

async function setStatus(l, status){
  l.status = status;
  dbody.querySelectorAll('.stbtns button').forEach(b => b.classList.toggle('on', b.dataset.s===status));
  if(!DEMO){
    fetch(`${LEADS_API}?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ lead_id: l.id, status })
    }).catch(()=>{});
  }
}

window.iaGerar = async () => {
  const nicho=document.getElementById('ia-nicho')?.value.trim();
  const instagram=document.getElementById('ia-insta')?.value.trim();
  const site=document.getElementById('ia-site')?.value.trim();
  if(!nicho){ const e=document.getElementById('ia-err'); if(e) e.textContent='Conta pra IA o que você vende.'; return; }
  renderIA('loading');
  if(DEMO){ await new Promise(r=>setTimeout(r,900)); IA.perguntas=demoPerguntas(nicho); return renderIA('review'); }
  try{
    const r=await fetch(IA_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'gerar',slug:SLUG,token:TOKEN,contexto:{nicho,instagram,site}})});
    const data=await r.json();
    if(!r.ok) return renderIA('erro',data.error);
    IA.perguntas=data.perguntas||[];
    renderIA(IA.perguntas.length?'review':'erro','A IA não retornou perguntas. Tente de novo.');
  }catch(e){ renderIA('erro',e.message); }
};
window.iaSalvar = async () => {
  if(DEMO){ return renderIA('done'); }
  const err=document.getElementById('ia-err');
  try{
    const r=await fetch(IA_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'salvar',slug:SLUG,token:TOKEN,perguntas:IA.perguntas})});
    const data=await r.json();
    if(!r.ok){ if(err) err.textContent=data.error||'Erro ao salvar.'; return; }

function timeAgo(iso){
  const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60) return 'agora';
  if(s<3600) return `há ${Math.floor(s/60)} min`;
  if(s<86400) return `há ${Math.floor(s/3600)} h`;
  return `há ${Math.floor(s/86400)} d`;
}
function esc(s){ return (s||'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

};
window.salvarForm = async (id) => {
  const nome=document.getElementById('ef-nome').value.trim();
  const proposito=document.getElementById('ef-prop').value.trim();
  const pede_email=document.getElementById('ef-email').checked;
  const ativo=document.getElementById('ef-ativo').checked;
  if(DEMO){ Object.assign(FORMS.forms.find(x=>x.id===id),{nome,proposito,pede_email,ativo}); hideDrawer(); paintForms(); return; }
  try{ await fetch(`${FORMS_API}?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',id,nome,proposito,pede_email,ativo})}); FORMS=null; await loadForms(); hideDrawer(); paintForms(); }catch(e){ document.getElementById('ef-err').textContent=e.message; }
};
window.apagarForm = async (id) => {
  if(!confirm('Apagar este formulário e suas perguntas?'))return;
  if(DEMO){ FORMS.forms=FORMS.forms.filter(x=>x.id!==id); hideDrawer(); paintForms(); return; }
  try{ await fetch(`${FORMS_API}?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id})}); FORMS=null; await loadForms(); hideDrawer(); paintForms(); }catch(e){ alert(e.message); }
};

/* ---- editor de perguntas (manual + Maya) ---- */
window.editarPerguntas = (id) => {
  const f=(FORMS.forms||[]).find(x=>x.id===id); if(!f)return;
  EDIT = { formId:id, perguntas:(f.perguntas||[]).map(p=>({texto:p.texto,opcoes:(p.opcoes||[]).map(o=>({label:o.label,pontos:o.pontos}))})) };
  paintEditor(f);
};
function paintEditor(f){
  const maya = CONFIG.maya
    ? `<button class="btn-up" style="width:100%;margin:0 0 12px" onclick="mayaStart()">✨ Gerar com IA (Maya)</button>`
    : `<button class="btn-ghost" style="width:100%;margin:0 0 12px;opacity:.55;cursor:not-allowed" disabled>✨ Gerar com IA (em breve)</button>`;
  showDrawer(`
    <h3 style="font-size:18px;font-weight:800;margin-bottom:3px">Perguntas · ${esc(f.nome)}</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Cada opção vale pontos (0–3). Mais pontos = mais quente.</p>
    ${maya}
    <button class="btn-ghost" style="width:100%;margin:0 0 12px" onclick="usarPerguntasProntas()">📋 Usar perguntas prontas <span style="opacity:.6;font-weight:500">— qualificam qualquer lead</span></button>
    <div id="ed-maya"></div>
    <div id="ed-list">${editorList()}</div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px">+ Adicionar pergunta (manual)</div>
    <label class="ia-f"><span>Pergunta</span><input id="np-txt" placeholder="Ex: Quando quer começar?"></label>
    <label class="ia-f"><span>Opções — uma por linha, com pontos após "|"</span>
      <textarea id="np-ops" rows="3" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:14px;padding:11px 12px" placeholder="Essa semana | 3&#10;Esse mês | 1&#10;Só pesquisando | 0"></textarea></label>
    <div class="ia-err" id="ed-err"></div>
    <button class="btn-ghost" style="width:100%" onclick="addPergunta()">Adicionar pergunta</button>
    <button class="btn-up" style="width:100%;margin-top:8px" onclick="salvarPerguntas()">Salvar formulário (${EDIT.perguntas.length} pergunta${EDIT.perguntas.length!==1?'s':''})</button>`);
}
function editorList(){
  if(!EDIT.perguntas.length) return '<div class="empty" style="padding:18px">Nenhuma pergunta ainda. Adicione manual ou gere com a Maya.</div>';
  return EDIT.perguntas.map((q,i)=>`<div class="ia-q">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="ia-qt">${i+1}. ${esc(q.texto)}</div><button class="btn-ghost" style="padding:3px 9px;font-size:12px" onclick="delPergunta(${i})">✕</button></div>
    ${(q.opcoes||[]).map(o=>`<div class="ia-opt"><span>${esc(o.label)}</span><span class="ia-pt">+${o.pontos}</span></div>`).join('')}
  </div>`).join('');
}
function repaintEditor(){ const f=(FORMS.forms||[]).find(x=>x.id===EDIT.formId)||{nome:''}; paintEditor(f); }
window.usarPerguntasProntas = () => {
  const modelo = [
    {texto:'O que você procura agora?', opcoes:[{label:'Quero contratar / comprar',pontos:3},{label:'Quero um orçamento',pontos:2},{label:'Só tirando dúvidas',pontos:1}]},
    {texto:'Pra quando você precisa?', opcoes:[{label:'Essa semana',pontos:3},{label:'Esse mês',pontos:2},{label:'Sem pressa, pesquisando',pontos:0}]},
    {texto:'Já tem um valor em mente?', opcoes:[{label:'Sim, quero fechar',pontos:3},{label:'Quero entender preços',pontos:1},{label:'Ainda não pensei',pontos:0}]},
  ];
  const existentes = new Set(EDIT.perguntas.map(q=>q.texto));
  modelo.forEach(m=>{ if(!existentes.has(m.texto)) EDIT.perguntas.push(m); });
  repaintEditor();
};
window.addPergunta = () => {
  const txt=document.getElementById('np-txt').value.trim();
  const raw=document.getElementById('np-ops').value.trim();
  if(!txt){ document.getElementById('ed-err').textContent='Escreve a pergunta.'; return; }
  const opcoes = raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split('|'); return {label:(p[0]||'').trim(), pontos:parseInt((p[1]||'0').trim())||0}; }).filter(o=>o.label);
  if(opcoes.length<2){ document.getElementById('ed-err').textContent='Coloca pelo menos 2 opções.'; return; }
  EDIT.perguntas.push({texto:txt,opcoes}); repaintEditor();
};
window.delPergunta = (i) => { EDIT.perguntas.splice(i,1); repaintEditor(); };
window.salvarPerguntas = async () => {
  if(DEMO){ const f=FORMS.forms.find(x=>x.id===EDIT.formId); f.perguntas=EDIT.perguntas.map((q,i)=>({id:'d'+i,ordem:i+1,texto:q.texto,opcoes:q.opcoes})); hideDrawer(); paintForms(); return; }
  try{
    const r=await fetch(`${FORMS_API}?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'salvar_perguntas',id:EDIT.formId,perguntas:EDIT.perguntas})});
    const d=await r.json(); if(!r.ok){ document.getElementById('ed-err').textContent=d.error||'Erro ao salvar'; return; }
    FORMS=null; await loadForms(); hideDrawer(); paintForms();
  }catch(e){ document.getElementById('ed-err').textContent=e.message; }
};

/* ---- Maya ---- */
window.mayaStart = () => {
  document.getElementById('ed-maya').innerHTML = `<div class="ia-card" style="margin-bottom:12px">
    <div class="ia-h"><b>✨ Maya</b><span class="ia-tag">IA</span></div>
    <p class="ia-sub">Conta o que o negócio faz — a Maya monta as perguntas com os pontos.</p>
    <label class="ia-f"><span>Nicho / o que vende</span><input id="my-nicho" placeholder="Ex: escola de natação infantil"></label>
    <label class="ia-f"><span>Instagram (opcional)</span><input id="my-insta" placeholder="@negocio"></label>
    <div class="ia-err" id="my-err"></div>
    <button class="btn-up" style="width:100%" onclick="mayaGerar()">Gerar perguntas ✨</button>
  </div>`;
};
window.mayaGerar = async () => {
  const nicho=document.getElementById('my-nicho').value.trim();
  if(!nicho){ document.getElementById('my-err').textContent='Conta o que o negócio faz.'; return; }
  const instagram=document.getElementById('my-insta').value.trim();
  document.getElementById('ed-maya').innerHTML='<div class="ia-card center" style="margin-bottom:12px"><div class="ia-spin"></div><p class="ia-sub" style="margin-top:8px">Maya está montando as perguntas…</p></div>';
  try{
    const f=(FORMS.forms||[]).find(x=>x.id===EDIT.formId);
    const r=await fetch(MAYA_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'gerar',slug:SLUG,token:TOKEN,contexto:{nicho,instagram,pede_email:!!(f&&f.pede_email)}})});
    const d=await r.json();
    if(!r.ok){ document.getElementById('ed-maya').innerHTML=`<div class="ia-card" style="margin-bottom:12px"><p class="ia-sub">${esc(d.error||'Erro')}</p><button class="btn-up" style="width:100%" onclick="mayaStart()">Tentar de novo</button></div>`; return; }
    (d.perguntas||[]).forEach(q=>EDIT.perguntas.push({texto:q.texto,opcoes:q.opcoes}));
    repaintEditor();
  }catch(e){ document.getElementById('ed-maya').innerHTML=`<div class="ia-card"><p class="ia-sub">${esc(e.message)}</p></div>`; }
};

function demoForms(){
  const plano=planoAtual(), limite=FLIM[plano]||1;
  return { plano, limite, usados:2, forms:[
    { id:'d1', nome:'Formulário principal', proposito:'Captação geral', pubid:'main0001', pede_email:false, ativo:true, leads:8, perguntas:[
      {id:'q1',texto:'Quando você quer começar?',opcoes:[{label:'Essa semana',pontos:3},{label:'Esse mês',pontos:1},{label:'Só pesquisando',pontos:0}]},
      {id:'q2',texto:'A aula é pra você?',opcoes:[{label:'Sim, pra mim',pontos:2},{label:'Pra outra pessoa',pontos:1}]}
    ]},
    { id:'d2', nome:'Campanha Instagram', proposito:'Anúncio de verão', pubid:'insta002', pede_email:true, ativo:true, leads:3, perguntas:[
      {id:'q3',texto:'Qual seu objetivo?',opcoes:[{label:'Emagrecer',pontos:3},{label:'Condicionamento',pontos:2},{label:'Curiosidade',pontos:0}]}
    ]}
  ]};
}
</script>
</body>
