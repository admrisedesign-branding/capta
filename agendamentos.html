<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda — Capta</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/capta.css">
<style>
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,select{font-family:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.voltar{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;padding:7px 13px;border-radius:10px;text-decoration:none}
.ferr{margin-left:auto;display:flex;gap:8px;align-items:center}
.abas{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:10px}
.abas button{border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:8px}
.abas button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.wrap{padding:20px 26px 48px}
.barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
body.embed .topbar{display:none}body.embed .wrap{padding-top:16px}
.nav{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:700;color:var(--muted)}
.periodo{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13.5px;text-transform:capitalize}
.tally{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 18px;display:flex;gap:26px;margin-bottom:14px;flex-wrap:wrap}
.tally b{font-size:22px;font-weight:800;margin-right:6px}.tally small{color:var(--muted);font-weight:600;font-size:12.5px}.tally .hot b{color:var(--morno)}.tally .bad b{color:var(--quente)}
.corpo{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
@media(max-width:980px){.corpo{grid-template-columns:1fr}}
.lado{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.lado h5{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.lado .k{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-2)}.lado .k:last-child{border:0}
.leg{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:11.5px;color:var(--faint)}
.leg span{display:flex;gap:8px;align-items:center}.leg i{width:6px;height:20px;border-radius:3px;display:inline-block}

/* DIA */
.dia{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dia .cab{display:grid;grid-template-columns:110px 1fr 1fr;font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line)}
.linha{display:grid;grid-template-columns:110px 1fr 1fr;min-height:74px;border-bottom:1px solid var(--line-2)}
.linha:last-child{border-bottom:0}
.hora{padding:10px 14px}.hora b{font-size:15px;font-weight:700;color:var(--muted)}.hora .v{font-size:12px;font-weight:700;color:var(--verde);margin-top:2px}.hora .v.z{color:var(--quente)}.hora .v.n{color:var(--faint);font-weight:600}
.cel{padding:6px 8px;border-left:1px solid var(--line-2)}
.bloco{border-left:4px solid var(--brand-2);background:var(--brand-softer);border-radius:10px;padding:8px 10px;height:100%}
.bloco.exp{border-left-color:var(--exp);background:var(--exp-bg)}
.bloco .t{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}.bloco .t b{color:var(--brand)}.bloco.exp .t b{color:var(--exp)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:700;line-height:1.2}
.pill small{display:block;font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bloco.exp .pill{color:var(--exp)}.bloco.exp .pill small{color:var(--exp);opacity:.75;text-transform:none;letter-spacing:0}
.pill.cont{cursor:pointer}
.interv{color:var(--faint);font-size:12.5px;padding:10px 8px}

/* SEMANA */
.sem{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;min-width:760px}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);min-height:260px}
.col.hoje{border-color:var(--brand)}
.col h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.mini{border-left:3px solid var(--brand-2);background:var(--brand-softer);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px}
.mini.exp{border-left-color:var(--exp);background:var(--exp-bg)}
.mini b{display:block;font-size:12.5px}.mini .v{font-weight:700;color:var(--verde)}.mini .v.z{color:var(--quente)}
.scrollx{overflow-x:auto}

/* MÊS */
.mes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:760px}
.mes .hd{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px}
.dcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:84px;cursor:pointer}
.dcell:hover{border-color:var(--brand)}
.dcell.hoje{border-color:var(--brand)}.dcell.fora{opacity:.4}
.dcell .n{font-weight:800;font-size:13px}
.dcell .i{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.dcell .i b{color:var(--ink)}
.dcell .lin{cursor:pointer;padding:1px 0;border-radius:4px}
.dcell .lin:hover{background:var(--brand-softer)}
.dcell .lin.e{color:var(--exp)}.dcell .lin.e b{color:var(--exp)}
.dcell .lin.r{color:#5B3FBF}.dcell .lin.r b{color:#5B3FBF}
.dcell .lin.z{color:var(--quente);font-weight:700;cursor:default}.dcell .i .e{color:var(--exp);font-weight:700}.dcell .i .z{color:var(--quente);font-weight:700}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer}.btn.g{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.fundo{position:fixed;inset:0;background:rgba(20,26,46,.42);display:grid;place-items:center;padding:20px;z-index:50}
.janela{background:var(--card);border-radius:var(--r);padding:22px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(20,26,46,.2);max-height:92vh;overflow-y:auto}
.janela h3{font-size:16px;font-weight:700}.janela p{color:var(--muted);font-size:13px;margin-top:4px}
.campo{margin-top:12px}.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.campo input,.campo select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);background:var(--card);font-family:inherit}
.l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fim{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.lista-leads{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.lead-op{padding:8px 11px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:8px}.lead-op:hover,.lead-op.on{background:var(--brand-softer)}.lead-op small{color:var(--faint)}
.vagas3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.vg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;cursor:pointer}.vg.on{border-color:var(--brand);background:var(--brand-softer)}.vg b{display:block;font-size:13px}.vg small{color:var(--muted)}
.pill[draggable]{cursor:grab}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--faint);line-height:1.7}
/* ---- card do dia (rotina da recepção) ---- */
.cardx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;position:relative}
.cardx.win{border-color:rgba(22,163,74,.4)}.cardx.lost{border-color:rgba(224,49,39,.35)}.cardx.hold{border-color:rgba(224,147,15,.4)}.cardx.gone{opacity:.8}
.cardx .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardx .hora{font-weight:800;font-size:15px;color:var(--muted);min-width:52px}
.cardx .kid{font-weight:800;font-size:15px}.cardx .kid em{font-style:normal;font-weight:600;color:var(--faint);font-size:12.5px;margin-left:4px}
.cardx .guard{font-size:12.5px;color:var(--muted);margin-top:2px}
.cardx .sinal{font-size:12.5px;color:var(--ink);background:var(--line-2);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}
.cardx .scriptbtn{position:absolute;right:14px;top:12px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 9px}
.cardx .scriptbtn:hover{color:var(--brand);border-color:var(--brand)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--muted)}
.acts button.yes{background:var(--verde);border-color:var(--verde);color:#fff}.acts button.nope{background:rgba(224,49,39,.1);border-color:rgba(224,49,39,.25);color:var(--quente)}
.menu{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.menu p{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.menu .chips{margin-top:4px}
.menu textarea,.menu input,.menu select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card)}
.menu .l2{margin-top:8px}
.menu .save{margin-top:8px}
.done{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.done.win{background:var(--verde-bg)}.done.lost{background:rgba(224,49,39,.1)}.done.hold{background:rgba(224,147,15,.14)}.done.neutral{background:var(--line-2)}
.done .undo{border:0;background:transparent;font-weight:700;color:var(--muted);text-decoration:underline;white-space:nowrap}
.vagas3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:760px){.vagas3{grid-template-columns:1fr}}
.vg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.vg b{display:block;font-size:13px}.vg small{color:var(--muted)}
.vg button{margin-top:6px;width:100%}
.badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--line-2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.badge.q{background:rgba(224,49,39,.12);color:var(--quente)}.badge.m{background:rgba(224,147,15,.14);color:var(--morno)}.badge.f{background:var(--brand-soft);color:var(--brand)}
.acts.quatro{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts.quatro button{padding:14px 12px;font-size:15px;font-weight:700;border-radius:12px}
.acts.quatro .yes{background:#3C8C5A;border-color:#3C8C5A}
.acts.quatro .nope{background:#FCF1EF;border-color:#F1CFC9;color:#C5392E}
.acts.mini{margin-top:6px;gap:12px}.acts.mini button{border:0;background:transparent;padding:2px 0;font-size:12px;color:var(--faint);text-decoration:underline}
.acts-mini{display:flex;gap:4px;margin-top:6px}
.acts-mini button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 0;font-weight:800;font-size:11px;color:var(--muted);cursor:pointer}
.acts-mini .yes{background:var(--verde);border-color:var(--verde);color:#fff}.acts-mini .nope{background:rgba(224,49,39,.1);border-color:rgba(224,49,39,.25);color:var(--quente)}
.mes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:760px}.mes .hd{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px}
.dcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:84px;cursor:pointer}.dcell:hover,.dcell.hoje{border-color:var(--brand)}.dcell.fora{opacity:.4}
.dcell .n{font-weight:800;font-size:13px}.dcell .i{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}.dcell .i b{color:var(--ink)}
.dcell .lin{cursor:pointer;padding:1px 0;border-radius:4px}
.dcell .lin:hover{background:var(--brand-softer)}
.dcell .lin.e{color:var(--exp)}.dcell .lin.e b{color:var(--exp)}
.dcell .lin.r{color:#5B3FBF}.dcell .lin.r b{color:#5B3FBF}
.dcell .lin.z{color:var(--quente);font-weight:700;cursor:default}.dcell .i .e{color:var(--verde);font-weight:700}.dcell .i .z{color:var(--quente);font-weight:700}
.ev[draggable]{cursor:grab}.cardx[draggable]{cursor:grab}.cardx[draggable] button,.cardx[draggable] input,.cardx[draggable] textarea{cursor:pointer}

/* filtro de tipo e reposição */
.filtro-linha{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.filtro-tipo{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:10px}
.filtro-tipo button{border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.filtro-tipo button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.filtro-tipo button .q{opacity:.65;margin-left:4px}
.pill.rep,.mini.rep{background:#EFEAFF!important;border-color:#D6CCFF!important;color:#5B3FBF!important}
.bloco.rep{border-left-color:#7C5CDB;background:#F6F3FF}
.et-rep{background:#EFEAFF;color:#5B3FBF}
.aluno-jan .linha-f{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.aluno-jan .linha-f:last-child{border:0}
.falta{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:13px}
.falta b{font-weight:700}.falta button{margin-left:auto}
.vg.rep{background:#F6F3FF;border-color:#D6CCFF}

/* ---- dia: matriculados de um lado, visitas do outro ---- */
.bloco-dia{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.bd-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bd-cab b{font-size:16px;font-weight:800}
.bd-sub{font-size:12.5px;color:var(--muted);font-weight:600}
.bd-cab .cap{margin-left:auto}
.bd-corpo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.bd-corpo{grid-template-columns:1fr}.gradeq{min-width:900px}}
.bd-col{min-width:0}
.bd-tit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-left:9px;border-left:3px solid}
.bd-tit.azul{color:var(--brand);border-color:var(--brand-2)}
.bd-tit.laranja{color:#B8522F;border-color:var(--exp)}
.grade{display:grid;grid-template-columns:80px repeat(6,1fr);gap:8px;min-width:820px}
.gh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:4px 6px}
.gb{font-size:12px;font-weight:700;color:var(--muted);padding:10px 6px}
.cel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:64px}
.cel.vazia{background:var(--card);border-style:dashed;display:grid;place-items:center;color:var(--faint);font-size:12px;font-weight:600}
.cel .t{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);margin-bottom:6px}
.cel .t b{color:var(--ink)}
.al{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 4px;border-radius:7px;cursor:pointer}
.al:hover{background:var(--line-2)}
.al .k{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.al .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al.tr{opacity:.55}.al.tr .n{text-decoration:line-through}
.kits{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.kt{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--line-2);color:var(--muted)}
.kt.cheio{background:rgba(224,49,39,.12);color:var(--quente)}
.kt.alerta{background:rgba(224,147,15,.14);color:var(--morno)}
.legenda{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 0;font-size:12px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:5px}


/* experimental e reposição dentro da mesma célula */
.cel .sep{height:1px;background:var(--line-2);margin:7px 0}
.al.exp{background:var(--exp-bg);color:#B8522F;font-weight:700}
.al.exp:hover{background:#FBE2D5}
.al.exp .k{background:var(--exp)}
.al.rep{background:#EFEAFF;color:#5B3FBF;font-weight:700}
.al.rep .k{background:#7C5CDB}
.al .hr{margin-left:auto;font-size:10.5px;font-weight:700;opacity:.7}
.cel.temexp{border-color:#F3D3C4}
.al.mais{color:var(--brand);font-weight:700;justify-content:center;border:1px dashed var(--line);margin-top:4px}
.al.mais:hover{border-color:var(--brand);background:var(--brand-softer)}
.cel .t .cap{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--line-2);color:var(--muted)}
.cel .t .cap.alerta{background:var(--morno-bg);color:var(--morno)}
.cel .t .cap.cheio{background:var(--quente-bg);color:var(--quente)}

.hora-livre{display:flex;align-items:center;gap:9px;border:1px dashed var(--line);border-radius:12px;padding:9px 12px;margin-top:7px;cursor:pointer;transition:.12s}
.hora-livre:hover{border-color:var(--exp);background:var(--exp-bg)}
.hora-livre b{font-size:14px;font-weight:800;color:var(--ink)}
.hora-livre span{font-size:12.5px;color:var(--muted);font-weight:600}
.hora-livre .cadeiras{margin-left:auto;display:flex;gap:3px}
.hora-livre .cadeiras i{width:11px;height:11px;border-radius:3px;background:var(--exp);opacity:.85;display:inline-block}
.hora-livre .cadeiras i.ocup{background:var(--line);opacity:1}
.hora-livre.cheia{cursor:default;opacity:.6}
.hora-livre.cheia:hover{border-color:var(--line);background:transparent}

.cel.livre{background:transparent;border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;min-height:64px}
.cel.livre:hover{border-color:var(--exp);background:var(--exp-bg)}
.cel.livre .lv{font-size:12.5px;font-weight:800;color:var(--muted)}
.cel.livre:hover .lv{color:#B8522F}
.cel.livre .lv2{font-size:11.5px;color:var(--faint);font-weight:600}
.cel.vazia{opacity:.5}
.assentos-horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.assentos-horas .hora-livre{margin-top:0}
.cel.cont{background:linear-gradient(180deg,rgba(46,91,255,.035),transparent);border-top-style:dashed}
.cel .segue{font-size:11px;color:var(--faint);font-weight:600}
.cel.vazia.passou{border-style:solid;border-color:var(--line-2);background:transparent;opacity:.35}

/* hora livre: já nasce visível, azul clarinho, pronta pra clicar */
.cel.livre{background:rgba(46,91,255,.05);border:1px dashed var(--brand-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;cursor:pointer;min-height:64px;transition:.12s}
.cel.livre:hover{background:var(--brand-soft);border-color:var(--brand)}
.cel.livre .lv-h{font-size:13.5px;font-weight:800;color:var(--brand)}

  const el = document.createElement('div'); el.className = 'toast' + (opts.tipo?' '+opts.tipo:''); el.innerHTML = `<span>${msg}</span>${opts.acao?`<button type="button">${opts.acao}</button>`:''}`;

  box.appendChild(el); setTimeout(() => el.remove(), opts.ms || (opts.acao ? 7000 : 3500)); return el; }

<script>
// Quem está usando: vem do login (?u=Nome&papel=) e fica salvo por negócio.
window.CaptaUser = (function(){
  const q = new URLSearchParams(location.search); const slug = q.get('t') || '';
  const K = 'capta_user_' + slug;
  let u = null; try { u = JSON.parse(localStorage.getItem(K) || 'null'); } catch(e){}
  if (q.get('u')) { u = { nome: q.get('u'), papel: q.get('papel') || 'atendente', email: q.get('e') || (u&&u.email) || '' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} }
  return {
    nome: () => (u && u.nome) || '',
    papel: () => (u && u.papel) || '',
    email: () => (u && u.email) || '',
    telas: () => (u && u.telas) || null,
    definir: nome => { u = { ...(u||{}), nome, papel: (u && u.papel) || 'atendente' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    setar: o => { u = { ...(u||{}), ...o }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    sair: () => { try { localStorage.removeItem(K); } catch(e){} }
  };
})();
</script>

<body>
<div class="topbar">
  <a class="voltar" id="voltar" href="/dashboard.html">← Painel</a>
  <h1>Agenda</h1>

</div>
<div class="wrap" id="raiz"><div class="vazio">Carregando…</div></div>
<div id="modal"></div>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
document.getElementById('voltar').href = `/dashboard.html?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;
const ajuda = txt => (window.ajudaHTML ? ajudaHTML(txt) : '');

// Data de hoje no fuso de Manaus — new Date().toISOString() usa UTC e, depois das 20h,
// mostra o dia seguinte.
function hojeLocal(){ const d = new Date(Date.now() - 4*3600*1000); return d.toISOString().slice(0,10); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'], DIAS3 = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const hoje = hojeLocal();
const iso = d => d.toISOString().slice(0,10);
const addDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return iso(x); };
const segunda = d => { const x = new Date(d + 'T12:00:00'); const w = x.getDay(); x.setDate(x.getDate() - (w === 0 ? 6 : w - 1)); return iso(x); };
const dow = d => new Date(d + 'T12:00:00').getDay();
const hh = t => String(t||'').slice(0,5);
const hN = t => parseInt(String(t||'0').slice(0,2), 10);
const fmt = (d, o) => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', o);
const corKit = k => (D.kits.find(x => x.kit === k) || {}).cor || '#9AA1B4';
const KITCUR = k => (k||'').replace('App Developer','APP').replace('Bot','').toUpperCase();

let MODO = 'semana', SEL = hoje, D = { turmas: [], alunos: [], kits: [] }, EXP = [], LEADS = [], VAGAS = [], carregadoDe = null, carregadoAte = null;

const CACHE = new Map();
async function api(acao, extra = {}, cacheMs) {
  const chave = acao + JSON.stringify(extra);
  if (cacheMs) { const c = CACHE.get(chave); if (c && Date.now() - c.t < cacheMs) return c.d; }
  const r = await fetch('/api/capta-whatsapp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ acao, slug:SLUG, token:TOKEN, email_atual: (window.CaptaUser && CaptaUser.email && CaptaUser.email()) || undefined, ...extra }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`);
  if (cacheMs) CACHE.set(chave, { t: Date.now(), d });
  return d;
}
async function carregar(){
  try {
    const de = addDias(segunda(SEL), -35), ate = addDias(segunda(SEL), 42);
    const [al, ex] = await Promise.all([api('alunos', {}, 60000), api('experimentais', { de, ate }, 20000)]);
    D = { ...al, agendamentos: ex.agendamentos || [] }; EXP = ex.agendamentos || []; LEADS = ex.leads || []; carregadoDe = de; carregadoAte = ate; desenhar();
    // vagas vêm depois: a grade já aparece, os números de vaga entram em seguida
    api('agenda', { dias: 45 }, 45000).then(ag => { VAGAS = ag.horarios || []; desenhar(); }).catch(() => {});
  } catch(e){ document.getElementById('raiz').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}
function modo(m){ MODO = m; desenhar(); }
const abasHtml = () => `<div class="abas" style="margin-left:auto">${[['semana','Semana'],['mes','Mês'],['dia','Dia']].map(([k,t])=>`<button class="${MODO===k?'on':''}" onclick="modo('${k}')">${t}</button>`).join('')}</div>`;
function mover(n){
  if (MODO === 'dia') SEL = addDias(SEL, n); else if (MODO === 'semana') SEL = addDias(SEL, 7*n);
  else { const x = new Date(SEL + 'T12:00:00'); x.setMonth(x.getMonth() + n, 1); SEL = iso(x); }
  if (!carregadoDe || SEL < carregadoDe || SEL > carregadoAte) carregar(); else desenhar();
}
function irDia(d){ SEL = d; modo('dia'); }
const turmasDo = d => D.turmas.filter(t => t.ativa !== false && t.dia_semana === dow(d));
const alunosDa = t => TIPO === 'experimental' ? [] : D.alunos.filter(a => a.turma_id === t.id && a.status === 'ativo');
const expDo = d => EXP.filter(a => a.data === d && !['cancelado','remarcado'].includes(a.status) && !a.remarcado_para
  && (TIPO === 'todos' || (TIPO === 'experimental' && ehExp(a)) || (TIPO === 'alunos' && ehRep(a))));
const leadDe = a => LEADS.find(l => l.id === a.lead_id) || {};
const vagaDe = (t, d) => VAGAS.find(v => v.turma_id === t.id && v.data === d);
function vagasHora(d, h){ // turma que cobre a hora h no dia d
  const t = turmasDo(d).find(t => hN(t.hora_inicio) <= h && h < hN(t.hora_fim)); if (!t) return null;
  const v = vagaDe(t, d); if (v) return { n: v.vagas, t };
  // sem cálculo do servidor (data passada): estima pelo kit First
  const cap = (D.kits.find(k => k.kit === 'First') || {}).capacidade || 8;
  return { n: Math.max(0, cap - alunosDa(t).filter(a => a.kit === 'First').length - expDo(d).filter(e => e.turma_id === t.id).length), cap, t };
}

function tally(dias){
  const emAula = dias.reduce((s, d) => s + turmasDo(d).reduce((x, t) => x + alunosDa(t).length, 0), 0);
  const exps = dias.reduce((s, d) => s + EXP.filter(a => a.data === d && ehExp(a) && !['cancelado','remarcado'].includes(a.status)).length, 0);
  let semVaga = 0; dias.forEach(d => turmasDo(d).forEach(t => { const v = vagasHora(d, hN(t.hora_inicio)); if (v && v.n <= 0) semVaga++; }));
  const reps = dias.reduce((s, d) => s + EXP.filter(a => a.data === d && ehRep(a) && !['cancelado','remarcado'].includes(a.status)).length, 0);
  return `<div class="tally"><div><b>${emAula}</b><small>alunos em aula${ajuda('Crianças já matriculadas, nas turmas do período. A vaga delas é fixa: não entra na conta da aula experimental.')}</small></div><div><b>${exps}</b><small>aulas experimentais${ajuda('Visitas de 1 hora de quem ainda não é aluno. Ocupam um kit First só naquela hora.')}</small></div>${reps?`<div><b>${reps}</b><small>reposições${ajuda('Aluno que faltou e vem repor em outro horário, no kit dele, dentro de 7 dias.')}</small></div>`:''}<div class="bad"><b>${semVaga}</b><small>horas sem kit livre${ajuda('Horas em que todos os kits First já estão ocupados — não dá pra encaixar aula experimental ali.')}</small></div></div>`;
}
function lado(){
  const kits = D.kits.length ? D.kits : [{kit:'First',capacidade:8},{kit:'OneBot',capacidade:6},{kit:'TechBot',capacidade:5},{kit:'Autobot',capacidade:4},{kit:'App Developer',capacidade:4},{kit:'GameBot',capacidade:2}];
  return `<div class="lado"><h5>Kits por hora${ajuda('Quantos kits de cada tipo a escola tem. Duas crianças não usam o mesmo kit na mesma hora — é isso que limita a vaga.')}</h5>${kits.map(k=>`<div class="k"><span>${esc(k.kit)}</span><b>${k.capacidade}</b></div>`).join('')}<div class="k"><span>Lugares na sala</span><b>18</b></div>
    <div class="leg"><span><i style="background:var(--brand-2)"></i>Aluno matriculado — aula de 2 horas</span><span><i style="background:var(--exp)"></i>Aula experimental — 1 hora, kit First</span><span><i style="background:#7C5CDB"></i>Reposição — 1 hora, kit do aluno</span></div></div>`;
}


// Cada hora do bloco vira um balão com os lugares livres, em cadeirinhas.
// Clicar abre o agendamento já naquele dia e horário.
function horasLivres(d, t){
  const ini = hN(t.hora_inicio), fim = hN(t.hora_fim);
  const out = [];
  for (let h = ini; h < fim; h++) {
    const usados = EXP.filter(a => a.data === d && viva(a) && hN(a.hora_inicio) === h).length;
    const v = VAGAS.find(x => x.data === d && hN(x.hora_inicio) === h);
    const total = v ? (v.capacidade ?? 8) : 8;
    const livres = v ? v.vagas : Math.max(0, total - usados);
    if (livres <= 0) { out.push(`<div class="hora-livre cheia"><b>${String(h).padStart(2,'0')}:00</b><span>sem kit livre</span></div>`); continue; }
    const cad = Array.from({ length: Math.min(total, 10) }, (_, i) =>
      `<i class="${i < (total - livres) ? 'ocup' : ''}"></i>`).join('');
    out.push(`<div class="hora-livre" onclick="novoAgendamento('${d}','${t.id}',${h})" title="marcar aula experimental às ${String(h).padStart(2,'0')}:00">
      <b>${String(h).padStart(2,'0')}:00</b><span>${livres} vaga${livres>1?'s':''}</span><span class="cadeiras">${cad}</span></div>`);
  }
  return out.join('');
}

function vDia(d){
  const ts = turmasDo(d).sort((a,b)=>String(a.hora_inicio).localeCompare(String(b.hora_inicio)));
  const out = ts.map(t => {
    const als = alunosDa(t).sort((a,b) => (a.kit||'').localeCompare(b.kit||'') || (a.nome_curto||a.nome).localeCompare(b.nome_curto||b.nome));
    const exps = EXP.filter(a => a.data === d && viva(a) && hh(a.hora_inicio) >= hh(t.hora_inicio) && hh(a.hora_inicio) < hh(t.hora_fim));
    const expV = TIPO === 'alunos' ? exps.filter(ehRep) : TIPO === 'experimental' ? exps.filter(ehExp) : exps;
    if (TIPO === 'experimental' && !expV.length) return '';
    const porKit = {}; als.forEach(a => porKit[a.kit] = (porKit[a.kit]||0)+1);
    const v = vagasHora(d, hN(t.hora_inicio));
    const cls = !v ? '' : v.n <= 0 ? 'cheio' : v.n <= 2 ? 'alerta' : '';
    const sala = t.limite_sala || 18;
    return `<div class="bloco-dia">
      <div class="bd-cab"><b>${hh(t.hora_inicio)}–${hh(t.hora_fim)}</b>
        <span class="bd-sub"><b style="color:var(--ink)">${als.length + expV.length}</b>/${sala} na sala</span>
        ${v ? `<span class="cap ${cls}">${v.n}${v.cap?'/'+v.cap:''} kit${v.n===1?'':'s'} livre${v.n===1?'':'s'} p/ experimental</span>` : ''}</div>
      <div class="bd-corpo">
        ${TIPO === 'experimental' ? '' : `<div class="bd-col">
          <div class="bd-tit azul">Matriculados · ${als.length}</div>
          ${als.map(a => `<div class="al" onclick="abrirAluno('${a.id}')" title="${esc(a.nome)} · ${esc(a.kit||'')}"><span class="k" style="background:${corKit(a.kit)}"></span><span class="n">${esc(a.nome_curto||a.nome)}</span></div>`).join('') || '<div class="al" style="cursor:default;color:var(--faint)">ninguém nesta turma</div>'}
          <div class="kits">${(D.kits||[]).map(k => { const u = porKit[k.kit]||0, liv = k.capacidade - u;
            return `<span class="kt ${liv<=0?'cheio':liv<=2?'alerta':''}" title="${esc(k.kit)}: ${u} de ${k.capacidade}">${esc(k.kit.replace('App Developer','App').replace('Bot',''))} ${u}/${k.capacidade}</span>`; }).join('')}</div>
        </div>`}
        <div class="bd-col" ondragover="event.preventDefault()" ondrop="dropExp(event,'${d}',${hN(t.hora_inicio)})">
          <div class="bd-tit laranja">Aula experimental e reposição · ${expV.length}</div>
          ${expV.filter(ehExp).map(cartao).join('')}
          ${expV.filter(ehRep).map(r => { const alu = (D.alunos||[]).find(x => x.id === r.aluno_id) || {};
            return `<div class="al rep" onclick="abrirAluno('${r.aluno_id}')"><span class="k"></span><span class="n">${esc(r.crianca_nome||alu.nome||'')}</span><span class="hr">reposição ${hh(r.hora_inicio)}</span></div>`; }).join('')}
          ${horasLivres(d, t)}
        </div>
      </div></div>`;
  }).filter(Boolean).join('');
  // horas em que a escola abre mas não há turma: também dá para marcar experimental
  const horasTurma = new Set();
  ts.forEach(t => { for (let x = hN(t.hora_inicio); x < hN(t.hora_fim); x++) horasTurma.add(x); });
  const soltas = (VAGAS||[]).filter(v => v.data === d && !horasTurma.has(hN(v.hora_inicio)))
    .sort((a,b) => String(a.hora_inicio).localeCompare(String(b.hora_inicio)));
  const extra = soltas.length && TIPO !== 'alunos' ? `<div class="bloco-dia">
      <div class="bd-cab"><b>Horas livres</b><span class="bd-sub">a escola está aberta e não há turma — cabe aula experimental</span></div>
      <div class="assentos-horas">${soltas.map(v => { const usados = EXP.filter(a => a.data === d && viva(a) && hN(a.hora_inicio) === hN(v.hora_inicio)).length;
        const total = v.capacidade ?? 8, livres = v.vagas;
        const cad = Array.from({length: Math.min(total,10)}, (_,i) => `<i class="${i < total - livres ? 'ocup':''}"></i>`).join('');
        return livres > 0
          ? `<div class="hora-livre" onclick="novoAgendamento('${d}','${v.turma_id||''}',${hN(v.hora_inicio)})"><b>${hh(v.hora_inicio)}</b><span>${livres} vaga${livres>1?'s':''}</span><span class="cadeiras">${cad}</span></div>`
          : `<div class="hora-livre cheia"><b>${hh(v.hora_inicio)}</b><span>sem kit livre</span></div>`; }).join('')}</div></div>` : '';
  return (out + extra) || `<div class="vazio">A escola não abre neste dia.</div>`;
}
function expBloco(list, h){
  if (!list.length) return '';
  const rep = list.filter(ehRep), exp = list.filter(ehExp);
  let out = '';
  if (exp.length) out += `<div class="bloco exp" style="margin-bottom:8px"><div class="t"><b>${exp.length} experimental${exp.length>1?'is':''}</b> · ${String(h).padStart(2,'0')}:00</div>
    ${exp.map(cartao).join('')}</div>`;
  if (rep.length) out += `<div class="bloco rep" style="margin-bottom:8px"><div class="t"><b>${rep.length} reposição${rep.length>1?'ões':''}</b> · ${String(h).padStart(2,'0')}:00</div>
    <div class="pills">${rep.map(r => { const al = (D.alunos||[]).find(a => a.id === r.aluno_id) || {};
      return `<span class="pill rep" onclick="abrirAluno('${r.aluno_id}')">${esc(r.crianca_nome || al.nome || 'Aluno')}<small>reposição${al.kit?' · '+esc(al.kit):''}</small></span>`; }).join('')}</div></div>`;
  return out;
}


// Semana em grade: linha = bloco de horário, coluna = dia. Dentro da célula,
// cada criança é um "assento": azul = matriculado, laranja = experimental, roxo = reposição.
function vSemanaGrade(){
  const seg = segunda(SEL), dias = [0,1,2,3,4,5].map(n => addDias(seg, n));
  // uma linha por HORA (8h, 9h, 10h…). A turma de 2h ocupa as duas linhas dela.
  const horas = [...new Set([
    ...(VAGAS||[]).filter(v => dias.includes(v.data)).map(v => hN(v.hora_inicio)),
    ...(D.turmas||[]).filter(t => t.ativa !== false).flatMap(t => {
      const out = []; for (let x = hN(t.hora_inicio); x < hN(t.hora_fim); x++) out.push(x); return out; }),
    ...EXP.filter(a => dias.includes(a.data) && viva(a)).map(a => hN(a.hora_inicio)),
  ])].sort((a,b) => a-b);

  let h = `<div class="scrollx"><div class="grade"><div></div>${dias.map(d => `<div class="gh" style="${d===hoje?'color:var(--brand)':''}">${DIAS3[dow(d)]} ${new Date(d+'T12:00').getDate()}</div>`).join('')}`;
  for (const hora of horas) {
    const hs = String(hora).padStart(2,'0') + ':00';
    h += `<div class="gb">${hs}</div>`;
    for (const d of dias) {
      const t = (D.turmas||[]).find(x => x.dia_semana === dow(d) && x.ativa !== false
        && hN(x.hora_inicio) <= hora && hora < hN(x.hora_fim));
      const exps = EXP.filter(a => a.data === d && viva(a) && hN(a.hora_inicio) === hora);
      const expV = TIPO === 'alunos' ? exps.filter(ehRep) : TIPO === 'experimental' ? exps.filter(ehExp) : exps;
      const aberta = (VAGAS||[]).find(v => v.data === d && hN(v.hora_inicio) === hora);

      if (!t && !expV.length) {
        h += aberta
          ? `<div class="cel livre" onclick="novoAgendamento('${d}','${aberta.turma_id||''}',${hora})" title="a escola abre nesta hora — clique para marcar aula experimental">
               <span class="lv-h">${hs}</span><span class="lv2">${aberta.vagas} vaga${aberta.vagas>1?'s':''}</span>
               <span class="lv-cta">+ marcar</span></div>`
          : `<div class="cel vazia ${d < hoje ? 'passou' : ''}">${d < hoje ? '' : 'fechado'}</div>`;
        continue;
      }
      const primeira = t ? hN(t.hora_inicio) === hora : true;     // só a 1ª hora da turma lista os alunos
      const als = (t && primeira) ? alunosDa(t).sort((a,b) => (a.kit||'').localeCompare(b.kit||'') || (a.nome_curto||a.nome).localeCompare(b.nome_curto||b.nome)) : [];
      const v = aberta ? { n: aberta.vagas, cap: aberta.capacidade } : null;
      const cls = !v ? '' : v.n <= 0 ? 'cheio' : v.n <= 2 ? 'alerta' : '';
      const naSala = (t ? alunosDa(t).length : 0) + expV.length;
      h += `<div class="cel ${expV.length?'temexp':''} ${t && !primeira ? 'cont' : ''}" ondragover="event.preventDefault()" ondrop="dropExp(event,'${d}',${hora})">
        <div class="t">
          <span>${t ? (primeira ? `<b>${naSala}</b>/${t.limite_sala||18} na sala` : `<span class="segue">${hh(t.hora_inicio)}–${hh(t.hora_fim)} · continua</span>`) : ''}</span>
          ${v && (v.n <= 0 || TIPO === 'alunos') ? `<span class="cap ${cls}" title="kits First livres nesta hora">${v.n<=0?'sem kit livre':v.n+' livre'+(v.n===1?'':'s')}</span>` : ''}</div>

function vMes(){

  const ini = segunda(iso(new Date(ano, m, 1, 12))); const fim = iso(new Date(ano, m + 1, 0, 12));

  return `<div class="scrollx"><div class="mes">${DIAS3.slice(1).map(n=>`<div class="hd">${n}</div>`).join('')}${dias.map(d => {
    const ts = turmasDo(d);

    const semKit = ts.filter(t => { const v = vagasHora(d, hN(t.hora_inicio)); return v && v.n <= 0; }).length;

        ${TIPO !== 'alunos' && nEx ? `<div class="lin e" onclick="quemNoDia('${d}','exp')"><b>${nEx}</b> experimental${nEx>1?'is':''}</div>` : ''}
        ${mostra && nRe ? `<div class="lin r" onclick="quemNoDia('${d}','rep')"><b>${nRe}</b> reposiç${nRe>1?'ões':'ão'}</div>` : ''}

      </div></div>`; }).join('')}</div></div>`;
}

// --- constantes e estado que o card usa (vindos da tela de Aula experimental) ---
const MOTIVOS = ['Orçamento','Horário não bate','Vai pensar','Distância','Criança não se adaptou','Só pesquisando'];
const PAGTOS = ['Pix','cartão','boleto','recorrente'];
const KITS = ['First','OneBot','TechBot','Autobot','App Developer','GameBot'];
let ESC = {}, ABERTO = null, VAGAS3 = null, SEMDATA = [];
const turmaDe = a => (D.turmas || []).find(t => t.id === a.turma_id) || {};
const viva = a => !['cancelado','remarcado'].includes(a.status) && !a.remarcado_para;
function desfechoDe(a){ const m = /desfecho:\s*(matriculou|nao|andamento|faltou)(?:\s*·\s*(.*))?/i.exec(a.observacao||''); return m ? { t: m[1].toLowerCase(), obs: (m[2]||'').trim() } : null; }
const ROT = { quente: ['Quer fechar','q'], morno: ['Considerando','m'], frio: ['Só conhecendo','f'] };
function origemTag(l){
  const f = (l.fonte||'').toLowerCase(), pt = (l.porta||'').toLowerCase(), o = (l.origem||'').toLowerCase();
  if (f.includes('anúncio') || f.includes('anuncio') || o.includes('anuncio')) return ['Anúncio' + (pt||o ? (o.includes('insta')||f.includes('insta') ? ' Instagram' : '') : ''), 'o-ads'];
  if (f.includes('instagram') || o === 'instagram') return ['Instagram orgânico', 'o-org'];
  if (f.includes('evento') || pt === 'evento') return ['Evento', 'o-evt'];
  if (f.includes('google')) return ['Google', 'o-site'];
  if (pt === 'site' || o === 'site') return ['Site', 'o-site'];
  if (pt.includes('whatsapp') || o.includes('whatsapp')) return ['WhatsApp', 'o-wpp'];
  if (f.includes('indica')) return ['Indicação', 'o-evt'];
  return null;
}
function remarcacoes(a){ let n = 0, cur = a; const seen = new Set(); while (cur && cur.remarcado_de && !seen.has(cur.id)) { seen.add(cur.id); n++; cur = D.agendamentos.find(x => x.id === cur.remarcado_de); } return n; }
function cartao(a){
  const l = leadDe(a), t = turmaDe(a); const D_ = desfechoDe(a); const temp = (l.temperatura||'').toLowerCase();
  const rot = ROT[temp] ? `<span class="rot ${ROT[temp][1]}">${ROT[temp][0]}</span>` : '';
  const org = origemTag(l); const rea = remarcacoes(a);
  const sinal = (!D_ && a.observacao) ? a.observacao : (l.notas || '');
  let est = '', pe = '';
  if (a.status === 'faltou' || (D_ && D_.t === 'faltou')) {
    est = ' gone';
    const menu = ABERTO && ABERTO.id === a.id && ABERTO.tipo === 'reagendar' ? menuReagendar(a) : '';
    pe = `<div class="done neutral"><span><b>Faltou.</b> Continua em Aula agendada no Kommo, com a tag <i>reagendar devido falta</i></span>
      <span><button class="undo alt" onclick="abrirMenu('${a.id}','reagendar')">opções</button> <button class="undo" onclick="desfazer('${a.id}')">desfazer</button></span></div>${menu}`;
  } else if (D_) {
    est = D_.t === 'matriculou' ? ' win' : D_.t === 'nao' ? ' lost' : ' hold';
    const txt = D_.t === 'matriculou' ? `<b>Matriculou${D_.obs?' · '+esc(D_.obs.split(' · ')[0]):''}.</b> Baixa no Kommo como ganho: vai para Aluno ativo com a tag <i>pagamento: ${esc((D_.obs.split(' · ')[0]||'').toLowerCase())}</i>`
      : D_.t === 'nao' ? `<b>Não fechou${D_.obs?' · '+esc(D_.obs):''}.</b> Vai para Remarketing no Kommo com a tag <i>motivo: ${esc(D_.obs.toLowerCase())}</i>`
      : `<b>Em andamento.</b> Continua na coluna de Aula agendada, com a tag <i>em andamento</i>. A observação abaixo vai como nota no Kommo. <i>“${esc(D_.obs||'sem observação')}”</i>`;
    pe = `<div class="done ${D_.t==='matriculou'?'win':D_.t==='nao'?'lost':'hold'}"><span>${txt}</span>${D_.t==='matriculou'?'':`<button class="undo" onclick="desfazer('${a.id}')">desfazer</button>`}</div>`;
  } else {
    const menu = ABERTO && ABERTO.id === a.id ? menuDesfecho(a) : '';
    // as quatro opções sempre visíveis, como no protótipo (a recepção dá baixa no dia; aula futura também pode ser remarcada/cancelada)
    pe = `<div class="acts quatro">
        <button class="yes" onclick="abrirMenu('${a.id}','matriculou')">Matriculou</button>
        <button class="nope" onclick="abrirMenu('${a.id}','nao')">Não matriculou</button>
        <button onclick="abrirMenu('${a.id}','andamento')">Em andamento</button>
        <button onclick="registrar('${a.id}','faltou',{})">Faltou</button></div>
      <div class="acts mini"><button onclick="abrirMenu('${a.id}','reagendar')">reagendar</button><button onclick="cancelar('${a.id}')">cancelar aula</button></div>${menu}`;
  }
  return `<div class="cardx${est}" data-id="${a.id}" draggable="true" ondragstart="dragAula(event,'${a.id}')">
    <button class="scriptbtn" onclick="script('${a.id}')" title="Ver a conversa">script</button>
    <div class="top"><span class="kid">${esc(a.crianca_nome || l.nome || 'Criança')}${a.crianca_idade?`<em>${a.crianca_idade} anos</em>`:''}</span>${rot}</div>
    <div class="guard">com ${esc(l.nome||'responsável')}${l.contato?` · <a href="https://wa.me/${String(l.contato).replace(/\D/g,'')}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--brand);font-weight:700;text-decoration:none">${esc(l.contato)}</a>`:''}${l.atendente?' · '+esc(l.atendente):''}</div>
    <div class="top" style="margin-top:8px">${org?`<span class="org ${org[1]}">${esc(org[0])}</span>`:''}${rea?`<span class="rea">remarcou ${rea}×</span>`:''}${a.status==='confirmado'?'<span class="rea" style="background:var(--verde-bg);color:var(--verde)">confirmou ✓</span>':''}${/pediu para remarcar/i.test(a.observacao||'')?'<span class="rea" style="background:rgba(224,49,39,.1);color:var(--quente)">pediu remarcar</span>':''}</div>
    ${sinal ? `<div class="sinal">${esc(sinal)}</div>` : ''}
    ${pe}</div>`;
}
function menuDesfecho(a){
  const tp = ABERTO.tipo;
  if (tp === 'reagendar') return menuReagendar(a);
  if (tp === 'andamento') return `<div class="menu"><p>Situação da família</p><textarea id="m-obs" placeholder="Ex.: precisa esperar a fatura do cartão virar, falar com o marido"></textarea>
    <div class="acts save"><button class="yes" onclick="registrar('${a.id}','andamento',{observacao:document.getElementById('m-obs').value,situacao:document.getElementById('m-obs').value})">Salvar</button><button onclick="fecharMenu()">cancelar</button></div></div>`;
  if (tp === 'nao') return `<div class="menu"><p>Motivo</p><div class="chips">${MOTIVOS.map(v=>`<button class="chip" onclick="registrar('${a.id}','nao',{motivo:'${v}'})">${v}</button>`).join('')}</div></div>`;
  if (tp === 'matriculou') return `<div class="menu"><p>Forma de pagamento</p><div class="chips">${PAGTOS.map(v=>`<button class="chip ${ESC.pagamento===v?'on':''}" onclick="ESC.pagamento='${v}';desenhar()">${v}</button>`).join('')}</div>
    <div class="l2 linha2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><p>Valor (R$)</p><input id="m-valor" type="number" min="0" step="10" placeholder="397" value="${ESC.valor||''}"></div><div><p>Kit</p><select id="m-curso">${KITS.map(k=>`<option ${k===(ESC.curso||'First')?'selected':''}>${k}</option>`).join('')}</select></div></div>
    <div class="l2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><p>Turma do aluno</p><select id="m-turma">${D.turmas.map(t=>`<option value="${t.id}" ${t.id===a.turma_id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div><div><p>Nome completo</p><input id="m-aluno" value="${esc(a.crianca_nome||'')}"></div></div>
    <div class="acts save"><button class="yes" onclick="confirmarMatricula('${a.id}')">Confirmar matrícula</button><button onclick="fecharMenu()">cancelar</button></div></div>`;
  return '';
}
function menuReagendar(a){
  if (!VAGAS3) { carregarVagas(); return `<div class="menu"><p>Reagendar</p><div class="aviso-p">Buscando vagas…</div></div>`; }
  const hs = VAGAS3.filter(h => (h.vagas ?? 1) > 0 && h.data > hoje).sort((x,y)=>(x.data+x.hora_inicio).localeCompare(y.data+y.hora_inicio));
  const pick = f => hs.find(h => { const w = new Date(h.data+'T12:00').getDay(), hi = parseInt(h.hora_inicio); return f==='sab'?w===6:f==='manha'?(w!==6&&hi<12):(w!==6&&hi>=12); });
  const vg = (rot, v) => `<div class="vg"><small>${rot}</small>${v?`<b>${DIAS[new Date(v.data+'T12:00').getDay()].slice(0,3)} ${new Date(v.data+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} · ${hh(v.hora_inicio)}</b><small>${v.vagas} First livres</small><button class="btn" onclick="reagendar('${a.id}','${v.turma_id}','${v.data}')">Reagendar</button>`:'<b>—</b><small>sem vaga em 30 dias</small>'}</div>`;
  return `<div class="menu"><p>Reagendar ${esc(a.crianca_nome||'')} — ofereça duas opções</p><div class="vagas3">${vg('Manhã',pick('manha'))}${vg('Tarde',pick('tarde'))}${vg('Sábado',pick('sab'))}</div><div class="acts save"><button onclick="fecharMenu()">cancelar</button></div></div>`;
}
async function carregarVagas(){ try { VAGAS3 = (await api('agenda', { dias: 30 })).horarios || []; } catch(e){ VAGAS3 = []; } desenhar(); }
function abrirMenu(id, tipo){ ABERTO = { id, tipo }; ESC = {}; desenhar(); }
function fecharMenu(){ ABERTO = null; desenhar(); }
async function registrar(id, tipo, extra){
  try { await api('desfecho', { atendente: (window.CaptaUser&&CaptaUser.nome())||undefined, agendamento_id: id, desfecho: tipo, observacao: `desfecho: ${tipo}${extra.motivo?' · '+extra.motivo:''}${extra.observacao?' · '+extra.observacao:''}`, ...extra }); ABERTO = null; await carregar();
    const nome = (D.agendamentos.find(x=>x.id===id)||{}).crianca_nome || 'Aula';
    toast(`<b>${esc(nome)}</b> · ${({matriculou:'matriculou',nao:'não fechou',andamento:'em andamento',faltou:'faltou'})[tipo]} · Kommo atualizado`, tipo==='matriculou'?{tipo:'ok'}:{ acao:'desfazer', onAcao:() => desfazer(id) }); }
  catch(e){ toast(e.message,{tipo:'erro'}); }
}
async function confirmarMatricula(id){
  const g = x => document.getElementById(x).value;
  if (!ESC.pagamento) return toast('Escolha a forma de pagamento.',{tipo:'erro'});
  try { await api('desfecho', { agendamento_id: id, desfecho: 'matriculou', valor: g('m-valor'), curso: g('m-curso'), pagamento: ESC.pagamento, turma_id: g('m-turma'), aluno_nome: g('m-aluno'), observacao: `desfecho: matriculou · ${ESC.pagamento}${g('m-valor')?' · R$ '+g('m-valor'):''}` }); ABERTO = null; await carregar(); }
  catch(e){ toast(e.message,{tipo:'erro'}); }
}
async function cancelar(id){ if (!confirm('Cancelar esta aula?')) return; try { await api('presenca', { agendamento_id: id, status: 'cancelado', motivo: 'cancelado pela recepção' }); toast('Aula cancelada · lead voltou de etapa · Kommo atualizado'); await carregar(); } catch(e){ toast(e.message,{tipo:'erro'}); } }
async function reagendar(id, turmaId, data){ try { await api('remarcar', { agendamento_id: id, turma_id: turmaId, data, motivo: 'reagendado pela recepção' }); ABERTO = null; VAGAS3 = null; toast('Aula remarcada · Kommo atualizado', { tipo:'ok' }); await carregar(); } catch(e){ toast(e.message,{tipo:'erro'}); } }
async function desfazer(id){ try { await api('desfazer', { agendamento_id: id }); toast('Desfeito · aula voltou a agendada'); await carregar(); } catch(e){ toast(e.message,{tipo:'erro'}); } }


// ---------------- filtro de tipo ----------------
// A mesma tela serve a dois trabalhos: quem atende lead (comercial) e quem cuida
// dos alunos (secretaria). A visão troca o que aparece, sem esconder nada do outro.
let TIPO = 'todos';   // todos | experimental | alunos
try { TIPO = localStorage.getItem('capta_visao_agenda') || 'todos'; } catch(e){}
const ehRep = a => (a.tipo || 'experimental') === 'reposicao';
const ehExp = a => (a.tipo || 'experimental') === 'experimental';
function mudarTipo(t){ TIPO = t; try { localStorage.setItem('capta_visao_agenda', t); } catch(e){} desenhar(); }
function barraTipo(nAl, nEx, nRe){
  const b = (k, t, sub, q) => `<button class="${TIPO===k?'on':''}" onclick="mudarTipo('${k}')" title="${sub}">${t}${q!=null?`<span class="q">${q}</span>`:''}</button>`;
  return `<div class="filtro-tipo">
    ${b('todos','Tudo','Turmas, aulas experimentais e reposições')}
    ${b('experimental','Aulas experimentais','Quem vem conhecer a escola — trabalho do comercial', nEx)}
    ${b('alunos','Alunos e reposições','Quem já estuda aqui — trabalho da secretaria', nAl + nRe)}
  </div>
  <button class="btn g" style="margin-left:auto" onclick="listaAlunos()">Lista de matriculados</button>`;
}

// lista de quem está matriculado, agrupada por turma
function listaAlunos(){
  const turmas = (D.turmas||[]).filter(t => t.ativa !== false)
    .sort((a,b) => (a.dia_semana - b.dia_semana) || String(a.hora_inicio).localeCompare(String(b.hora_inicio)));
  const semTurma = (D.alunos||[]).filter(a => a.status === 'ativo' && !a.turma_id);
  const total = (D.alunos||[]).filter(a => a.status === 'ativo').length;
  const trancados = (D.alunos||[]).filter(a => a.status === 'trancado');
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela" style="max-width:620px">
    <h3>Alunos matriculados</h3><p>${total} ativos${trancados.length?` · ${trancados.length} trancado${trancados.length>1?'s':''}`:''} — toque no nome para ver faltas e marcar reposição</p>
    <div style="margin-top:14px;max-height:62vh;overflow-y:auto">
    ${turmas.map(t => { const als = (D.alunos||[]).filter(a => a.turma_id === t.id && a.status === 'ativo');
      if (!als.length) return '';
      return `<div style="margin-bottom:14px"><div style="font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${DIAS[t.dia_semana]} ${hh(t.hora_inicio)}–${hh(t.hora_fim)} · ${als.length} aluno${als.length>1?'s':''}</div>
        <div class="pills">${als.map(a => `<span class="pill cont" onclick="fecharModal();abrirAluno('${a.id}')">${esc(a.nome_curto||a.nome)}<small>${KITCUR(a.kit)}</small></span>`).join('')}</div></div>`; }).join('')}
    ${semTurma.length ? `<div style="margin-bottom:14px"><div style="font-size:11.5px;font-weight:800;color:var(--morno);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Sem turma definida</div>
      <div class="pills">${semTurma.map(a => `<span class="pill cont" onclick="fecharModal();abrirAluno('${a.id}')">${esc(a.nome_curto||a.nome)}<small>${KITCUR(a.kit)}</small></span>`).join('')}</div></div>` : ''}
    ${trancados.length ? `<div><div style="font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Trancados</div>
      <div class="pills">${trancados.map(a => `<span class="pill" style="opacity:.6">${esc(a.nome_curto||a.nome)}<small>${a.trancado_ate ? 'até ' + fmt(a.trancado_ate,{day:'2-digit',month:'2-digit'}) : ''}</small></span>`).join('')}</div></div>` : ''}
    </div>
    <div class="fim"><button class="btn g" onclick="fecharModal()">Fechar</button><button class="btn" onclick="fecharModal();irPara('/alunos.html')">Abrir tela de Alunos</button></div></div></div>`;
  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fecharModal(); };
}

// ---------------- reposição ----------------
let REP = null;
async function abrirAluno(alunoId, dataAula){
  const al = (D.alunos||[]).find(a => a.id === alunoId); if (!al) return;
  REP = { aluno: al, dados: null, escolhido: null };
  desenharAluno();
  try { const [f, v] = await Promise.all([api('faltas_aluno', { aluno_id: alunoId }), api('vagas_kit', { kit: al.kit || 'First', dias: 7 })]);
    REP.dados = f; REP.vagas = (v.horarios || []).filter(h => (h.vagas ?? 0) > 0); }
  catch(e){ REP.erro = e.message; }
  desenharAluno();
}
function desenharAluno(){
  const al = REP.aluno; const d = REP.dados; const t = (D.turmas||[]).find(x => x.id === al.turma_id);
  const faltas = d?.faltas || []; const reps = d?.reposicoes || [];
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela aluno-jan" style="max-width:540px">
    <h3>${esc(al.nome_curto || al.nome)}</h3>
    <p>${al.kit ? esc(al.kit) : ''}${t ? ` · ${DIAS[t.dia_semana]} ${hh(t.hora_inicio)}–${hh(t.hora_fim)}` : ' · sem turma'}${al.matricula ? ` · matrícula ${esc(al.matricula)}` : ''}</p>
    ${al.status !== 'ativo' ? `<p style="color:var(--morno);font-weight:700">${esc(al.status)}${al.trancado_ate ? ' até ' + new Date(al.trancado_ate+'T12:00').toLocaleDateString('pt-BR') : ''}</p>` : ''}
    ${!d ? '<p style="margin-top:14px">Carregando faltas…</p>' : `
      <div class="sec" style="font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px">Faltas recentes</div>
      ${faltas.length ? faltas.slice(0,4).map(f => `<div class="falta"><b>${DIAS3[dow(f.data)]} ${fmt(f.data,{day:'2-digit',month:'2-digit'})}</b><span style="color:var(--muted)">${hh(f.hora_inicio)}</span>
        <button class="btn sm" onclick="escolherReposicao('${f.data}')">repor esta</button></div>`).join('')
        : '<div style="font-size:13px;color:var(--faint)">Sem faltas nos últimos 21 dias 👏</div>'}
      ${reps.length ? `<div class="sec" style="font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px">Reposições marcadas</div>
        ${reps.slice(0,4).map(r => `<div class="linha-f"><span>${DIAS3[dow(r.data)]} ${fmt(r.data,{day:'2-digit',month:'2-digit'})} · ${hh(r.hora_inicio)}</span><span style="color:var(--muted)">${esc(r.status)}</span></div>`).join('')}` : ''}
      ${REP.escolhido !== null ? blocoVagasRep() : `<div style="margin-top:14px"><button class="btn g" onclick="escolherReposicao(null)">Marcar reposição avulsa</button></div>`}
    `}
    <div class="fim"><button class="btn g" onclick="fecharModal()">Fechar</button></div></div></div>`;
  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fecharModal(); };
}
function escolherReposicao(dataFalta){ REP.escolhido = dataFalta; desenharAluno(); }
function blocoVagasRep(){
  const vs = REP.vagas || [];
  if (!vs.length) return `<div style="margin-top:14px;font-size:13px;color:var(--quente)">Sem vaga no kit ${esc(REP.aluno.kit||'')} nos próximos 7 dias.</div>`;
  return `<div class="sec" style="font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px">Escolha o horário (até 7 dias, kit ${esc(REP.aluno.kit||'First')})</div>
    <div class="vagas3" style="grid-template-columns:1fr 1fr">${vs.slice(0,6).map(v => `<div class="vg rep"><small>${DIAS[dow(v.data)]}</small><b>${fmt(v.data,{day:'2-digit',month:'2-digit'})} · ${hh(v.hora_inicio)}</b><small>${v.vagas} livre${v.vagas>1?'s':''}</small>
      <button class="btn" style="margin-top:6px;width:100%" onclick="confirmarReposicao('${v.turma_id}','${v.data}')">Marcar</button></div>`).join('')}</div>`;
}
async function confirmarReposicao(turmaId, data){
  try { await api('repor', { aluno_id: REP.aluno.id, turma_id: turmaId, data, repoe_data: REP.escolhido || null, atendente: (window.CaptaUser&&CaptaUser.nome())||undefined });
    fecharModal(); toast(`Reposição marcada para ${fmt(data,{day:'2-digit',month:'2-digit'})}`, { tipo:'ok' }); await carregar(); }
  catch(e){ toast(e.message, { tipo:'erro' }); }
}

if (!SLUG || !TOKEN) document.getElementById('raiz').textContent = 'Abra esta página pelo painel do seu negócio.'; else carregar();
</script>
