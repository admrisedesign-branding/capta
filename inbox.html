<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversas — Capta</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/capta.css">
<style>
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;
  background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.voltar{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:10px;text-decoration:none;transition:.14s}
.voltar:hover{border-color:var(--brand);color:var(--brand)}

.wrap{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:22px 26px 26px;
  max-width:1240px;margin:0 auto;height:calc(100vh - 60px)}
@media(max-width:840px){
  .wrap{grid-template-columns:1fr}
  .painel{display:none}
  body.aberta .lista{display:none}
  body.aberta .painel{display:flex}
}

.lista,.painel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* Lista de conversas */
.lista-topo{padding:14px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
.lista-rolagem{overflow-y:auto;flex:1}
.conv{display:flex;gap:11px;width:100%;border:0;background:transparent;text-align:left;
  padding:12px 16px;border-bottom:1px solid var(--line-2);transition:.14s}
.conv:hover{background:var(--brand-softer)}
.conv[aria-current="true"]{background:var(--brand-soft)}
.conv-av{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--gray-bg);color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:13px}
.conv-mid{min-width:0;flex:1}
.conv-nome{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-prev{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-dir{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.conv-hora{font-size:11.5px;color:var(--faint);white-space:nowrap}
.bolha{min-width:19px;height:19px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center}

.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.t-Quente{background:var(--quente-bg);color:var(--quente)}
.t-Morno{background:var(--morno-bg);color:var(--morno)}
.t-Frio{background:var(--frio-bg);color:var(--frio)}

/* Painel da conversa */
.painel-topo{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:12px}
.painel-nome{font-weight:700;font-size:14.5px}
.painel-fone{color:var(--muted);font-size:12.5px;margin-top:1px}
.robo{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.robo .ponto{width:7px;height:7px;border-radius:50%}
.robo.on .ponto{background:var(--verde)}
.robo.off .ponto{background:var(--faint)}

.fluxo{flex:1;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:2px;
  background:var(--bg);background-image:radial-gradient(rgba(105,112,137,.055) 1px, transparent 1px);background-size:22px 22px;scroll-behavior:smooth}
.msg{max-width:min(76%,560px);padding:7px 11px 5px;border-radius:14px;font-size:14px;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap;position:relative;box-shadow:0 1px 1px rgba(20,26,46,.05);margin-top:2px}
.msg.entrada{align-self:flex-start;background:var(--card);border-top-left-radius:5px}
.msg.saida{align-self:flex-end;background:#D9FDD3;border-top-right-radius:5px}
/* grupos: só a primeira da sequência tem o "bico" */
.msg.entrada.mesmo{border-top-left-radius:14px;margin-top:1px}
.msg.saida.mesmo{border-top-right-radius:14px;margin-top:1px}
.msg.fim{margin-bottom:8px}
.msg-meta{font-size:11px;margin-top:2px;color:var(--faint);display:flex;gap:5px;align-items:center;justify-content:flex-end;float:right;
  margin-left:10px;position:relative;top:4px}
.msg.saida .msg-meta{color:#5c7a58}
.msg-autor{font-weight:700;font-size:10.5px;color:var(--brand);margin-bottom:2px;display:block}
.msg.saida .msg-autor{color:#1f7a4d}
.tique{font-size:12px;letter-spacing:-2px}
.tique.lida{color:#3B9DE8}
.dia-sep{align-self:center;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:99px;
  padding:4px 14px;font-size:11.5px;font-weight:700;color:var(--muted);margin:14px 0 8px;box-shadow:0 1px 2px rgba(20,26,46,.05);
  position:sticky;top:6px;z-index:2}
.resp{border-left:3px solid var(--brand);background:rgba(46,91,255,.07);border-radius:7px;padding:5px 9px;
  margin-bottom:5px;font-size:12.5px;color:var(--muted);cursor:pointer;max-height:52px;overflow:hidden}
.resp b{display:block;font-size:11.5px;color:var(--brand)}
.msg.saida .resp{border-left-color:#1f7a4d;background:rgba(31,122,77,.09)}.msg.saida .resp b{color:#1f7a4d}
.msg-acao{position:absolute;top:2px;right:6px;opacity:0;background:none;border:0;color:var(--faint);font-size:14px;cursor:pointer;padding:2px}
.msg:hover .msg-acao{opacity:.7}.msg-acao:hover{opacity:1!important}
.msg.destaque{animation:pisca-msg 1.4s ease-out}
@keyframes pisca-msg{0%,100%{background-color:inherit}30%{background-color:#FFF3C4}}
.desce{position:absolute;right:22px;bottom:96px;width:38px;height:38px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);box-shadow:0 3px 12px rgba(20,26,46,.14);display:none;place-items:center;cursor:pointer;z-index:4;font-size:15px;color:var(--muted)}
.desce.on{display:grid}.desce b{position:absolute;top:-6px;right:-4px;background:var(--brand);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px}
.respondendo{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--line-2);border-top:1px solid var(--line);font-size:12.5px}
.respondendo .txt{flex:1;min-width:0;border-left:3px solid var(--brand);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.respondendo .txt b{display:block;color:var(--brand);font-size:11.5px}
.respondendo button{border:0;background:none;color:var(--faint);font-size:16px;cursor:pointer}

/* Mídia */
.msg audio{display:block;width:250px;max-width:100%;margin:2px 0}
.msg img{display:block;max-width:230px;border-radius:9px;margin:2px 0;cursor:zoom-in}
.msg .arquivo{display:inline-flex;align-items:center;gap:7px;font-weight:600;text-decoration:underline}
.transcricao{margin-top:7px;padding-top:7px;border-top:1px solid rgba(105,112,137,.18);
  font-size:12.5px;line-height:1.55;opacity:.9}
.transcricao::before{content:"Transcrição";display:block;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin-bottom:2px}
.pendente{font-size:12px;opacity:.6;margin-top:6px;font-style:italic}
.carregando-midia{font-size:12px;opacity:.6}

.escrever{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:9px;align-items:flex-end;background:var(--card)}
.escrever textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;
  font-size:13.5px;resize:none;max-height:120px;color:var(--ink);background:var(--card)}
.escrever textarea:focus{outline:0;border-color:var(--brand)}
.enviar{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;padding:11px 18px;
  border-radius:12px;transition:.14s}
.enviar:hover{background:var(--brand-deep)}
.enviar:disabled{opacity:.45;cursor:not-allowed}

.vazio{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:13.5px;
  line-height:1.75;padding:40px 24px}
.aviso{margin:0 18px 12px;background:var(--morno-bg);border:1px solid rgba(224,147,15,.28);border-radius:11px;
  padding:9px 12px;font-size:12.5px;color:#8A5A04;line-height:1.55}
.voltar-lista{display:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:9px}
@media(max-width:840px){.voltar-lista{display:block}}


@media(max-width:760px){
  .wrap{display:block}
  .lista{width:100%;border-right:0}
  .painel{display:none}
  body.chat-aberto .lista{display:none}
  body.chat-aberto .painel{display:flex;height:calc(100vh - 130px)}
  .voltar-chat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--muted);margin-right:8px}
}
@media(min-width:761px){.voltar-chat{display:none}}
/* inbox v2 */

.conv{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line-2);background:transparent;cursor:pointer;font-family:inherit}
.conv:hover{background:var(--brand-softer,rgba(46,91,255,.06))}
.conv[aria-current="true"]{background:var(--brand-soft,rgba(46,91,255,.1))}
.conv-mid{min-width:0;display:block}
.conv-nome{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-prev{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-hora{font-size:11px;color:var(--faint);white-space:nowrap}
.bolha{background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.conv-tags{display:flex;gap:4px;align-items:center}
.mini-tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.mt-Quente{background:rgba(224,49,39,.12);color:var(--quente)}.mt-Morno{background:rgba(224,147,15,.14);color:var(--morno)}.mt-Frio{background:var(--brand-soft);color:var(--brand)}
.mt-at{background:var(--line-2);color:var(--muted);text-transform:none;letter-spacing:0}

.fundo{position:fixed;inset:0;background:rgba(20,26,46,.42);display:grid;place-items:center;padding:20px;z-index:70}
.janela{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(20,26,46,.2)}
.janela h3{font-size:16px;font-weight:700}.janela p{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}.campo input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit}
.fim{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.lista-ferr{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lista-ferr input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;width:100%}
.filtros{display:flex;gap:4px;flex-wrap:wrap}.filtros button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}.filtros button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.conv-at{font-size:10.5px;color:var(--faint);font-weight:700}
.conv.res{opacity:.55}
.painel-acoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.painel-acoes select,.painel-acoes button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--muted);font-family:inherit;cursor:pointer}
.painel-acoes button.ok{background:var(--verde,#16A34A);border-color:var(--verde,#16A34A);color:#fff}
.escrever .ico{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:16px;cursor:pointer;color:var(--muted)}
.rapidas{position:absolute;left:18px;right:18px;bottom:66px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,26,46,.15);max-height:260px;overflow-y:auto;z-index:5}
.rapidas .rp{padding:9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px}.rapidas .rp:hover{background:var(--brand-softer)}.rapidas .rp b{display:block;font-size:12px}.rapidas .rp small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rapidas .rp.nova{color:var(--brand);font-weight:700;text-align:center}
.painel{position:relative}
.lado-lead{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);background:var(--bg)}
.lado-lead b{color:var(--ink)}.lado-lead .bt{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--brand);cursor:pointer;font-family:inherit}
.wrap{grid-template-columns:340px 1fr}
</style>

to{opacity:1;transform:none}}

<script>
// aviso discreto no rodapé, com ação opcional (ex.: desfazer)
function toast(msg, opts){ opts = opts || {}; let box = document.getElementById('toasts'); if(!box){ box = document.createElement('div'); box.id='toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast' + (opts.tipo?' '+opts.tipo:''); el.innerHTML = `<span>${msg}</span>${opts.acao?`<button type="button">${opts.acao}</button>`:''}`;
  if(opts.acao) el.querySelector('button').onclick = () => { el.remove(); opts.onAcao && opts.onAcao(); };
  box.appendChild(el); setTimeout(() => el.remove(), opts.ms || (opts.acao ? 7000 : 3500)); return el; }
// mensagem pro painel (quando embutido): trocar de tela sem sair
function irPara(pagina){ if(window.parent !== window) window.parent.postMessage({ capta:'ir', pagina }, '*'); else location.href = pagina + location.search; }
</script>


<script>
// Quem está usando: vem do login (?u=Nome&papel=) e fica salvo por negócio.
window.CaptaUser = (function(){
  const q = new URLSearchParams(location.search); const slug = q.get('t') || '';
  const K = 'capta_user_' + slug;
  let u = null; try { u = JSON.parse(localStorage.getItem(K) || 'null'); } catch(e){}
  if (q.get('u')) { u = { nome: q.get('u'), papel: q.get('papel') || 'atendente', email: q.get('e') || (u&&u.email) || '' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} }
  return {
    nome: () => (u && u.nome) || '',
    papel: () => (u && u.papel) || '',
    email: () => (u && u.email) || '',
    telas: () => (u && u.telas) || null,
    definir: nome => { u = { ...(u||{}), nome, papel: (u && u.papel) || 'atendente' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    setar: o => { u = { ...(u||{}), ...o }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    sair: () => { try { localStorage.removeItem(K); } catch(e){} }
  };
})();
</script>

<body>
<div class="topbar">
  <a class="voltar" id="voltar" href="/dashboard.html">← Painel</a>
  <h1>Conversas</h1>
</div>

<div class="wrap">
  <div class="lista">
    <div class="lista-topo" id="contagem">Carregando…</div>
    <div class="lista-ferr"><input id="busca" placeholder="Buscar nome ou telefone" oninput="FI.q=this.value;desenharLista()">
      <div class="filtros" id="filtros"></div></div>
    <div class="lista-rolagem" id="convs"></div>
  </div>

  <div class="painel" id="painel">
    <div class="vazio">Escolha uma conversa para ver o histórico<br>e responder por aqui.</div>
  </div>
</div>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
document.getElementById('voltar').href = `/dashboard.html?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;

const elConvs = document.getElementById('convs');
const elCont  = document.getElementById('contagem');
const elPain  = document.getElementById('painel');
let atual = null, timer = null;

async function api(acao, extra = {}) {
  const r = await fetch('/api/capta-whatsapp', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ acao, slug: SLUG, token: TOKEN, ...extra })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.erro || `Erro ${r.status}`), { dados: d, status: r.status });
  return d;
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function fone(n) {
  const d = String(n || '').replace(/\D/g, '');
  const s = d.startsWith('55') ? d.slice(2) : d;
  if (s.length === 11) return `(${s.slice(0,2)}) ${s.slice(2,7)}-${s.slice(7)}`;
  return n || '—';
}
function hora(iso) {
  if (!iso) return '';
  const d = new Date(iso), ag = new Date();
  const mesmoDia = d.toDateString() === ag.toDateString();
  return mesmoDia
    ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
const iniciais = t => (t || '?').trim().slice(0, 2).toUpperCase();

const FI = { q: '', f: 'abertas', eu: '' };
FI.eu = (window.CaptaUser && CaptaUser.nome()) || ''; try { FI.eu = FI.eu || localStorage.getItem('capta_atendente') || ''; } catch(e){}
const ATEND = [...new Set(['Rafael','Bento','RISE', (window.CaptaUser&&CaptaUser.nome())||''].filter(Boolean))];
let CONVS = [], RAPIDAS = null;
function desenharLista(){
  const q = FI.q.trim().toLowerCase();
  const lista = CONVS.filter(c => {
    const nome = (c.lead?.nome || '') + ' ' + (c.telefone || '');
    if (q && !nome.toLowerCase().includes(q)) return false;
    if (FI.f === 'nao_lidas') return (c.nao_lidas||0) > 0;
    if (FI.f === 'minhas') return FI.eu && c.atendente === FI.eu;
    if (FI.f === 'quentes') return (c.lead?.temperatura||'').toLowerCase() === 'quente' && !c.resolvida_em;
    if (FI.f === 'sem_dono') return !c.atendente && !c.resolvida_em;
    if (FI.f === 'resolvidas') return !!c.resolvida_em;
    if (FI.f === 'abertas') return !c.resolvida_em;
    return true;
  });
  const n = k => k==='nao_lidas' ? CONVS.filter(c=>(c.nao_lidas||0)>0).length : k==='minhas' ? CONVS.filter(c=>FI.eu&&c.atendente===FI.eu).length : k==='resolvidas' ? CONVS.filter(c=>c.resolvida_em).length
    : k==='quentes' ? CONVS.filter(c=>(c.lead?.temperatura||'').toLowerCase()==='quente').length : k==='sem_dono' ? CONVS.filter(c=>!c.atendente&&!c.resolvida_em).length : CONVS.filter(c=>!c.resolvida_em).length;
  const orfas = CONVS.filter(c => !c.lead).length;
  document.getElementById('filtros').innerHTML = [['abertas','Abertas'],['nao_lidas','Não lidas'],['minhas','Minhas'],['sem_dono','Sem dono'],['quentes','Quentes'],['resolvidas','Resolvidas']].map(([k,t]) => `<button class="${FI.f===k?'on':''}" onclick="FI.f='${k}';desenharLista()">${t} <span style="opacity:.7">${n(k)}</span></button>`).join('')
    + (orfas ? `<button style="border-color:var(--brand);color:var(--brand)" onclick="casarConversas()" title="Ligar conversas ao lead pelo telefone">ligar ${orfas} sem nome</button>` : '');
  elCont.textContent = lista.length ? `${lista.length} conversa${lista.length > 1 ? 's' : ''}` : 'Nenhuma conversa';
  if (!lista.length) { elConvs.innerHTML = `<div class="vazio">${CONVS.length ? 'Nada com esse filtro.' : 'Nada por aqui ainda.<br>As mensagens aparecem assim que alguém escrever para o seu WhatsApp.'}</div>`; return; }
  elConvs.innerHTML = lista.map(c => {
    const nome = c.lead?.nome || fone(c.telefone); const temp = c.lead?.temperatura; const at = c.atendente || c.lead?.atendente;
    return `<button class="conv ${c.resolvida_em?'res':''}" data-id="${c.id}" aria-current="${c.id === atual}">
      <span class="conv-av">${esc(iniciais(nome))}</span>
      <span class="conv-mid"><span class="conv-nome">${esc(nome)}</span><span class="conv-prev">${esc(c.ultima_mensagem || 'Sem mensagens')}</span>
        <span class="conv-tags">${temp?`<span class="mini-tag mt-${esc(temp)}">${esc(temp)}</span>`:''}${at?`<span class="mini-tag mt-at">${esc(at)}</span>`:''}${c.resolvida_em?'<span class="mini-tag mt-at">resolvida</span>':''}</span></span>
      <span class="conv-dir"><span class="conv-hora">${hora(c.ultima_mensagem_em)}</span>${c.nao_lidas > 0 ? `<span class="bolha">${c.nao_lidas}</span>` : ''}</span></button>`;
  }).join('');
  elConvs.querySelectorAll('.conv').forEach(b => { b.onclick = () => abrir(b.dataset.id); });
  if (window.parent !== window) window.parent.postMessage({ capta:'nao_lidas', n: CONVS.reduce((s,c)=>s+(c.nao_lidas||0),0) }, '*');
}
async function casarConversas(){ try { const r = await api('casar_conversas'); toast(`${r.ligadas} conversas ligadas ao lead`, { tipo:'ok' }); await carregarLista(); } catch(e){ toast(e.message, { tipo:'erro' }); } }
async function carregarLista() {
  try { const { conversas } = await api('conversas'); CONVS = conversas || []; desenharLista(); }
  catch (e) { elCont.textContent = 'Erro'; elConvs.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

async function abrir(id) {
  document.body.classList.add('chat-aberto');
  atual = id;
  document.body.classList.add('aberta');
  elConvs.querySelectorAll('.conv').forEach(b => b.setAttribute('aria-current', b.dataset.id === id));

  try {
    const { conversa, mensagens } = await api('mensagens', { conversa_id: id });
    const nome = conversa.lead?.nome || fone(conversa.telefone);

    elPain.innerHTML = `
      <div class="painel-topo">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <button class="voltar-lista" id="volta">←</button>
          <div style="min-width:0">
            <div class="painel-nome">${esc(nome)}</div>
            <div class="painel-fone">${fone(conversa.telefone)}</div>
          </div>
        </div>
        <button class="voltar-chat" onclick="document.body.classList.remove('chat-aberto')">← conversas</button>
    <div class="painel-acoes">
          <div class="robo ${conversa.agente_ativo ? 'on' : 'off'}"><span class="ponto"></span>${conversa.agente_ativo ? 'Robô' : 'Você'}</div>
          <select onchange="atribuir('${conversa.id}', this.value)" title="Quem está atendendo"><option value="">— atendente —</option>${ATEND.map(a=>`<option ${conversa.atendente===a?'selected':''}>${a}</option>`).join('')}</select>
          ${conversa.atendente && conversa.atendente !== FI.eu ? `<button style="border-color:var(--morno);color:var(--morno)" onclick="assumir('${conversa.id}','${FI.eu||''}')" title="${esc(conversa.atendente)} está nesta conversa">assumir</button>` : ''}
          ${conversa.resolvida_em ? `<button onclick="resolver('${conversa.id}', false)">Reabrir</button>` : `<button class="ok" onclick="resolver('${conversa.id}', true)">Resolver ✓</button>`}
          <button onclick="importarTxt({ lead_id: ${conversa.lead ? `'${conversa.lead.id}'` : 'null'}, telefone: '${esc(conversa.telefone)}', depois: () => { abrir('${conversa.id}'); carregarLista(); } })" title="Importar histórico exportado do WhatsApp (.txt)">Importar .txt</button>
        </div>
      </div>

      <div class="fluxo" id="fluxo">
        ${mensagens.length ? montarFluxo(mensagens)
          : '<div class="vazio">Sem mensagens nesta conversa.</div>'}
      </div>

      ${conversa.agente_ativo
        ? '<div class="aviso">Se você responder por aqui, o robô para de responder nesta conversa.</div>' : ''}

      ${conversa.lead ? `<div class="lado-lead"><b>${esc(conversa.lead.nome||'')}</b>${conversa.lead.temperatura?' · '+esc(conversa.lead.temperatura):''}${conversa.lead.crianca?' · '+esc(conversa.lead.crianca)+(conversa.lead.idade?', '+conversa.lead.idade+' anos':''):''}${conversa.lead.notas?' · '+esc(conversa.lead.notas.slice(0,80)):''}
        <span style="margin-left:auto;display:flex;gap:6px"><button class="bt" onclick="irLead('${conversa.lead.id}','agendar')">marcar aula</button><button class="bt" onclick="irLead('${conversa.lead.id}','dados')">dados</button>${conversa.lead.kommo_lead_id?`<a class="bt" style="text-decoration:none" href="https://roboticanorte.kommo.com/leads/detail/${conversa.lead.kommo_lead_id}" target="_blank" rel="noopener">Kommo ↗</a>`:''}</span></div>` : ''}
      <div id="rapidas"></div>
      <div class="respondendo" id="respondendo" style="display:none"></div>
      <div class="desce" id="desce" onclick="document.getElementById('fluxo').scrollTop = document.getElementById('fluxo').scrollHeight" title="Ir para o fim">↓</div>
      <div class="escrever">
        <button class="ico" title="Respostas prontas (ou digite /)" onclick="abrirRapidas()">⚡</button>
        <button class="ico" title="Anexar imagem, áudio ou arquivo" onclick="document.getElementById('anexo').click()">📎</button>
        <input type="file" id="anexo" style="display:none" accept="image/*,audio/*,.pdf,.doc,.docx" onchange="enviarAnexo(this)">
        <textarea id="txt" rows="1" placeholder="Escreva uma mensagem — / para respostas prontas" aria-label="Mensagem"></textarea>
        <button class="enviar" id="btn">Enviar</button>
      </div>`;

    const fluxo = document.getElementById('fluxo');
    fluxo.scrollTop = fluxo.scrollHeight;
    fluxo.onscroll = () => { const noFim = fluxo.scrollHeight - fluxo.scrollTop - fluxo.clientHeight < 80;
      document.getElementById('desce').classList.toggle('on', !noFim); };
    carregarMidias();

    const txt = document.getElementById('txt');
    txt.oninput = () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 120) + 'px'; };
    txt.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } if (e.key === 'Escape') fecharRapidas(); };
    txt.addEventListener('input', () => { if (txt.value === '/') { txt.value = ''; abrirRapidas(); } });
    document.getElementById('btn').onclick = enviar;
    const vb = document.getElementById('volta');
    if (vb) vb.onclick = () => { document.body.classList.remove('aberta'); atual = null; };
    txt.focus();
  } catch (e) {
    elPain.innerHTML = `<div class="vazio">${esc(e.message)}</div>`;
  }
}

function corpoMsg(m) {
  const temMidia = m.midia_url && ['audio','imagem','video','documento','figurinha'].includes(m.tipo);
  let miolo = '';

  if (temMidia) {
    miolo = `<div class="midia" data-id="${m.id}" data-tipo="${m.tipo}">
      <span class="carregando-midia">abrindo…</span></div>`;
    if (m.texto) miolo += `<div style="margin-top:5px">${esc(m.texto)}</div>`;
  } else {
    miolo = m.texto ? esc(m.texto) : `<i>[${esc(m.tipo)}]</i>`;
  }

  if (m.tipo === 'audio') {
    if (m.transcricao) {
      miolo += `<div class="transcricao">${esc(m.transcricao)}</div>`;
    } else if (m.transcricao_status === 'pendente') {
      miolo += `<div class="pendente">Transcrição ainda não disponível</div>`;
    }
  }

  const resp = m.responde_a ? (() => { const o = (CONV_MSGS||[]).find(x => x.id === m.responde_a || x.provedor_msg_id === m.responde_a);
      return o ? `<div class="resp" onclick="irParaMsg('${o.id}')"><b>${o.direcao === 'saida' ? (o.autor === 'agente' ? 'Robô' : 'Você') : 'Cliente'}</b>${esc((o.texto || '[' + (o.tipo||'mídia') + ']').slice(0, 90))}</div>` : ''; })() : '';
  const tique = m.direcao === 'saida' ? `<span class="tique ${m.entrega === 'lida' ? 'lida' : ''}">${m.entrega === 'enviando' ? '🕓' : m.entrega === 'lida' || m.entrega === 'entregue' ? '✓✓' : '✓'}</span>` : '';
  return `<div class="msg ${m.direcao} ${m.mesmo ? 'mesmo' : ''} ${m.fim ? 'fim' : ''}" id="msg-${m.id}">
    ${!m.mesmo && m.direcao === 'saida' && m.autor && m.autor !== 'lead' ? `<span class="msg-autor">${m.autor === 'agente' ? 'Robô' : esc(m.autor === 'atendente' ? 'Você' : m.autor)}</span>` : ''}
    ${resp}${miolo}
    <div class="msg-meta"><span>${hora(m.criado_em)}</span>${tique}</div>
    <button class="msg-acao" title="Responder" onclick="responderMsg('${m.id}')">↩</button>
  </div>`;
}
// agrupa por dia e por autor, do jeito que o WhatsApp faz
function montarFluxo(msgs){
  CONV_MSGS = msgs;
  const hojeStr = new Date().toDateString(), onteStr = new Date(Date.now() - 864e5).toDateString();
  const rotuloDia = d => { const x = new Date(d).toDateString();
    return x === hojeStr ? 'Hoje' : x === onteStr ? 'Ontem' : new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year: new Date(d).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }); };
  let html = '', diaAnterior = null;
  msgs.forEach((m, i) => {
    const dia = new Date(m.criado_em).toDateString();
    if (dia !== diaAnterior) { html += `<div class="dia-sep">${rotuloDia(m.criado_em)}</div>`; diaAnterior = dia; }
    const ant = msgs[i-1], prox = msgs[i+1];
    const mesmoAnt = ant && ant.direcao === m.direcao && ant.autor === m.autor && new Date(m.criado_em) - new Date(ant.criado_em) < 120000 && new Date(ant.criado_em).toDateString() === dia;
    const mesmoProx = prox && prox.direcao === m.direcao && prox.autor === m.autor && new Date(prox.criado_em) - new Date(m.criado_em) < 120000;
    html += corpoMsg({ ...m, mesmo: !!mesmoAnt, fim: !mesmoProx });
  });
  return html;
}
let CONV_MSGS = [], RESPONDENDO = null;
function responderMsg(id){
  const m = (CONV_MSGS||[]).find(x => x.id === id); if (!m) return;
  RESPONDENDO = m;
  const box = document.getElementById('respondendo');
  if (box) { box.style.display = 'flex';
    box.innerHTML = `<div class="txt"><b>${m.direcao === 'saida' ? 'Você' : 'Cliente'}</b>${esc((m.texto || '[' + (m.tipo||'mídia') + ']').slice(0, 120))}</div><button onclick="cancelarResposta()" title="Cancelar">×</button>`; }
  const t = document.getElementById('txt'); if (t) t.focus();
}
function cancelarResposta(){ RESPONDENDO = null; const b = document.getElementById('respondendo'); if (b) { b.style.display = 'none'; b.innerHTML = ''; } }
function irParaMsg(id){ const el = document.getElementById('msg-' + id); if (!el) return; el.scrollIntoView({ behavior:'smooth', block:'center' }); el.classList.add('destaque'); setTimeout(() => el.classList.remove('destaque'), 1500); }

// As URLs são assinadas e valem 5 minutos, então só são pedidas na hora
// de exibir — nunca ficam guardadas na página.
async function carregarMidias() {
  const alvos = document.querySelectorAll('.midia[data-id]');
  for (const el of alvos) {
    try {
      const { url, mime } = await api('midia', { mensagem_id: el.dataset.id });
      const tipo = el.dataset.tipo;
      if (tipo === 'audio') {
        el.innerHTML = `<audio controls preload="none" src="${url}"></audio>`;
      } else if (tipo === 'imagem' || tipo === 'figurinha') {
        el.innerHTML = `<img src="${url}" alt="Imagem enviada na conversa"
          onclick="window.open('${url}','_blank')">`;
      } else if (tipo === 'video') {
        el.innerHTML = `<video controls preload="none" src="${url}" style="max-width:230px;border-radius:9px"></video>`;
      } else {
        el.innerHTML = `<a class="arquivo" href="${url}" target="_blank" rel="noopener">Abrir arquivo</a>`;
      }
    } catch {
      el.innerHTML = '<span class="carregando-midia">arquivo indisponível</span>';
    }
  }
}


// ---- atribuir / resolver ----
async function atribuir(id, quem){ try { await api('conversa_atualizar', { conversa_id: id, atendente: quem }); if (quem) { FI.eu = quem; try{ localStorage.setItem('capta_atendente', quem); }catch(e){} } toast(quem ? `Conversa com ${esc(quem)}` : 'Sem atendente'); carregarLista(); } catch(e){ toast(e.message,{tipo:'erro'}); } }
async function resolver(id, sim){ try { await api('conversa_atualizar', { conversa_id: id, resolvida: sim }); toast(sim ? 'Conversa resolvida' : 'Conversa reaberta', sim ? { acao:'desfazer', onAcao:() => resolver(id, false) } : {}); await abrir(id); carregarLista(); } catch(e){ toast(e.message,{tipo:'erro'}); } }
function irLead(id, aba){ try { localStorage.setItem('capta_abrir_lead', JSON.stringify({ id, aba, t: Date.now() })); } catch(e){} irPara('/funil.html'); }

// ---- respostas prontas ----
async function abrirRapidas(){
  if (!RAPIDAS) { try { RAPIDAS = (await api('respostas')).respostas || []; } catch(e){ RAPIDAS = []; } }
  const box = document.getElementById('rapidas'); if (!box) return;
  box.innerHTML = `<div class="rapidas">${RAPIDAS.map(r => `<div class="rp" onclick="usarRapida('${r.id}')"><b>${esc(r.titulo)}${r.atalho?` <span style="color:var(--faint);font-weight:600">/${esc(r.atalho)}</span>`:''}</b><small>${esc(r.texto)}</small></div>`).join('')}
    <div class="rp nova" onclick="novaRapida()">+ nova resposta pronta</div>${RAPIDAS.length?`<div class="rp nova" style="color:var(--faint)" onclick="apagarRapida()">apagar uma…</div>`:''}</div>`;
}
function fecharRapidas(){ const b = document.getElementById('rapidas'); if (b) b.innerHTML = ''; }
function usarRapida(id){ const r = RAPIDAS.find(x => x.id === id); const txt = document.getElementById('txt'); if (r && txt) { const nome = (CONVS.find(c=>c.id===atual)?.lead?.nome || '').split(' ')[0]; txt.value = (txt.value ? txt.value + ' ' : '') + r.texto.replace(/\{nome\}/g, nome); txt.focus(); txt.dispatchEvent(new Event('input')); } fecharRapidas(); }
async function novaRapida(){
  const titulo = prompt('Nome da resposta (ex.: Valor, Horários, Endereço):'); if (!titulo) return;
  const texto = prompt('Texto da mensagem (use {nome} pra colocar o nome da pessoa):'); if (!texto) return;
  const atalho = prompt('Atalho curto (opcional, ex.: valor):') || '';
  try { RAPIDAS = (await api('respostas', { salvar: { titulo, texto, atalho } })).respostas; toast('Resposta salva',{tipo:'ok'}); abrirRapidas(); } catch(e){ toast(e.message,{tipo:'erro'}); }
}
async function apagarRapida(){
  const nomes = RAPIDAS.map((r,i)=>`${i+1}. ${r.titulo}`).join('\n'); const n = parseInt(prompt('Qual apagar? Digite o número:\n'+nomes)||'0'); const r = RAPIDAS[n-1]; if (!r) return;
  try { RAPIDAS = (await api('respostas', { apagar: r.id })).respostas; abrirRapidas(); } catch(e){ toast(e.message,{tipo:'erro'}); }
}
document.addEventListener('click', e => { if (!e.target.closest('.rapidas') && !e.target.closest('.ico')) fecharRapidas(); });

// ---- anexos: imagem, áudio, documento (base64) ----
function enviarAnexo(input){
  const f = input.files && input.files[0]; input.value = ''; if (!f || !atual) return;
  if (f.size > 8 * 1024 * 1024) return toast('Arquivo acima de 8 MB.', { tipo:'erro' });
  const tipo = f.type.startsWith('image/') ? 'imagem' : f.type.startsWith('audio/') ? 'audio' : 'documento';
  const rd = new FileReader();
  rd.onload = async () => {
    const btn = document.getElementById('btn'); if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
    try { await api('enviar_midia', { conversa_id: atual, tipo, dados: rd.result, nome: f.name, legenda: (document.getElementById('txt')?.value || '').trim() || undefined }); const t = document.getElementById('txt'); if (t) t.value = ''; await abrir(atual); carregarLista(); toast('Enviado',{tipo:'ok'}); }
    catch(e){ toast(e.message,{tipo:'erro'}); }
    finally { const b = document.getElementById('btn'); if (b) { b.disabled = false; b.textContent = 'Enviar'; } }
  };
  rd.readAsDataURL(f);
}


// ---- importar histórico (.txt exportado do WhatsApp) ----
function importarTxt(opts){ // opts: {lead_id?, telefone?, depois}
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.txt,text/plain';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => previaImport(rd.result, opts); rd.readAsText(f); };
  inp.click();
}
async function previaImport(texto, opts){
  let pv; try { pv = await api('importar_historico', { texto, previa: true }); } catch(e){ return toast(e.message,{tipo:'erro'}); }
  const autores = Object.entries(pv.autores).sort((a,b)=>b[1]-a[1]);
  const box = document.createElement('div'); box.className = 'fundo'; box.id = 'imp-fundo';
  box.innerHTML = `<div class="janela"><h3>Importar conversa</h3><p>${pv.total} mensagens, de ${new Date(pv.de).toLocaleDateString('pt-BR')} a ${new Date(pv.ate).toLocaleDateString('pt-BR')}.<br>Quem é <b>a escola</b> nessa conversa? (o resto é o lead)</p>
    <div class="chips" style="margin-top:12px">${autores.map(([n,q]) => `<button class="chip" onclick="this.classList.toggle('on')" data-n="${esc(n)}">${esc(n)} <span style="opacity:.7">${q}</span></button>`).join('')}</div>
    ${opts.lead_id ? '' : `<div class="campo" style="margin-top:12px"><label>Telefone do lead (com DDD)</label><input id="imp-tel" placeholder="92999999999"></div>`}
    <div class="fim"><button class="btn g" onclick="document.getElementById('imp-fundo').remove()">Cancelar</button><button class="btn" id="imp-ok">Importar</button></div></div>`;
  document.body.appendChild(box);
  document.getElementById('imp-ok').onclick = async () => {
    const nomes = [...box.querySelectorAll('.chip.on')].map(c => c.dataset.n); if (!nomes.length) return toast('Marque quem é a escola.',{tipo:'erro'});
    const telefone = opts.telefone || (document.getElementById('imp-tel') || {}).value;
    try { const r = await api('importar_historico', { texto, nomes_escola: nomes, lead_id: opts.lead_id, telefone }); box.remove(); toast(`${r.importadas} mensagens importadas`, {tipo:'ok'}); opts.depois && opts.depois(r); }
    catch(e){ toast(e.message,{tipo:'erro'}); }
  };
}

async function assumir(id, quem){
  try { await api('conversa_atualizar', { conversa_id: id, assumir: quem }); toast('Você assumiu esta conversa', { tipo:'ok' }); await abrir(id); carregarLista(); }
  catch(e){ if (/está atendendo/.test(e.message) && confirm(e.message + '\n\nAssumir mesmo assim?')) { await api('conversa_atualizar', { conversa_id: id, atendente: quem }); await abrir(id); carregarLista(); } else toast(e.message, { tipo:'erro' }); }
}
async function enviar() {
  const txt = document.getElementById('txt'), btn = document.getElementById('btn');
  const texto = txt.value.trim();
  if (!texto || !atual) return;

  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    try { await api('enviar', { conversa_id: atual, texto, autor: (window.CaptaUser&&CaptaUser.nome())||'atendente', responde_a: RESPONDENDO ? RESPONDENDO.id : undefined }); cancelarResposta(); }
    catch(err){ if (/está atendendo/.test(err.message)) { if (!confirm(err.message)) { txt.value = texto; throw err; } await api('enviar', { conversa_id: atual, texto, autor: (window.CaptaUser&&CaptaUser.nome())||'atendente', forcar: true }); } else throw err; }
    txt.value = ''; txt.style.height = 'auto'; toast('Enviado', { tipo:'ok', ms: 1500 });
    await abrir(atual);
    carregarLista();
  } catch (e) {
    toast(e.message,{tipo:'erro'});
  } finally {
    const b = document.getElementById('btn');
    if (b) { b.disabled = false; b.textContent = 'Enviar'; }
  }
}

if (!SLUG || !TOKEN) {
  elCont.textContent = '';
  elConvs.innerHTML = '<div class="vazio">Abra esta página pelo painel do seu negócio.</div>';
} else {
  carregarLista();
  timer = setInterval(() => { carregarLista(); if (atual) abrir(atual); }, 10000);
  document.addEventListener('visibilitychange', () => {
    clearInterval(timer);
    if (!document.hidden) {
      carregarLista(); if (atual) abrir(atual);
      timer = setInterval(() => { carregarLista(); if (atual) abrir(atual); }, 10000);
    }
  });
}
