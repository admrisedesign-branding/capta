<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula experimental — Capta</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2E5BFF; --brand-2:#5B8DEF; --brand-soft:rgba(46,91,255,.10); --brand-softer:rgba(46,91,255,.06);
  --bg:#F4F6FB; --card:#FFFFFF; --line:#E9ECF3; --line-2:#F1F3F8;
  --ink:#141A2E; --muted:#697089; --faint:#9AA1B4;
  --quente:#E03127; --morno:#C47A08; --verde:#16A34A; --verde-bg:rgba(22,163,74,.12); --gray-bg:rgba(105,112,137,.12);
  --r:16px; --shadow:0 1px 2px rgba(20,26,46,.04),0 6px 20px rgba(20,26,46,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,select,input,textarea{font-family:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.voltar{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;padding:7px 13px;border-radius:10px;text-decoration:none}
.ferr{margin-left:auto;display:flex;gap:8px;align-items:center}
.abas{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:10px}
.abas button{border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:8px}
.abas button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px}
.btn.g{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.btn.v{background:var(--verde)} .btn.a{background:var(--morno)} .btn.x{background:var(--faint)}
.btn:disabled{opacity:.5;cursor:default}
.wrap{padding:20px 26px 48px;max-width:1100px;margin:0 auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);min-width:130px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}.kpi .v{font-size:20px;font-weight:800;margin-top:2px}
.dia{margin-top:18px}
.dia h2{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.dia h2 span{color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0;margin-left:8px}
.aula{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;margin-bottom:8px}
.aula .h{font-weight:800;font-size:15px}.aula .h small{display:block;font-size:11px;color:var(--faint);font-weight:600}
.aula .n{font-weight:700}.aula .s{font-size:12px;color:var(--muted);margin-top:2px}
.aula .acs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.st.compareceu{background:var(--verde-bg);color:var(--verde)}.st.faltou{background:rgba(224,49,39,.12);color:var(--quente)}.st.cancelado{background:var(--gray-bg);color:var(--muted)}.st.confirmado{background:rgba(224,147,15,.14);color:var(--morno)}
.et{font-size:11px;font-weight:700;color:var(--faint)}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--faint);line-height:1.7}
.fundo{position:fixed;inset:0;background:rgba(20,26,46,.42);display:grid;place-items:center;padding:20px;z-index:50}
.janela{background:var(--card);border-radius:var(--r);padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(20,26,46,.2)}
.janela h3{font-size:16px;font-weight:700}.janela p{color:var(--muted);font-size:13px;margin-top:4px}
.campo{margin-top:12px}.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.campo select,.campo input,.campo textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink);background:var(--card)}
.l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fim{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
</style>
<style>body.embed .voltar{display:none}body.embed .topbar{height:52px;background:transparent;backdrop-filter:none;border-bottom:1px solid var(--line);padding:0 18px}</style>
<script>if(new URLSearchParams(location.search).get('embed')==='1'){document.documentElement.classList.add('embed');document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('embed'));}</script>
</head>
<body>
<div class="topbar">
  <a class="voltar" id="voltar" href="/dashboard.html">← Painel</a>
  <h1>Aula experimental</h1>
  <div class="ferr">
    <div class="abas"><button class="on" id="ab-hoje" onclick="modo('hoje')">Hoje</button><button id="ab-semana" onclick="modo('semana')">Semana</button><button id="ab-pend" onclick="modo('pend')">Sem desfecho</button><button id="ab-tudo" onclick="modo('tudo')">Tudo</button></div>
  </div>
</div>
<div class="wrap" id="raiz"><div class="vazio">Carregando…</div></div>
<div id="modal"></div>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
document.getElementById('voltar').href = `/dashboard.html?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const hh = t => String(t||'').slice(0,5);
const hoje = new Date().toISOString().slice(0,10);
const MOTIVOS = ['Orçamento','Horário não bate','Vai pensar','Distância','Criança não se adaptou','Só pesquisando'];
const PAGTOS = ['Pix','cartão','boleto','recorrente'];
const KITS = ['First','OneBot','TechBot','Autobot','App Developer','GameBot'];
let D = { agendamentos: [], turmas: [], leads: [] }, MODO = 'hoje', SEL = null;

async function api(acao, extra = {}) {
  const r = await fetch('/api/capta-whatsapp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ acao, slug:SLUG, token:TOKEN, ...extra }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`); return d;
}
async function carregar(){ try { D = await api('experimentais'); desenhar(); } catch(e){ document.getElementById('raiz').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; } }
function modo(m){ MODO = m; ['hoje','semana','pend','tudo'].forEach(x => document.getElementById('ab-'+x).classList.toggle('on', x===m)); desenhar(); }
const leadDe = a => D.leads.find(l => l.id === a.lead_id) || {};
const turmaDe = a => D.turmas.find(t => t.id === a.turma_id) || {};
const pendente = a => ['agendado','confirmado','compareceu'].includes(a.status) && a.data <= hoje;

function desenhar(){
  const fim7 = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  let lista = D.agendamentos.filter(a => a.status !== 'cancelado');
  if (MODO === 'hoje') lista = lista.filter(a => a.data === hoje);
  if (MODO === 'semana') lista = lista.filter(a => a.data >= hoje && a.data <= fim7);
  if (MODO === 'pend') lista = lista.filter(pendente);
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="l">Hoje</div><div class="v">${D.agendamentos.filter(a=>a.data===hoje&&a.status!=='cancelado').length}</div></div>
    <div class="kpi"><div class="l">Próximos 7 dias</div><div class="v">${D.agendamentos.filter(a=>a.data>hoje&&a.data<=fim7&&a.status!=='cancelado').length}</div></div>
    <div class="kpi"><div class="l">Sem desfecho</div><div class="v">${D.agendamentos.filter(pendente).length}</div></div>
    <div class="kpi"><div class="l">Faltas (14 dias)</div><div class="v">${D.agendamentos.filter(a=>a.status==='faltou').length}</div></div>
  </div>`;
  if (!lista.length) { document.getElementById('raiz').innerHTML = kpis + `<div class="vazio">Nenhuma aula experimental ${MODO==='hoje'?'hoje':MODO==='semana'?'nos próximos 7 dias':MODO==='pend'?'sem desfecho':'no período'}.<br>Aulas são marcadas no Pipeline, no painel do lead → Agendar aula.</div>`; return; }
  const dias = [...new Set(lista.map(a => a.data))].sort();
  document.getElementById('raiz').innerHTML = kpis + dias.map(d => {
    const dt = new Date(d + 'T12:00:00');
    const its = lista.filter(a => a.data === d);
    return `<div class="dia"><h2>${DIAS[dt.getDay()]} ${dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}${d===hoje?' · hoje':''}<span>${its.length} aula${its.length>1?'s':''}</span></h2>
      ${its.map(cartao).join('')}</div>`; }).join('');
}
function cartao(a){
  const l = leadDe(a), t = turmaDe(a);
  const feito = ['faltou'].includes(a.status) || (a.status === 'compareceu' && a.observacao && /desfecho:/i.test(a.observacao));
  return `<div class="aula">
    <div class="h">${hh(a.hora_inicio)}<small>${hh(a.hora_fim)}${t.nome?' · '+esc(t.nome):''}</small></div>
    <div><div class="n">${esc(a.crianca_nome || l.nome || 'Criança')}${a.crianca_idade ? ` <span class="et">${a.crianca_idade} anos</span>` : ''} <span class="st ${a.status}">${a.status}</span></div>
      <div class="s">${esc(l.nome||'')}${l.contato?' · '+esc(l.contato):''}${l.atendente?' · atendido por '+esc(l.atendente):''}${a.observacao?' · '+esc(a.observacao):''}</div></div>
    <div class="acs">
      ${a.data > hoje ? `<button class="btn g" onclick="desfecho('${a.id}','faltou')">Faltou</button>` : `
      <button class="btn v" onclick="desfecho('${a.id}','matriculou')">Matriculou</button>
      <button class="btn a" onclick="desfecho('${a.id}','andamento')">Em andamento</button>
      <button class="btn x" onclick="desfecho('${a.id}','nao')">Não matriculou</button>
      <button class="btn g" onclick="desfecho('${a.id}','faltou')">Faltou</button>`}
      ${l.kommo_lead_id ? `<a class="btn g" style="text-decoration:none" href="https://roboticanorte.kommo.com/leads/detail/${l.kommo_lead_id}" target="_blank" rel="noopener">Kommo ↗</a>` : ''}
    </div></div>`;
}

let ESC = {};
function desfecho(id, tipo){
  const a = D.agendamentos.find(x => x.id === id); const l = leadDe(a);
  SEL = { id, tipo }; ESC = {};
  const titulo = { matriculou:'Matriculou 🎉', andamento:'Matrícula em andamento', nao:'Não matriculou', faltou:'Faltou' }[tipo];
  const corpo = tipo === 'matriculou' ? `
      <div class="l2"><div class="campo"><label>Valor da matrícula (R$)</label><input id="f-valor" type="number" min="0" step="10" placeholder="ex.: 397"></div>
        <div class="campo"><label>Kit / curso</label><select id="f-curso">${KITS.map(k=>`<option ${k==='First'?'selected':''}>${k}</option>`).join('')}</select></div></div>
      <div class="campo"><label>Pagamento</label><div class="chips">${PAGTOS.map(v=>`<button class="chip" onclick="pick('pagamento','${v}',this)">${v}</button>`).join('')}</div></div>
      <div class="campo"><label>Turma do aluno</label><select id="f-turma">${D.turmas.map(t=>`<option value="${t.id}" ${t.id===a.turma_id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div>
      <div class="campo"><label>Nome completo do aluno</label><input id="f-aluno" value="${esc(a.crianca_nome||'')}"></div>`
    : tipo === 'nao' ? `<div class="campo"><label>Motivo</label><div class="chips">${MOTIVOS.map(v=>`<button class="chip" onclick="pick('motivo','${v}',this)">${v}</button>`).join('')}</div></div>`
    : tipo === 'faltou' ? `<p>O lead continua em "Aula agendada" e recebe a tag <b>reagendar devido falta</b> no Kommo. Reagende pelo Pipeline → Agendar aula.</p>` : `<p>O lead vai para <b>Matrícula em andamento</b> no Pipeline e no Kommo.</p>`;
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela">
    <h3>${titulo}</h3><p>${esc(a.crianca_nome||l.nome||'')} · ${new Date(a.data+'T12:00').toLocaleDateString('pt-BR')} ${hh(a.hora_inicio)}</p>
    ${corpo}
    <div class="campo"><label>Observação</label><input id="f-obs" placeholder="opcional"></div>
    <div class="fim"><button class="btn g" onclick="fechar()">Cancelar</button><button class="btn" onclick="confirmar()">Confirmar</button></div>
  </div></div>`;
  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fechar(); };
}
function pick(k, v, el){ ESC[k] = v; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); el.classList.add('on'); }
function fechar(){ document.getElementById('modal').innerHTML = ''; SEL = null; }
async function confirmar(){
  const g = x => { const e = document.getElementById(x); return e ? e.value : undefined; };
  const d = { agendamento_id: SEL.id, desfecho: SEL.tipo, observacao: `desfecho: ${SEL.tipo}${g('f-obs') ? ' · ' + g('f-obs') : ''}` };
  if (SEL.tipo === 'matriculou') Object.assign(d, { valor: g('f-valor'), curso: g('f-curso'), pagamento: ESC.pagamento || null, turma_id: g('f-turma'), aluno_nome: g('f-aluno') });
  if (SEL.tipo === 'nao') { if (!ESC.motivo) return alert('Escolha o motivo.'); d.motivo = ESC.motivo; }
  try { const b = document.querySelector('.janela .btn:not(.g)'); b.disabled = true; await api('desfecho', d); fechar(); await carregar(); } catch(e){ alert(e.message); }
}
if (!SLUG || !TOKEN) document.getElementById('raiz').textContent = 'Abra esta página pelo painel do seu negócio.'; else carregar();
</script>
</body>
</html>
