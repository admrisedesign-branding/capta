<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula experimental — Capta</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2E5BFF; --brand-2:#5B8DEF; --brand-soft:rgba(46,91,255,.10); --brand-softer:rgba(46,91,255,.06);
  --bg:#F4F6FB; --card:#FFFFFF; --line:#E9ECF3; --line-2:#F1F3F8;
  --ink:#141A2E; --muted:#697089; --faint:#9AA1B4;
  --quente:#E03127; --morno:#C47A08; --verde:#16A34A; --verde-bg:rgba(22,163,74,.12); --gray-bg:rgba(105,112,137,.12);
  --r:16px; --shadow:0 1px 2px rgba(20,26,46,.04),0 6px 20px rgba(20,26,46,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,select,input,textarea{font-family:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.voltar{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;padding:7px 13px;border-radius:10px;text-decoration:none}
.ferr{margin-left:auto;display:flex;gap:8px;align-items:center}
.abas{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:10px}
.abas button{border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:8px}
.abas button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px}
.btn.g{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.btn.v{background:var(--verde)} .btn.a{background:var(--morno)} .btn.x{background:var(--faint)}
.btn:disabled{opacity:.5;cursor:default}
.wrap{padding:20px 26px 48px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);min-width:130px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}.kpi .v{font-size:20px;font-weight:800;margin-top:2px}
.dia{margin-top:18px}
.dia h2{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.dia h2 span{color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0;margin-left:8px}
.aula{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;margin-bottom:8px}
.aula .h{font-weight:800;font-size:15px}.aula .h small{display:block;font-size:11px;color:var(--faint);font-weight:600}
.aula .n{font-weight:700}.aula .s{font-size:12px;color:var(--muted);margin-top:2px}
.aula .acs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.st.compareceu{background:var(--verde-bg);color:var(--verde)}.st.faltou{background:rgba(224,49,39,.12);color:var(--quente)}.st.cancelado{background:var(--gray-bg);color:var(--muted)}.st.confirmado{background:rgba(224,147,15,.14);color:var(--morno)}
.et{font-size:11px;font-weight:700;color:var(--faint)}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--faint);line-height:1.7}
.fundo{position:fixed;inset:0;background:rgba(20,26,46,.42);display:grid;place-items:center;padding:20px;z-index:50}
.janela{background:var(--card);border-radius:var(--r);padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(20,26,46,.2)}
.janela h3{font-size:16px;font-weight:700}.janela p{color:var(--muted);font-size:13px;margin-top:4px}
.campo{margin-top:12px}.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.campo select,.campo input,.campo textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink);background:var(--card)}
.l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fim{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
body.embed .topbar{display:none}body.embed .wrap{padding-top:16px}
.nav{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:700;color:var(--muted)}
.periodo{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13.5px}
.tally{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 18px;display:flex;gap:26px;margin-bottom:14px;flex-wrap:wrap}
.tally b{font-size:22px;font-weight:800;margin-right:6px}.tally small{color:var(--muted);font-weight:600;font-size:12.5px}.tally .hot b{color:var(--morno)}.tally .bad b{color:var(--quente)}
.corpo{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
@media(max-width:980px){.corpo{grid-template-columns:1fr}}
.semana{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;min-width:720px}
.colw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:220px;box-shadow:var(--shadow)}
.colw.hoje{border-color:var(--brand)}
.colw h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.colw .nada{color:var(--faint);font-size:12.5px}
.ev{background:var(--brand-softer);border-left:3px solid var(--brand-2);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.ev:hover{background:var(--brand-soft)}
.ev.faltou{border-left-color:var(--quente);opacity:.75}.ev.compareceu{border-left-color:var(--verde)}.ev.quente{border-left-color:var(--quente)}
.ev .t{font-weight:800;font-size:13px}.ev .m{font-size:12px;color:var(--muted);margin-top:2px}
.ev .st{margin-left:6px}
.estoque{display:inline-flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.etq{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--line-2);color:var(--muted)}
.etq.alerta{background:rgba(224,147,15,.14);color:var(--morno)}.etq.cheio{background:rgba(224,49,39,.12);color:var(--quente)}
.lado{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.lado h5{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.lado .k{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.lado .k:last-child{border:0}.lado .k b{font-variant-numeric:tabular-nums}
.lado .leg{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:10px}
.nota{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:14px}
.nota b{color:var(--ink)}
.dia-lista .aula{grid-template-columns:70px 1fr auto}
.scrollx{overflow-x:auto}

/* ---- card do dia (rotina da recepção) ---- */
.cardx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;position:relative}
.cardx.win{border-color:rgba(22,163,74,.4)}.cardx.lost{border-color:rgba(224,49,39,.35)}.cardx.hold{border-color:rgba(224,147,15,.4)}.cardx.gone{opacity:.8}
.cardx .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardx .hora{font-weight:800;font-size:15px;color:var(--muted);min-width:52px}
.cardx .kid{font-weight:800;font-size:15px}.cardx .kid em{font-style:normal;font-weight:600;color:var(--faint);font-size:12.5px;margin-left:4px}
.cardx .guard{font-size:12.5px;color:var(--muted);margin-top:2px}
.cardx .sinal{font-size:12.5px;color:var(--ink);background:var(--line-2);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}
.cardx .scriptbtn{position:absolute;right:14px;top:12px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 9px}
.cardx .scriptbtn:hover{color:var(--brand);border-color:var(--brand)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--muted)}
.acts button.yes{background:var(--verde);border-color:var(--verde);color:#fff}.acts button.nope{background:rgba(224,49,39,.1);border-color:rgba(224,49,39,.25);color:var(--quente)}
.menu{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.menu p{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.menu .chips{margin-top:4px}
.menu textarea,.menu input,.menu select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card)}
.menu .l2{margin-top:8px}
.menu .save{margin-top:8px}
.done{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.done.win{background:var(--verde-bg)}.done.lost{background:rgba(224,49,39,.1)}.done.hold{background:rgba(224,147,15,.14)}.done.neutral{background:var(--line-2)}
.done .undo{border:0;background:transparent;font-weight:700;color:var(--muted);text-decoration:underline;white-space:nowrap}
.vagas3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:760px){.vagas3{grid-template-columns:1fr}}
.vg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.vg b{display:block;font-size:13px}.vg small{color:var(--muted)}
.vg button{margin-top:6px;width:100%}
.badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--line-2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.badge.q{background:rgba(224,49,39,.12);color:var(--quente)}.badge.m{background:rgba(224,147,15,.14);color:var(--morno)}.badge.f{background:var(--brand-soft);color:var(--brand)}
.acts.quatro{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts.quatro button{padding:14px 12px;font-size:15px;font-weight:700;border-radius:12px}
.acts.quatro .yes{background:#3C8C5A;border-color:#3C8C5A}
.acts.quatro .nope{background:#FCF1EF;border-color:#F1CFC9;color:#C5392E}
.acts.mini{margin-top:6px;gap:12px}.acts.mini button{border:0;background:transparent;padding:2px 0;font-size:12px;color:var(--faint);text-decoration:underline}
.acts-mini{display:flex;gap:4px;margin-top:6px}
.acts-mini button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 0;font-weight:800;font-size:11px;color:var(--muted);cursor:pointer}
.acts-mini .yes{background:var(--verde);border-color:var(--verde);color:#fff}.acts-mini .nope{background:rgba(224,49,39,.1);border-color:rgba(224,49,39,.25);color:var(--quente)}
.mes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:760px}.mes .hd{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px}
.dcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:84px;cursor:pointer}.dcell:hover,.dcell.hoje{border-color:var(--brand)}.dcell.fora{opacity:.4}
.dcell .n{font-weight:800;font-size:13px}.dcell .i{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}.dcell .i b{color:var(--ink)}.dcell .i .e{color:var(--verde);font-weight:700}.dcell .i .z{color:var(--quente);font-weight:700}
.ev[draggable]{cursor:grab}.cardx[draggable]{cursor:grab}.cardx[draggable] button,.cardx[draggable] input,.cardx[draggable] textarea{cursor:pointer}
/* drawer da conversa */
#drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(20,26,46,.08);transform:translateX(100%);transition:.18s;z-index:45;display:flex;flex-direction:column}
#drawer.aberto{transform:none}
#drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer .dh h3{font-size:14px;font-weight:800}#drawer .dh .x{margin-left:auto;border:0;background:transparent;font-size:18px;color:var(--faint)}
#drawer .dc{flex:1;overflow-y:auto;padding:12px 16px}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:8px 10px;border-radius:12px;font-size:13px;line-height:1.45;background:var(--line-2);align-self:flex-start;white-space:pre-wrap}
.msg.saida{background:var(--brand-soft);align-self:flex-end}.msg small{display:block;color:var(--faint);font-size:10.5px;margin-top:3px}
.aviso-p{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--faint);font-size:12.5px;line-height:1.6;text-align:center}

/* ---- linha do tempo do dia (protótipo) ---- */
.tl{display:grid;grid-template-columns:120px 1fr;border-left:0}
.tl .h{padding:14px 10px 14px 0;text-align:right;border-right:2px solid var(--line);position:relative}
.tl .h.tem{border-right-color:var(--exp)}
.tl .h b{font-size:17px;font-weight:800;color:var(--ink)}.tl .h .vg{font-size:12.5px;font-weight:700;color:var(--verde);margin-top:2px}.tl .h .vg.z{color:var(--quente)}.tl .h .vg.n{color:var(--faint);font-weight:600}
.tl .h .kf{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:8px}.tl .h .kf.alerta{color:var(--morno);background:rgba(224,147,15,.14);display:inline-block;padding:1px 6px;border-radius:6px}.tl .h .kf.cheio{color:var(--quente)}
.tl .c{padding:10px 0 10px 16px;min-height:74px}
.tl .c .livre{color:var(--faint);font-size:13.5px;padding:14px 0}
.tl .c.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:900px){.tl .c.dois{grid-template-columns:1fr}}
.cardx.win{background:#F2FAF4;border-color:#BFE3C9}.cardx.lost{background:#FCF3F2;border-color:#F0C6C3}.cardx.hold{background:#FDF8EC;border-color:#EAD7A5}
.cardx.gone{border-style:dashed;opacity:.85}.cardx.gone .kid{text-decoration:line-through}
.rot{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.rot.q{color:var(--quente)}.rot.m{color:var(--morno);background:rgba(224,147,15,.12)}.rot.f{color:var(--muted);background:var(--line-2);border:1px solid var(--line)}
.org{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600;background:var(--line-2);color:var(--muted)}
.o-ads{background:#F0ECFB;color:#6543BC}.o-org{background:#FDEDF4;color:#B7276B}.o-site{background:#EAF0FF;color:#2E5BFF}.o-wpp{background:#E8F7EE;color:#1E7A45}.o-evt{background:#FFF3E0;color:#B35C00}
.rea{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--line-2);color:var(--muted)}
.sinal{border-left:3px solid var(--line);padding:2px 10px;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5;background:transparent}
.done{background:var(--card)!important;border:1px solid var(--line);align-items:flex-start}
.done.win b,.done.win .cor{color:var(--verde)}.done.lost b,.done.lost .cor{color:var(--quente)}.done.hold b,.done.hold .cor{color:var(--morno)}
.done i{display:block;font-style:italic;margin-top:2px}
.done .undo.alt{font-weight:800;text-decoration:none;color:var(--ink)}
</style>
<style>body.embed .voltar,body.embed .topbar h1{display:none}body.embed .topbar{height:auto;min-height:0;background:transparent;backdrop-filter:none;border-bottom:0;padding:10px 18px 0;position:static;justify-content:flex-end}body.embed .topbar:not(:has(.ferr)):not(:has(.abas)):not(:has(button)){display:none}</style>
<script>if(new URLSearchParams(location.search).get('embed')==='1'){document.documentElement.classList.add('embed');document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('embed'));}</script>
<style>
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink,#141A2E);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(20,26,46,.25);display:flex;align-items:center;gap:12px;animation:tin .18s ease-out;max-width:560px}
.toast.erro{background:#B3261E}.toast.ok{background:#1F7A4D}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
.toast button:hover{background:rgba(255,255,255,.24)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<script>
// aviso discreto no rodapé, com ação opcional (ex.: desfazer)
function toast(msg, opts){ opts = opts || {}; let box = document.getElementById('toasts'); if(!box){ box = document.createElement('div'); box.id='toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast' + (opts.tipo?' '+opts.tipo:''); el.innerHTML = `<span>${msg}</span>${opts.acao?`<button type="button">${opts.acao}</button>`:''}`;
  if(opts.acao) el.querySelector('button').onclick = () => { el.remove(); opts.onAcao && opts.onAcao(); };
  box.appendChild(el); setTimeout(() => el.remove(), opts.ms || (opts.acao ? 7000 : 3500)); return el; }
// mensagem pro painel (quando embutido): trocar de tela sem sair
function irPara(pagina){ if(window.parent !== window) window.parent.postMessage({ capta:'ir', pagina }, '*'); else location.href = pagina + location.search; }
</script>

<script src="/lead-painel.js"></script>

<script>
// Quem está usando: vem do login (?u=Nome&papel=) e fica salvo por negócio.
window.CaptaUser = (function(){
  const q = new URLSearchParams(location.search); const slug = q.get('t') || '';
  const K = 'capta_user_' + slug;
  let u = null; try { u = JSON.parse(localStorage.getItem(K) || 'null'); } catch(e){}
  if (q.get('u')) { u = { nome: q.get('u'), papel: q.get('papel') || 'atendente', email: q.get('e') || (u&&u.email) || '' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} }
  return {
    nome: () => (u && u.nome) || '',
    papel: () => (u && u.papel) || '',
    email: () => (u && u.email) || '',
    telas: () => (u && u.telas) || null,
    definir: nome => { u = { ...(u||{}), nome, papel: (u && u.papel) || 'atendente' }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    setar: o => { u = { ...(u||{}), ...o }; try { localStorage.setItem(K, JSON.stringify(u)); } catch(e){} },
    sair: () => { try { localStorage.removeItem(K); } catch(e){} }
  };
})();
</script>

</div>
<div class="wrap" id="raiz"><div class="vazio">Carregando…</div></div>

<aside id="drawer"></aside>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
document.getElementById('voltar').href = `/dashboard.html?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const hh = t => String(t||'').slice(0,5);
const hoje = new Date().toISOString().slice(0,10);
const MOTIVOS = ['Orçamento','Horário não bate','Vai pensar','Distância','Criança não se adaptou','Só pesquisando'];
const PAGTOS = ['Pix','cartão','boleto','recorrente'];
const KITS = ['First','OneBot','TechBot','Autobot','App Developer','GameBot'];
let SEMDATA = [], MOSTRA_SD = false;
let D = { agendamentos: [], turmas: [], leads: [] }, MODO = 'semana', SEL = null, SELDIA = hoje, VAGAS = null, KITS_T = [];
const addDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
const segunda = d => { const x = new Date(d + 'T12:00:00'); const w = x.getDay(); x.setDate(x.getDate() - (w === 0 ? 6 : w - 1)); return x.toISOString().slice(0,10); };
const fmt = (d, o) => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', o || { day:'numeric', month:'long' });

async function api(acao, extra = {}) {
  const r = await fetch('/api/capta-whatsapp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ acao, slug:SLUG, token:TOKEN, email_atual: (window.CaptaUser && CaptaUser.email && CaptaUser.email()) || undefined, ...extra }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`); return d;
}
async function carregar(){
  try {
    const de = addDias(segunda(SELDIA), -42), ate = addDias(segunda(SELDIA), 49);
    const [ex, al, ag, sd] = await Promise.all([api('experimentais', { de, ate }), api('alunos').catch(() => ({ kits: [] })), api('agenda', { dias: 42 }).catch(() => null), api('sem_data').catch(() => ({ leads: [] }))]);
    D = ex; KITS_T = al.kits || []; VAGAS = ag && ag.horarios ? ag.horarios : null; SEMDATA = sd.leads || []; desenhar();
  } catch(e){ document.getElementById('raiz').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}
function modo(m){ MODO = m; desenhar(); }
const abasHtml = () => `<div class="abas" style="margin-left:auto">${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([k,t])=>`<button class="${MODO===k?'on':''}" onclick="modo('${k}')">${t}</button>`).join('')}</div>`;
function mover(n){ if (MODO === 'mes') { const x = new Date(SELDIA + 'T12:00:00'); x.setMonth(x.getMonth() + n, 1); SELDIA = x.toISOString().slice(0,10); } else SELDIA = addDias(SELDIA, MODO === 'dia' ? n : 7*n); const de = addDias(segunda(SELDIA), -42), ate = addDias(segunda(SELDIA), 49); const min = D.agendamentos[0] && D.agendamentos[0].data; if (SELDIA < de + 0 || SELDIA > ate) carregar(); else desenhar(); }
function irHoje(){ SELDIA = hoje; carregar(); }
const leadDe = a => D.leads.find(l => l.id === a.lead_id) || {};
const turmaDe = a => D.turmas.find(t => t.id === a.turma_id) || {};
const viva = a => !['cancelado','remarcado'].includes(a.status) && !a.remarcado_para;
const pendente = a => ['agendado','confirmado','compareceu'].includes(a.status) && a.data <= hoje && !(a.observacao && /desfecho:/i.test(a.observacao));

function estoque(a){
  if (!VAGAS) return '';
  const v = VAGAS.find(h => h.turma_id === a.turma_id && h.data === a.data); if (!v) return '';
  const liv = v.vagas ?? 0, cap = v.capacidade ?? 0;
  return `<span class="estoque"><span class="etq ${liv<=0?'cheio':liv<=2?'alerta':''}">First ${liv}/${cap}</span>${v.sala_livre!=null?`<span class="etq">sala ${v.sala_livre}</span>`:''}</span>`;
}
function ev0(a){
  const l = leadDe(a); const q = (l.temperatura||'').toLowerCase() === 'quente';
  return `<div class="ev ${a.status} ${q?'quente':''}" onclick="abrir('${a.id}')">
    <div class="t">${hh(a.hora_inicio)} ${esc(a.crianca_nome || l.nome || 'Criança')}${a.status!=='agendado'?`<span class="st ${a.status}">${a.status}</span>`:''}</div>
    <div class="m">${a.crianca_idade ? a.crianca_idade + ' anos · ' : ''}${esc(l.nome||'')}${l.atendente?' · '+esc(l.atendente):''}</div>
    ${estoque(a)}</div>`;
}
function ev(a){
  const D_ = desfechoDe(a); const feito = D_ || a.status === 'faltou';
  const btns = feito ? '' : `<div class="acts-mini"><button class="yes" onclick="event.stopPropagation();abrirMenuDialog('${a.id}','matriculou')" title="Matriculou">M</button><button class="nope" onclick="event.stopPropagation();abrirMenuDialog('${a.id}','nao')" title="Não matriculou">N</button><button onclick="event.stopPropagation();abrirMenuDialog('${a.id}','andamento')" title="Em andamento">A</button><button onclick="event.stopPropagation();registrar('${a.id}','faltou',{})" title="Faltou">F</button></div>`;
  let h = ev0(a).replace(`onclick="abrir('${a.id}')"`, `draggable="true" ondragstart="dragAula(event,'${a.id}')" onclick="detalhes('${a.id}')"`);
  const k = h.lastIndexOf('</div>'); return h.slice(0, k) + btns + h.slice(k);
}
// arrastar aula pra outro dia (semana) ou hora (dia): confirma antes de remarcar
let DRAG = null;
function dragAula(ev, id){ DRAG = id; ev.dataTransfer.effectAllowed = 'move'; }
function dropDia(ev, data, hora){
  ev.preventDefault(); const id = DRAG; DRAG = null; if (!id) return;
  const a = D.agendamentos.find(x => x.id === id); if (!a) return;
  const h = hora != null ? hora : parseInt(a.hora_inicio);
  const turma = D.turmas.filter(t => t.dia_semana === new Date(data+'T12:00').getDay()).sort((x,y)=>Math.abs(parseInt(x.hora_inicio)-h)-Math.abs(parseInt(y.hora_inicio)-h))[0];
  if (!turma) return toast('Não há turma nesse dia.', { tipo:'erro' });
  if (data === a.data && parseInt(turma.hora_inicio) === parseInt(a.hora_inicio)) return;
  const l = leadDe(a);
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela"><h3>Remarcar ${esc(a.crianca_nome||l.nome||'')}?</h3>
    <p>De <b>${DIAS[new Date(a.data+'T12:00').getDay()]} ${new Date(a.data+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} ${hh(a.hora_inicio)}</b> para <b>${DIAS[new Date(data+'T12:00').getDay()]} ${new Date(data+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} ${hh(turma.hora_inicio)}</b>. O Kommo recebe a nova data e a tag <i>reagendado</i>.</p>
    <div class="fim"><button class="btn g" onclick="fechar()">Cancelar</button><button class="btn" onclick="fechar();reagendar('${id}','${turma.id}','${data}')">Sim, remarcar</button></div></div></div>`;
}
// detalhes da aula (dialog) com as quatro opções + reagendar/cancelar + script
function detalhes(id){
  const a = D.agendamentos.find(x => x.id === id); if (!a) return; const l = leadDe(a), t = turmaDe(a); const D_ = desfechoDe(a);
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela" style="max-width:520px">
    <h3>${esc(a.crianca_nome||l.nome||'Criança')}${a.crianca_idade?` <span style="color:var(--faint);font-weight:600;font-size:13px">${a.crianca_idade} anos</span>`:''}</h3>
    <p>${DIAS[new Date(a.data+'T12:00').getDay()]} ${new Date(a.data+'T12:00').toLocaleDateString('pt-BR')} · ${hh(a.hora_inicio)}–${hh(a.hora_fim)}${t.nome?' · '+esc(t.nome):''}<br>com ${esc(l.nome||'responsável')}${l.contato?' · '+esc(l.contato):''}${l.atendente?' · atendido por '+esc(l.atendente):''}${l.temperatura?' · '+esc(l.temperatura):''}</p>
    ${a.observacao ? `<div class="sinal">${esc(a.observacao)}</div>` : ''}
    ${D_ || a.status==='faltou' ? `<p style="margin-top:10px"><b>${a.status==='faltou'?'Faltou':D_.t==='matriculou'?'Matriculou':D_.t==='nao'?'Não fechou':'Em andamento'}</b>${D_&&D_.obs?' · '+esc(D_.obs):''}</p>` : `<div class="acts quatro" style="margin-top:14px">
      <button class="yes" onclick="fechar();abrirMenu('${a.id}','matriculou');SELDIA='${a.data}';modo('dia')">Matriculou</button><button class="nope" onclick="fechar();abrirMenu('${a.id}','nao');SELDIA='${a.data}';modo('dia')">Não matriculou</button>
      <button onclick="fechar();abrirMenu('${a.id}','andamento');SELDIA='${a.data}';modo('dia')">Em andamento</button><button onclick="fechar();registrar('${a.id}','faltou',{})">Faltou</button></div>`}
    <div class="acts mini" style="margin-top:10px"><button onclick="fechar();script('${a.id}')">ver conversa</button><button onclick="fechar();SELDIA='${a.data}';ABERTO={id:'${a.id}',tipo:'reagendar'};modo('dia')">reagendar</button><button onclick="fechar();cancelar('${a.id}')">cancelar aula</button></div>
    <div class="fim"><button class="btn g" onclick="fechar()">Fechar</button></div></div></div>`;
  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fechar(); };
}
function abrirMenuDialog(id, tipo){ const a = D.agendamentos.find(x => x.id === id); SELDIA = a.data; ABERTO = { id, tipo }; ESC = {}; modo('dia'); }
function fechar(){ document.getElementById('modal').innerHTML = ''; }
function desenhar(){
  const seg = segunda(SELDIA), dias = [0,1,2,3,4,5].map(n => addDias(seg, n));
  const mesK = SELDIA.slice(0,7);
  const base = D.agendamentos.filter(viva).filter(a => MODO === 'dia' ? a.data === SELDIA : MODO === 'mes' ? a.data.slice(0,7) === mesK : dias.includes(a.data));
  const periodo = MODO === 'dia' ? fmt(SELDIA, { weekday:'long', day:'numeric', month:'long' }) : MODO === 'mes' ? new Date(SELDIA+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}) : `${fmt(dias[0])} a ${fmt(dias[5])}`;
  const quentes = base.filter(a => (leadDe(a).temperatura||'').toLowerCase()==='quente').length;
  const matric = base.filter(a => /desfecho: matriculou/i.test(a.observacao||'')).length;
  const kits = KITS_T.length ? KITS_T : [{kit:'First',capacidade:8},{kit:'OneBot',capacidade:6},{kit:'TechBot',capacidade:5},{kit:'Autobot',capacidade:4},{kit:'App Developer',capacidade:4},{kit:'GameBot',capacidade:2}];
  let grade;
  if (MODO === 'dia') {
    const horas = [8,9,10,11,14,15,16,17];
    const vg = h => VAGAS ? VAGAS.filter(v => v.data === SELDIA && parseInt(v.hora_inicio) <= h && h < parseInt(v.hora_fim)) : [];
    grade = `<div class="tl">${horas.map(h => {
      const its = base.filter(a => parseInt(a.hora_inicio) === h).sort((a,b)=>String(a.hora_inicio).localeCompare(String(b.hora_inicio)));
      const v = vg(h)[0]; const liv = v ? v.vagas : null;
      return `<div class="h ${its.length?'tem':''}"><b>${String(h).padStart(2,'0')}:00</b><div class="vg ${liv==null?'n':liv<=0?'z':''}">${liv==null?'sem turma':liv<=0?'sem vaga':liv+' vaga'+(liv>1?'s':'')}</div>${v?`<div class="kf ${liv<=0?'cheio':liv<=2?'alerta':''}">FIRST ${liv} livre${liv===1?'':'s'}</div>`:''}</div>
        <div class="c ${its.length>1?'dois':''}" ondragover="event.preventDefault()" ondrop="dropDia(event,SELDIA,${h})">${its.length ? its.map(cartao).join('') : '<div class="livre">livre · <a href="#" onclick="irPara(\'/funil.html\');return false" style="color:var(--brand);font-weight:700;text-decoration:none">marcar aula</a></div>'}</div>`; }).join('')}</div>`;
  } else if (MODO === 'mes') {
    const x = new Date(SELDIA + 'T12:00:00'); const m = x.getMonth();
    const ini = segunda(new Date(x.getFullYear(), m, 1, 12).toISOString().slice(0,10)); const fim = new Date(x.getFullYear(), m+1, 0, 12).toISOString().slice(0,10);
    const ds = []; for (let d = ini; d <= addDias(fim, 6); d = addDias(d,1)) { if (new Date(d+'T12:00').getDay() !== 0) ds.push(d); if (d >= fim && new Date(d+'T12:00').getDay() === 6) break; }
    grade = `<div class="scrollx"><div class="mes">${['Seg','Ter','Qua','Qui','Sex','Sáb'].map(n=>`<div class="hd">${n}</div>`).join('')}${ds.map(d => { const its = D.agendamentos.filter(viva).filter(a => a.data === d); const fora = new Date(d+'T12:00').getMonth() !== m; const ok = its.filter(a => /desfecho: matriculou/i.test(a.observacao||'')).length, fal = its.filter(a => a.status==='faltou').length;
      return `<div class="dcell ${d===hoje?'hoje':''} ${fora?'fora':''}" onclick="SELDIA='${d}';modo('dia')" ondragover="event.preventDefault()" ondrop="dropDia(event,'${d}')"><div class="n">${new Date(d+'T12:00').getDate()}</div><div class="i">${its.length ? `<b>${its.length}</b> experimental${its.length>1?'is':''}${ok?`<br><span class="e">${ok} matriculou</span>`:''}${fal?`<br><span class="z">${fal} faltou</span>`:''}` : '<span style="color:var(--faint)">—</span>'}</div></div>`; }).join('')}</div></div>`;
  } else {
    grade = `<div class="scrollx"><div class="semana">${dias.map(d => { const its = base.filter(a => a.data === d).sort((a,b)=>String(a.hora_inicio).localeCompare(String(b.hora_inicio)));
      return `<div class="colw ${d===hoje?'hoje':''}" ondragover="event.preventDefault()" ondrop="dropDia(event,'${d}')"><h4>${DIAS[new Date(d+'T12:00').getDay()]} ${new Date(d+'T12:00').getDate()}</h4>${its.length ? its.map(ev).join('') : '<div class="nada">sem aulas</div>'}</div>`; }).join('')}</div></div>`;
  }
  document.getElementById('raiz').innerHTML = `
    <div class="barra"><button class="nav" onclick="mover(-1)">‹</button><button class="nav" onclick="mover(1)">›</button><button class="nav" onclick="irHoje()">Hoje</button><span class="periodo">${periodo}</span>${abasHtml()}</div>
    <div class="tally"><div><b>${base.length}</b><small>agendadas</small></div><div class="bad"><b>${quentes}</b><small>chega querendo fechar</small></div><div><b>${matric}</b><small>matriculadas</small></div><div class="hot"><b>${D.agendamentos.filter(pendente).length}</b><small>sem desfecho</small></div></div>
    ${SEMDATA.length ? `<div class="tally" style="display:block;background:#FDF8EC;border-color:#EAD7A5">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font-size:16px;margin:0">${SEMDATA.length} leads em “Aula agendada” sem data</b>
      <small style="font-weight:600">vieram do Kommo sem dia e hora — marque a aula de verdade ou dê a baixa</small>
      <button class="nav" style="margin-left:auto" onclick="MOSTRA_SD=!MOSTRA_SD;desenhar()">${MOSTRA_SD?'esconder':'ver lista'}</button></div>
      ${MOSTRA_SD ? `<div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px">${SEMDATA.map(l => `<div class="cardx" style="margin:0"><div class="top"><span class="kid">${esc(l.crianca||l.nome||'Sem nome')}</span>${l.temperatura?`<span class="rot ${ROT[(l.temperatura||'').toLowerCase()]?ROT[(l.temperatura||'').toLowerCase()][1]:'f'}">${esc(l.temperatura)}</span>`:''}</div>
        <div class="guard">${esc(l.nome||'')}${l.contato?' · '+esc(l.contato):''} · parado há ${Math.floor((Date.now()-new Date(l.etapa_em||l.criado_em))/864e5)} dias</div>
        <div class="acts mini" style="margin-top:8px"><button onclick="LeadPainel.abrir('${l.id}','agendar')">marcar aula</button><button onclick="LeadPainel.abrir('${l.id}','conversa')">conversa</button></div></div>`).join('')}</div>` : ''}
    </div>` : ''}
    <div class="corpo"><div>${grade}</div>
      <div class="lado"><h5>Kits disponíveis</h5>${kits.map(k=>`<div class="k"><span>${esc(k.kit)}</span><b>${k.capacidade}</b></div>`).join('')}<div class="k"><span>Lugares na sala</span><b>18</b></div>
        <div class="leg"><span><i style="background:var(--exp)"></i>Aula experimental usa o kit First</span><span><i style="background:var(--morno)"></i>laranja = restam 2 ou menos</span><span><i style="background:var(--quente)"></i>vermelho = sem vaga</span></div></div>
    </div>
    <div class="nota"><b>As etiquetas ao lado do horário mostram o estoque naquele momento.</b> Vale sempre o menor entre os kits First livres e os lugares na sala. Laranja = restam 2 ou menos; vermelho = lotou. Clique na aula pra registrar o desfecho — ou, com o mouse sobre o card, aperte <b>M</b> (matriculou), <b>N</b> (não), <b>A</b> (andamento) ou <b>F</b> (faltou).</div>`;
}
function abrir(id){
  const a = D.agendamentos.find(x => x.id === id); if (!a) return;
  if (a.data > hoje) return desfecho(id, 'faltou');
  const l = leadDe(a);
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela">
    <h3>${esc(a.crianca_nome||l.nome||'')}</h3><p>${new Date(a.data+'T12:00').toLocaleDateString('pt-BR')} ${hh(a.hora_inicio)}${l.nome?' · '+esc(l.nome):''}${l.contato?' · '+esc(l.contato):''}${a.observacao?'<br>'+esc(a.observacao):''}</p>
    <div class="chips" style="margin-top:14px">
      <button class="btn v" onclick="desfecho('${id}','matriculou')">Matriculou</button>
      <button class="btn a" onclick="desfecho('${id}','andamento')">Em andamento</button>
      <button class="btn x" onclick="desfecho('${id}','nao')">Não matriculou</button>
      <button class="btn g" onclick="desfecho('${id}','faltou')">Faltou</button>
      ${l.kommo_lead_id ? `<a class="btn g" style="text-decoration:none" href="https://roboticanorte.kommo.com/leads/detail/${l.kommo_lead_id}" target="_blank" rel="noopener">Kommo ↗</a>` : ''}
    </div>
    <div class="fim"><button class="btn g" onclick="fechar()">Fechar</button></div></div></div>`;
  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fechar(); };
}
let ABERTO = null;   // {id, tipo}
let VAGAS3 = null;   // vagas pro reagendar

function desfechoDe(a){ const m = /desfecho:\s*(matriculou|nao|andamento|faltou)(?:\s*·\s*(.*))?/i.exec(a.observacao||''); return m ? { t: m[1].toLowerCase(), obs: (m[2]||'').trim() } : null; }
const ROT = { quente: ['Quer fechar','q'], morno: ['Considerando','m'], frio: ['Só conhecendo','f'] };
function origemTag(l){
  const f = (l.fonte||'').toLowerCase(), pt = (l.porta||'').toLowerCase(), o = (l.origem||'').toLowerCase();
  if (f.includes('anúncio') || f.includes('anuncio') || o.includes('anuncio')) return ['Anúncio' + (pt||o ? (o.includes('insta')||f.includes('insta') ? ' Instagram' : '') : ''), 'o-ads'];
  if (f.includes('instagram') || o === 'instagram') return ['Instagram orgânico', 'o-org'];
  if (f.includes('evento') || pt === 'evento') return ['Evento', 'o-evt'];
  if (f.includes('google')) return ['Google', 'o-site'];
  if (pt === 'site' || o === 'site') return ['Site', 'o-site'];
  if (pt.includes('whatsapp') || o.includes('whatsapp')) return ['WhatsApp', 'o-wpp'];
  if (f.includes('indica')) return ['Indicação', 'o-evt'];
  return null;
}
function remarcacoes(a){ let n = 0, cur = a; const seen = new Set(); while (cur && cur.remarcado_de && !seen.has(cur.id)) { seen.add(cur.id); n++; cur = D.agendamentos.find(x => x.id === cur.remarcado_de); } return n; }
function cartao(a){
  const l = leadDe(a), t = turmaDe(a); const D_ = desfechoDe(a); const temp = (l.temperatura||'').toLowerCase();
  const rot = ROT[temp] ? `<span class="rot ${ROT[temp][1]}">${ROT[temp][0]}</span>` : '';
  const org = origemTag(l); const rea = remarcacoes(a);
  const sinal = (!D_ && a.observacao) ? a.observacao : (l.notas || '');
  let est = '', pe = '';
  if (a.status === 'faltou' || (D_ && D_.t === 'faltou')) {
    est = ' gone';
    const menu = ABERTO && ABERTO.id === a.id && ABERTO.tipo === 'reagendar' ? menuReagendar(a) : '';
    pe = `<div class="done neutral"><span><b>Faltou.</b> Continua em Aula agendada no Kommo, com a tag <i>reagendar devido falta</i></span>
      <span><button class="undo alt" onclick="abrirMenu('${a.id}','reagendar')">opções</button> <button class="undo" onclick="desfazer('${a.id}')">desfazer</button></span></div>${menu}`;
  } else if (D_) {
    est = D_.t === 'matriculou' ? ' win' : D_.t === 'nao' ? ' lost' : ' hold';
    const txt = D_.t === 'matriculou' ? `<b>Matriculou${D_.obs?' · '+esc(D_.obs.split(' · ')[0]):''}.</b> Baixa no Kommo como ganho: vai para Aluno ativo com a tag <i>pagamento: ${esc((D_.obs.split(' · ')[0]||'').toLowerCase())}</i>`
      : D_.t === 'nao' ? `<b>Não fechou${D_.obs?' · '+esc(D_.obs):''}.</b> Vai para Remarketing no Kommo com a tag <i>motivo: ${esc(D_.obs.toLowerCase())}</i>`
      : `<b>Em andamento.</b> Continua na coluna de Aula agendada, com a tag <i>em andamento</i>. A observação abaixo vai como nota no Kommo. <i>“${esc(D_.obs||'sem observação')}”</i>`;
    pe = `<div class="done ${D_.t==='matriculou'?'win':D_.t==='nao'?'lost':'hold'}"><span>${txt}</span>${D_.t==='matriculou'?'':`<button class="undo" onclick="desfazer('${a.id}')">desfazer</button>`}</div>`;
  } else {
    const menu = ABERTO && ABERTO.id === a.id ? menuDesfecho(a) : '';
    // as quatro opções sempre visíveis, como no protótipo (a recepção dá baixa no dia; aula futura também pode ser remarcada/cancelada)
    pe = `<div class="acts quatro">
        <button class="yes" onclick="abrirMenu('${a.id}','matriculou')">Matriculou</button>
        <button class="nope" onclick="abrirMenu('${a.id}','nao')">Não matriculou</button>
        <button onclick="abrirMenu('${a.id}','andamento')">Em andamento</button>
        <button onclick="registrar('${a.id}','faltou',{})">Faltou</button></div>
      <div class="acts mini"><button onclick="abrirMenu('${a.id}','reagendar')">reagendar</button><button onclick="cancelar('${a.id}')">cancelar aula</button></div>${menu}`;
  }
  return `<div class="cardx${est}" data-id="${a.id}" draggable="true" ondragstart="dragAula(event,'${a.id}')">
    <button class="scriptbtn" onclick="script('${a.id}')" title="Ver a conversa">script</button>
    <div class="top"><span class="kid">${esc(a.crianca_nome || l.nome || 'Criança')}${a.crianca_idade?`<em>${a.crianca_idade} anos</em>`:''}</span>${rot}</div>
    <div class="guard">com ${esc(l.nome||'responsável')}${l.contato?` · <a href="https://wa.me/${String(l.contato).replace(/\D/g,'')}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--brand);font-weight:700;text-decoration:none">${esc(l.contato)}</a>`:''}${l.atendente?' · '+esc(l.atendente):''}</div>
    <div class="top" style="margin-top:8px">${org?`<span class="org ${org[1]}">${esc(org[0])}</span>`:''}${rea?`<span class="rea">remarcou ${rea}×</span>`:''}${a.status==='confirmado'?'<span class="rea" style="background:var(--verde-bg);color:var(--verde)">confirmou ✓</span>':''}${/pediu para remarcar/i.test(a.observacao||'')?'<span class="rea" style="background:rgba(224,49,39,.1);color:var(--quente)">pediu remarcar</span>':''}</div>
    ${sinal ? `<div class="sinal">${esc(sinal)}</div>` : ''}
    ${pe}</div>`;
}
function menuDesfecho(a){
  const tp = ABERTO.tipo;
  if (tp === 'reagendar') return menuReagendar(a);
  if (tp === 'andamento') return `<div class="menu"><p>Situação da família</p><textarea id="m-obs" placeholder="Ex.: precisa esperar a fatura do cartão virar, falar com o marido"></textarea>
    <div class="acts save"><button class="yes" onclick="registrar('${a.id}','andamento',{observacao:document.getElementById('m-obs').value,situacao:document.getElementById('m-obs').value})">Salvar</button><button onclick="fecharMenu()">cancelar</button></div></div>`;
  if (tp === 'nao') return `<div class="menu"><p>Motivo</p><div class="chips">${MOTIVOS.map(v=>`<button class="chip" onclick="registrar('${a.id}','nao',{motivo:'${v}'})">${v}</button>`).join('')}</div></div>`;
  if (tp === 'matriculou') return `<div class="menu"><p>Forma de pagamento</p><div class="chips">${PAGTOS.map(v=>`<button class="chip ${ESC.pagamento===v?'on':''}" onclick="ESC.pagamento='${v}';desenhar()">${v}</button>`).join('')}</div>
    <div class="l2 linha2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><p>Valor (R$)</p><input id="m-valor" type="number" min="0" step="10" placeholder="397" value="${ESC.valor||''}"></div><div><p>Kit</p><select id="m-curso">${KITS.map(k=>`<option ${k===(ESC.curso||'First')?'selected':''}>${k}</option>`).join('')}</select></div></div>
    <div class="l2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><p>Turma do aluno</p><select id="m-turma">${D.turmas.map(t=>`<option value="${t.id}" ${t.id===a.turma_id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div><div><p>Nome completo</p><input id="m-aluno" value="${esc(a.crianca_nome||'')}"></div></div>
    <div class="acts save"><button class="yes" onclick="confirmarMatricula('${a.id}')">Confirmar matrícula</button><button onclick="fecharMenu()">cancelar</button></div></div>`;
  return '';
}
function menuReagendar(a){
  if (!VAGAS3) { carregarVagas(); return `<div class="menu"><p>Reagendar</p><div class="aviso-p">Buscando vagas…</div></div>`; }
  const hs = VAGAS3.filter(h => (h.vagas ?? 1) > 0 && h.data > hoje).sort((x,y)=>(x.data+x.hora_inicio).localeCompare(y.data+y.hora_inicio));
  const pick = f => hs.find(h => { const w = new Date(h.data+'T12:00').getDay(), hi = parseInt(h.hora_inicio); return f==='sab'?w===6:f==='manha'?(w!==6&&hi<12):(w!==6&&hi>=12); });
  const vg = (rot, v) => `<div class="vg"><small>${rot}</small>${v?`<b>${DIAS[new Date(v.data+'T12:00').getDay()].slice(0,3)} ${new Date(v.data+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} · ${hh(v.hora_inicio)}</b><small>${v.vagas} First livres</small><button class="btn" onclick="reagendar('${a.id}','${v.turma_id}','${v.data}')">Reagendar</button>`:'<b>—</b><small>sem vaga em 30 dias</small>'}</div>`;
  return `<div class="menu"><p>Reagendar ${esc(a.crianca_nome||'')} — ofereça duas opções</p><div class="vagas3">${vg('Manhã',pick('manha'))}${vg('Tarde',pick('tarde'))}${vg('Sábado',pick('sab'))}</div><div class="acts save"><button onclick="fecharMenu()">cancelar</button></div></div>`;
}
async function carregarVagas(){ try { VAGAS3 = (await api('agenda', { dias: 30 })).horarios || []; } catch(e){ VAGAS3 = []; } desenhar(); }
function abrirMenu(id, tipo){ ABERTO = { id, tipo }; ESC = {}; desenhar(); }
function fecharMenu(){ ABERTO = null; desenhar(); }
async function registrar(id, tipo, extra){
  try { await api('desfecho', { atendente: (window.CaptaUser&&CaptaUser.nome())||undefined, agendamento_id: id, desfecho: tipo, observacao: `desfecho: ${tipo}${extra.motivo?' · '+extra.motivo:''}${extra.observacao?' · '+extra.observacao:''}`, ...extra }); ABERTO = null; await carregar();
    const nome = (D.agendamentos.find(x=>x.id===id)||{}).crianca_nome || 'Aula';
    toast(`<b>${esc(nome)}</b> · ${({matriculou:'matriculou',nao:'não fechou',andamento:'em andamento',faltou:'faltou'})[tipo]} · Kommo atualizado`, tipo==='matriculou'?{tipo:'ok'}:{ acao:'desfazer', onAcao:() => desfazer(id) }); }
  catch(e){ toast(e.message,{tipo:'erro'}); }
}
async function confirmarMatricula(id){
  const g = x => document.getElementById(x).value;
  if (!ESC.pagamento) return toast('Escolha a forma de pagamento.',{tipo:'erro'});
  try { await api('desfecho', { agendamento_id: id, desfecho: 'matriculou', valor: g('m-valor'), curso: g('m-curso'), pagamento: ESC.pagamento, turma_id: g('m-turma'), aluno_nome: g('m-aluno'), observacao: `desfecho: matriculou · ${ESC.pagamento}${g('m-valor')?' · R$ '+g('m-valor'):''}` }); ABERTO = null; await carregar(); }
  catch(e){ toast(e.message,{tipo:'erro'}); }
}
async function cancelar(id){ if (!confirm('Cancelar esta aula?')) return; try { await api('presenca', { agendamento_id: id, status: 'cancelado', motivo: 'cancelado pela recepção' }); toast('Aula cancelada · lead voltou de etapa · Kommo atualizado'); await carregar(); } catch(e){ toast(e.message,{tipo:'erro'}); } }
async function reagendar(id, turmaId, data){ try { await api('remarcar', { agendamento_id: id, turma_id: turmaId, data, motivo: 'reagendado pela recepção' }); ABERTO = null; VAGAS3 = null; toast('Aula remarcada · Kommo atualizado', { tipo:'ok' }); await carregar(); } catch(e){ toast(e.message,{tipo:'erro'}); } }
async function desfazer(id){ try { await api('desfazer', { agendamento_id: id }); toast('Desfeito · aula voltou a agendada'); await carregar(); } catch(e){ toast(e.message,{tipo:'erro'}); } }

// conversa do lead: gaveta compartilhada
LeadPainel.init({ slug: SLUG, token: TOKEN, getLead: id => D.leads.find(x => x.id === id) || SEMDATA.find(x => x.id === id), getEtapas: () => [], onAgendou: () => carregar() });
function script(id){ const a = D.agendamentos.find(x => x.id === id); if (a && a.lead_id) LeadPainel.abrir(a.lead_id, 'conversa'); }

let ESC = {};
let HOVER = null;
document.addEventListener('mouseover', e => { const c = e.target.closest && e.target.closest('.cardx'); if (c) HOVER = c.dataset.id || HOVER; });
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes((e.target.tagName||''))) return;
  const k = e.key.toLowerCase(); const a = D.agendamentos.find(x => x.id === HOVER); if (!a || desfechoDe(a) || a.status === 'faltou') return;
  if (k === 'm') abrirMenu(a.id, 'matriculou'); else if (k === 'n') abrirMenu(a.id, 'nao'); else if (k === 'a') abrirMenu(a.id, 'andamento'); else if (k === 'f') registrar(a.id, 'faltou', {}); else return;
  e.preventDefault();
});
if (!SLUG || !TOKEN) document.getElementById('raiz').textContent = 'Abra esta página pelo painel do seu negócio.'; else carregar();
</script>
</body>
