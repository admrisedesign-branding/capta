<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capta · Admin RISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2E5BFF; --brand-deep:#1E44D6; --brand-2:#5B8DEF;
  --brand-soft:rgba(46,91,255,.10); --brand-softer:rgba(46,91,255,.06);
  --bg:#F4F6FB; --card:#FFFFFF; --line:#E9ECF3; --line-2:#F1F3F8;
  --tx:#141A2E; --ink:#141A2E; --dm:#697089; --dr:#9AA1B4; --or:#2E5BFF;
  --quente:#E03127; --quente-bg:rgba(224,49,39,.12);
  --morno:#C47A08;  --morno-bg:rgba(224,147,15,.14);
  --frio:#3E6FD6;   --frio-bg:rgba(91,141,239,.15);
  --verde:#16A34A;  --verde-bg:rgba(22,163,74,.12);
  --roxo:#8B4BFF;   --roxo-bg:rgba(139,75,255,.12);
  --gray-bg:rgba(105,112,137,.12);
  --surface2:#F1F3F8;
  --r:16px; --shadow:0 1px 2px rgba(20,26,46,.04),0 6px 20px rgba(20,26,46,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
h2{font-size:16px;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
input,select,textarea{font-family:inherit}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 30px;width:100%;max-width:400px}
.login-brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.login-brand .brand-c{width:32px;height:32px;border-radius:9px}
.login-tag{background:var(--brand-soft);color:var(--brand);font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px}
.login-card h1{font-size:20px;font-weight:800;margin:16px 0 3px}
.login-card>p{font-size:13.5px;color:var(--dm);margin-bottom:18px}

/* ---------- Layout ---------- */
.layout{display:flex;min-height:100%}
.side{width:238px;flex:0 0 238px;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 60px;max-width:1240px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand-c{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 12px var(--brand-soft);flex:0 0 auto}
.brand-badge{background:var(--brand-soft);color:var(--brand);font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:99px;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-lbl{font-size:11px;font-weight:700;color:var(--dr);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--dm);font-size:14px;font-weight:600;padding:10px 11px;border-radius:11px;text-align:left;transition:.14s}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor}
.nav-item:hover{background:var(--line-2);color:var(--tx)}
.nav-item.on{background:var(--brand-soft);color:var(--brand)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.who{display:flex;flex-direction:column;gap:6px;padding:4px 8px}
.who b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dm)}
.logout{align-self:flex-start;border:1px solid var(--line);background:var(--card);color:var(--dm);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:9px}
.logout:hover{border-color:var(--quente);color:var(--quente)}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{display:none;border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:10px;font-size:17px;color:var(--tx)}
.crumb{font-size:17px;font-weight:700;letter-spacing:-.01em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.acct{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}

.reveal{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Stat / metric cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .s-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;background:var(--brand-soft);color:var(--brand)}
.stat .s-ico svg{width:19px;height:19px;stroke:currentColor}
.stat .s-ico.g{background:var(--verde-bg);color:var(--verde)}.stat .s-ico.q{background:var(--quente-bg);color:var(--quente)}
.stat .lbl{font-size:12.5px;color:var(--dm);font-weight:600}
.stat .num{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--dr)}

.rev-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:22px}
.rev-card h3{font-size:14px;font-weight:700;margin-bottom:12px}
.rev-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13.5px;border-top:1px solid var(--line-2);color:var(--dm)}
.rev-row .v{font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.rev-total{display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:4px;border-top:2px solid var(--line);font-weight:700}
.rev-total .total{font-size:18px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}

/* ---------- Client cards ---------- */
.client-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.client-top{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.client-av{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;flex:0 0 auto}
.client-info{min-width:0;flex:1}
.client-info h3{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-info .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--dr);margin-top:4px}
.plan-badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:99px}
.plan-free{background:var(--gray-bg);color:var(--dm)}
.plan-pro{background:var(--brand-soft);color:var(--brand)}
.plan-business{background:var(--roxo-bg);color:var(--roxo)}
.plan-gestao{background:var(--verde-bg);color:var(--verde)}
.ativo-dot{width:8px;height:8px;border-radius:50%;background:var(--verde);display:inline-block;margin-right:3px}
.ativo-dot.off{background:var(--dr)}
.new-badge{background:var(--verde);color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.meta2{font-size:12px;color:var(--muted);margin-top:4px}
.signup-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:11px 0;border-top:1px solid var(--line)}
.signup-row:first-of-type{border-top:0}
.signup-main{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;flex:1;min-width:170px}
.signup-sub{font-size:12px;color:var(--muted);flex-basis:100%;order:3}
.signup-act{display:flex;gap:6px}
.client-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{border:0;font-family:inherit;font-weight:700;border-radius:11px;transition:.14s;font-size:14px;padding:11px 18px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-full{width:100%}
.btn-sm{font-size:12.5px;padding:8px 14px;border-radius:9px}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--dm)}
.btn-ghost:hover{border-color:var(--brand-2);color:var(--tx)}
.btn-danger{background:var(--quente-bg);color:var(--quente)}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--dm);padding:7px 14px;border-radius:99px;transition:.14s}
.chip:hover{border-color:var(--brand-2);color:var(--tx)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- Leads (table + cards) ---------- */
.ltable-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ltable{width:100%;border-collapse:collapse;font-size:13.5px}
.ltable th{text-align:left;font-size:11.5px;font-weight:700;color:var(--dr);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;background:var(--line-2);border-bottom:1px solid var(--line)}
.ltable td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ltable tbody tr{cursor:pointer;transition:.12s}
.ltable tbody tr:hover{background:var(--brand-softer)}
.ltable tbody tr:last-child td{border-bottom:0}
.cell-lead{display:flex;align-items:center;gap:10px}
.cell-lead .nm{font-weight:600}.cell-lead .sub{font-size:12px;color:var(--dr)}
.cli-tag{color:var(--brand);font-weight:700}
.av{width:38px;height:38px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
.av.sm{width:34px;height:34px;border-radius:9px;font-size:12px}
.score-cell{font-weight:700;font-variant-numeric:tabular-nums}
.tbadge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.tbadge.q{background:var(--quente-bg);color:var(--quente)}.tbadge.m{background:var(--morno-bg);color:var(--morno)}.tbadge.f{background:var(--frio-bg);color:var(--frio)}
.status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:capitalize;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.novo{background:var(--brand-soft);color:var(--brand)}
.status.contatado{background:var(--morno-bg);color:var(--morno)}
.status.fechado{background:var(--verde-bg);color:var(--verde)}
.status.perdido{background:var(--gray-bg);color:var(--dm)}

.lcards{display:none;flex-direction:column;gap:10px}
.lead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.lead .mid{flex:1;min-width:0}
.lead .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .meta-l{font-size:12px;color:var(--dr);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lead .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.temp{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.temp.q{background:var(--quente-bg);color:var(--quente)}.temp.m{background:var(--morno-bg);color:var(--morno)}.temp.f{background:var(--frio-bg);color:var(--frio)}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--dr);font-size:13.5px;line-height:1.7}

/* ---------- Forms / fields ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--dm);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:14px;padding:11px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.err{color:var(--quente);font-size:12.5px;min-height:16px;margin-bottom:6px}
.note{font-size:12.5px;color:var(--dm);line-height:1.6}
.link-box{display:flex;gap:8px;margin-bottom:8px}
.link-box input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;color:var(--tx)}
.link-box button{border:0;background:var(--brand);color:#fff;font-weight:700;padding:0 16px;border-radius:10px;font-size:13px}
.toggle{position:relative;display:inline-block;width:42px;height:24px}
.toggle input{display:none}
.toggle-slider{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.toggle-slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-slider{background:var(--brand)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}

/* ---------- Drawer ---------- */
.scrim,.scrim2{position:fixed;inset:0;background:rgba(20,26,46,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on,.scrim2.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:50;background:var(--card);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -10px 40px rgba(20,26,46,.2);right:0;top:0;height:100%;width:440px;max-width:92vw;transform:translateX(100%);padding:26px 24px;overflow-y:auto}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer-head h2{font-size:19px;font-weight:800}
.drawer-close{border:0;background:var(--line-2);width:32px;height:32px;border-radius:9px;font-size:15px;color:var(--dm)}
.scorebar{background:var(--brand-softer);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.scorebar b{font-size:13px;color:var(--dm)}
.qa-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-top:1px solid var(--line-2)}
.qa-row .qa-a{font-weight:800;color:var(--verde)}
.stbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
.stbtns button{border:1.5px solid var(--line);background:var(--card);color:var(--dm);font-weight:600;font-size:12px;padding:9px 4px;border-radius:10px;text-transform:capitalize;transition:.12s}
.stbtns button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.zap-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;font-weight:700;font-size:14.5px;padding:13px;border-radius:12px;text-decoration:none}
.q-item{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.q-item-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.q-num{width:22px;height:22px;border-radius:7px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.q-txt{flex:1;font-size:13.5px;font-weight:700}
.opt-item{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dm);padding:4px 0;border-top:1px solid var(--line-2)}
.opt-pts{font-weight:800;color:var(--verde)}

@media(max-width:860px){
  .side{position:fixed;z-index:45;left:0;top:0;height:100%;transform:translateX(-100%);box-shadow:0 0 40px rgba(20,26,46,.18)}
  .side.open{transform:none}
  .burger{display:grid;place-items:center}
  .topbar{padding:0 16px}
  .content{padding:16px 16px 70px}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .ltable-wrap{display:none}
  .lcards{display:flex}
  .drawer{left:0;right:0;top:auto;bottom:0;width:100%;max-width:100%;height:auto;max-height:90vh;border-radius:22px 22px 0 0;transform:translateY(100%);padding:22px 18px 30px}
  .drawer.on{transform:none}
  .client-actions .btn{flex:1}
}
@media(max-width:400px){ .stats{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap" class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="brand-c">C</span>capta <span class="login-tag">ADMIN</span></div>
    <h1>Entrar no painel</h1>
    <p>Acesso exclusivo da equipe RISE</p>
    <div class="field"><label>E-mail</label><input type="email" id="l-email" placeholder="seu@email.com" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input type="password" id="l-senha" placeholder="••••••••"></div>
    <div class="err" id="l-err"></div>
    <button class="btn btn-primary btn-full" id="l-btn" style="margin-top:8px">Entrar →</button>
  </div>
</div>

<!-- APP -->
<div id="admin-app" style="display:none">
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand"><span class="brand-c">C</span>capta<span class="brand-badge">ADMIN</span></div>
      <nav class="nav">
        <span class="nav-lbl">RISE</span>
        <button class="nav-item on" data-t="painel"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</button>
        <button class="nav-item" data-t="clientes"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Clientes</button>
        <button class="nav-item" data-t="leads"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2s5 4 5 9a5 5 0 0 1-10 0c0-1.5.6-2.8 1.4-3.8C8 9 9 10 9 11c0-2 1-4 3-9z"/></svg>Leads</button>
      </nav>
      <div class="side-foot"><div class="who"><b id="adm-email">—</b><button class="logout" onclick="logout()">Sair</button></div></div>
    </aside>
    <div class="scrim2" id="side-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="burger" id="burger">☰</button>
        <div class="crumb" id="page-title">Painel</div>
        <div class="top-right"><div class="acct" id="acct">RS</div></div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><div id="drawer-body"></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SB_URL  = 'https://wpoeigoledhzyvomudgf.supabase.co';
const SB_KEY  = 'sb_publishable_S4eWNjOtaiXTo5sr9Hek0A_42NzE4jf';
const BASE    = 'https://capta.riseagencia.com';
const PLANOS  = { free:0, pro:97, business:197, gestao:397 };
const sb = createClient(SB_URL, SB_KEY);

// ---- STATE ----
let S = { tenants:[], leads:[], tab:'painel', lf:{ tenant:'all', temp:'all' } };
let CONFIG = { maya:false };
let AF = { tenant:null, data:null, editFormId:null, editPerguntas:[] };
const TITLES = { painel:'Painel', clientes:'Clientes', leads:'Leads' };

// ---- UTILS ----
const COLORS = ['#2E5BFF','#16A34A','#E0930F','#8B4BFF','#E03127','#5B8DEF'];
const ini  = n => (n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const col  = n => COLORS[(n||'A').charCodeAt(0)%COLORS.length];
const tcss = t => t==='Quente'?'q':t==='Morno'?'m':'f';
const ago  = iso => { const s=Math.floor((Date.now()-new Date(iso))/1000); if(s<60)return 'agora'; if(s<3600)return `há ${Math.floor(s/60)}m`; if(s<86400)return `há ${Math.floor(s/3600)}h`; return `há ${Math.floor(s/86400)}d`; };
const esc  = s => (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num  = n => (n||0).toLocaleString('pt-BR');
const IC = {
  users:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2s5 4 5 9a5 5 0 0 1-10 0c0-1.5.6-2.8 1.4-3.8C8 9 9 10 9 11c0-2 1-4 3-9z"/></svg>',

// ---- AUTH ----
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) onLogin(session.user);
}
document.getElementById('l-btn').onclick = async () => {
  const email = document.getElementById('l-email').value.trim();
  const senha = document.getElementById('l-senha').value;
  const btn   = document.getElementById('l-btn');
  btn.textContent='Entrando…'; btn.disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error){ document.getElementById('l-err').textContent='E-mail ou senha incorretos.'; btn.textContent='Entrar →'; btn.disabled=false; }
  else { const { data:{ session } } = await sb.auth.getSession(); onLogin(session.user); }
};
document.getElementById('l-senha').onkeydown = e => { if(e.key==='Enter') document.getElementById('l-btn').click(); };

function onLogin(user){
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('admin-app').style.display='block';
  document.getElementById('adm-email').textContent = user.email;
  document.getElementById('acct').textContent = ini(user.email.split('@')[0].replace('.',' '));
  loadAll();
}
window.logout = async () => { await sb.auth.signOut(); location.reload(); };

// ---- DATA ----
async function loadAll(){ try{ const rc=await fetch('/api/capta-config'); if(rc.ok) CONFIG=await rc.json(); }catch(e){} await Promise.all([loadTenants(),loadLeads()]); render(); }
async function loadTenants(){
  const { data } = await sb.from('capta_tenants').select('*').order('criado_em',{ascending:false});
  S.tenants = data||[];
}
async function loadLeads(){
  const { data } = await sb.from('capta_leads').select('*,capta_tenants(nome,slug)').order('criado_em',{ascending:false});

// Cadastros recentes (últimos 7 dias) — visibilidade dos novos self-service + trava anti-spam
function recentSignupsCard(){
  const lim = Date.now() - 7*864e5;
  const novos = S.tenants.filter(t => new Date(t.criado_em).getTime() >= lim);
  if(!novos.length) return '';
  return `<div class="rev-card">
    <h3>Cadastros recentes · últimos 7 dias (${novos.length})</h3>
    ${novos.slice(0,15).map(t=>`<div class="signup-row">
      <div class="signup-main">${esc(t.nome)} <span class="plan-badge plan-${t.plano}">${t.plano}</span>${(Date.now()-new Date(t.criado_em)<2*864e5)?'<span class="new-badge">novo</span>':''}${t.ativo?'':' <span style="color:var(--dr);font-size:12px">(inativo)</span>'}</div>
      <div class="signup-act">
        <button class="btn btn-ghost btn-sm" onclick="filtrarLeads('${t.id}')">Ver</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleAtivo('${t.id}',${t.ativo?'false':'true'})">${t.ativo?'🚫 Desativar':'✅ Reativar'}</button>
      </div>
      <div class="signup-sub">${t.owner_email?esc(t.owner_email):'sem e-mail'} · cadastro ${ago(t.criado_em)}</div>
    </div>`).join('')}
  </div>`;
}
window.toggleAtivo = async (id, novo) => {
  const ativo = (novo===true || novo==='true');
  if(!ativo && !confirm('Desativar este cadastro? Ele deixa de contar como cliente ativo. Você pode reativar depois.')) return;
  try{
    const { error } = await sb.from('capta_tenants').update({ ativo }).eq('id', id);
    if(error){ alert('Não foi possível atualizar: '+error.message); return; }
    const t = S.tenants.find(x=>x.id===id); if(t) t.ativo = ativo;
    render();
  }catch(e){ alert('Erro ao atualizar o cadastro.'); }
};

// ---- PAINEL ----
function rPainel(){
  const now=new Date(), mes=now.getMonth(), ano=now.getFullYear();
  const ativos=S.tenants.filter(t=>t.ativo);
  const lhoje=S.leads.filter(l=>new Date(l.criado_em).toDateString()===now.toDateString());
  const lmes=S.leads.filter(l=>{const d=new Date(l.criado_em);return d.getMonth()===mes&&d.getFullYear()===ano;});
  const qhoje=lhoje.filter(l=>l.temperatura==='Quente');
  const byP={free:0,pro:0,business:0,gestao:0};
  ativos.forEach(t=>{if(byP[t.plano]!==undefined)byP[t.plano]++;});
  const receita=byP.pro*97+byP.business*197+byP.gestao*397;

  document.getElementById('view').innerHTML=`<div class="reveal">
    <div class="stats">
      <div class="stat"><div class="s-ico">${IC.users}</div><div class="lbl">Clientes ativos</div><div class="num">${ativos.length}</div><div class="sub">${S.tenants.length} no total</div></div>
      <div class="stat"><div class="s-ico g">${IC.money}</div><div class="lbl">Receita mensal</div><div class="num">R$${num(receita)}</div><div class="sub">recorrente</div></div>
      <div class="stat"><div class="s-ico">${IC.bolt}</div><div class="lbl">Leads do mês</div><div class="num">${lmes.length}</div><div class="sub">${lhoje.length} hoje</div></div>
      <div class="stat"><div class="s-ico q">${IC.flame}</div><div class="lbl">Quentes hoje</div><div class="num">${qhoje.length}</div><div class="sub">pra converter</div></div>
    </div>
    <div class="rev-card">
      <h3>Receita por plano</h3>
      <div class="rev-row"><span>Free · ${byP.free} cliente${byP.free!==1?'s':''} × R$0</span><span class="v">R$0</span></div>
      <div class="rev-row"><span>Pro · ${byP.pro} cliente${byP.pro!==1?'s':''} × R$97</span><span class="v">R$${num(byP.pro*97)}</span></div>
      <div class="rev-row"><span>Business · ${byP.business} cliente${byP.business!==1?'s':''} × R$197</span><span class="v">R$${num(byP.business*197)}</span></div>
      <div class="rev-row"><span>Gestão · ${byP.gestao} cliente${byP.gestao!==1?'s':''} × R$397</span><span class="v">R$${num(byP.gestao*397)}</span></div>
      <div class="rev-total"><span>Total mensal</span><span class="total">R$${num(receita)}</span></div>
    </div>
    ${recentSignupsCard()}
    <div class="sec-h"><h2>Últimos leads</h2></div>
    ${leadsList(S.leads.slice(0,6),true)}
  </div>`;
  bindLeads();
}

// ---- CLIENTES ----
function rClientes(){
  document.getElementById('view').innerHTML=`<div class="reveal">
    <div class="sec-h"><h2>Clientes (${S.tenants.length})</h2>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoCliente()">+ Novo cliente</button>

  </div>`;
}
function clientCard(t){
  const lt=S.leads.filter(l=>l.tenant_id===t.id);

  const lm=lt.filter(l=>{const d=new Date(l.criado_em);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const novo=(Date.now()-new Date(t.criado_em))<7*864e5;
  return `<div class="client-card">
    <div class="client-top">
      <div class="client-av">${ini(t.nome)}</div>
      <div class="client-info">
        <h3>${esc(t.nome)}</h3>
        <div class="meta">
          <span class="plan-badge plan-${t.plano}">${t.plano}</span>
          ${novo?'<span class="new-badge">novo</span>':''}
          <span>/${esc(t.slug)}</span>
          <span><span class="ativo-dot ${t.ativo?'':'off'}"></span>${t.ativo?'ativo':'inativo'}</span>
          <span>· ${lm.length} leads/mês · ${lt.length} total</span>

        <div class="meta2">${t.owner_email?esc(t.owner_email)+' · ':''}cadastro ${ago(t.criado_em)}</div>

    </div>

      <button class="btn btn-ghost btn-sm" onclick="abrirLinks('${t.id}')">🔗 Links</button>

      <button class="btn btn-ghost btn-sm" onclick="filtrarLeads('${t.id}')">👁 Leads (${lt.length})</button>
      <button class="btn btn-ghost btn-sm" onclick="abrirEditar('${t.id}')">✏ Editar</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleAtivo('${t.id}',${t.ativo?'false':'true'})">${t.ativo?'🚫 Desativar':'✅ Reativar'}</button>

// ---- LEADS ----
function rLeads(){
  const {tenant:ft,temp:ftemp}=S.lf;
  let ls=S.leads;
  if(ft!=='all') ls=ls.filter(l=>l.tenant_id===ft);
  if(ftemp!=='all') ls=ls.filter(l=>tcss(l.temperatura)===ftemp);
  const cq=S.leads.filter(l=>l.temperatura==='Quente').length;
  const cm=S.leads.filter(l=>l.temperatura==='Morno').length;
  const cf=S.leads.filter(l=>l.temperatura==='Frio').length;

  document.getElementById('view').innerHTML=`<div class="reveal">
    <div class="field" style="max-width:340px;margin-bottom:12px">
      <select id="f-tenant" onchange="S.lf.tenant=this.value;rLeads()">
        <option value="all">Todos os clientes</option>
        ${S.tenants.map(t=>`<option value="${t.id}" ${ft===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}
      </select>
    </div>
    <div class="chips">
      <button class="chip ${ftemp==='all'?'on':''}" onclick="S.lf.temp='all';rLeads()">Todos ${S.leads.length}</button>
      <button class="chip ${ftemp==='q'?'on':''}" onclick="S.lf.temp='q';rLeads()">🔥 Quentes ${cq}</button>
      <button class="chip ${ftemp==='m'?'on':''}" onclick="S.lf.temp='m';rLeads()">🌡 Mornos ${cm}</button>
      <button class="chip ${ftemp==='f'?'on':''}" onclick="S.lf.temp='f';rLeads()">❄️ Frios ${cf}</button>
    </div>
    ${ls.length?leadsList(ls,true):'<div class="empty">Nenhum lead nesse filtro.</div>'}
  </div>`;
  bindLeads();
}
window.rLeads = rLeads;

function leadsList(leads, showClient){
  const rows = leads.map(l=>leadRow(l,showClient)).join('');
  const cards = leads.map(l=>leadCard(l,showClient)).join('');
  return `<div class="ltable-wrap"><table class="ltable">
    <thead><tr><th>Lead</th>${showClient?'<th>Cliente</th>':''}<th>Contato</th><th>Quando</th><th>Temperatura</th><th>Score</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="lcards">${cards}</div>`;
}
function leadRow(l,showClient){
  const cn=l.capta_tenants?.nome||S.tenants.find(t=>t.id===l.tenant_id)?.nome||'';
  return `<tr data-id="${l.id}">
    <td><div class="cell-lead"><span class="av sm" style="background:${col(l.nome)}">${ini(l.nome)}</span><div><div class="nm">${esc(l.nome)}</div><div class="sub">${l.origem?esc(l.origem):''}</div></div></div></td>
    ${showClient?`<td><span class="cli-tag">${esc(cn)}</span></td>`:''}
    <td>${esc(l.contato||'—')}</td>
    <td>${ago(l.criado_em)}</td>
    <td><span class="tbadge ${tcss(l.temperatura)}">${esc(l.temperatura||'—')}</span></td>
    <td class="score-cell">${l.score??'–'}</td>
    <td><span class="status ${l.status||'novo'}">${l.status||'novo'}</span></td>
  </tr>`;
}
function leadCard(l, showClient){
  const cn=l.capta_tenants?.nome||S.tenants.find(t=>t.id===l.tenant_id)?.nome||'';
  return `<div class="lead" data-id="${l.id}">
    <div class="av" style="background:${col(l.nome)}">${ini(l.nome)}</div>
    <div class="mid">
      <div class="nm">${esc(l.nome)}</div>
      <div class="meta-l">${showClient&&cn?`<span class="cli-tag">${esc(cn)}</span>`:''}<span>${esc(l.contato||'')}</span><span>${ago(l.criado_em)}</span>${l.status&&l.status!=='novo'?`<span>${esc(l.status)}</span>`:''}</div>
    </div>
    <div class="right"><span class="temp ${tcss(l.temperatura)}">${esc(l.temperatura||'—')}</span><span style="font-size:12px;color:var(--dr);font-weight:700">${l.score??'–'}/100</span></div>
  </div>`;
}
function bindLeads(){ document.querySelectorAll('.lead[data-id],tr[data-id]').forEach(el=>el.onclick=()=>abrirLead(el.dataset.id)); }

  const dl=`${BASE}/dashboard.html?t=${t.slug}&k=${t.dashboard_token}`;
  const integSec = t.integracao==='iframe'
    ? `<p style="font-size:13px;font-weight:700;color:var(--dm);margin:18px 0 6px">📲 Código pro site — porteiro de WhatsApp</p>

    : `<p style="font-size:13px;font-weight:700;color:var(--dm);margin:18px 0 6px">📲 Integração no site</p>

    <div class="link-box"><input value="${fl}" readonly><button onclick="cp('${fl}',this)">Copiar</button></div>

    <p style="font-size:13px;font-weight:700;color:var(--dm);margin-bottom:6px">📊 Painel do cliente</p>
    <div class="link-box"><input value="${dl}" readonly><button onclick="cp('${dl}',this)">Copiar</button></div>

    ${integSec}
    <hr>

    <div class="field" style="margin-bottom:8px"><div style="display:flex;gap:8px"><input placeholder="Só pesquisando" id="ol2" style="flex:1"><input type="number" min="0" max="10" placeholder="0" id="op2" style="width:66px"></div></div>

    <button class="btn btn-primary btn-full" onclick="salvarQ('${id}','${(qs||[]).length}')">Salvar pergunta</button>

};
window.salvarQ = async (tid, ordem) => {
  const txt=document.getElementById('nq-txt').value.trim();
  if(!txt){document.getElementById('nq-err').textContent='Escreve a pergunta.';return;}
  const opts=[];
  for(let i=0;i<3;i++){
    const l=document.getElementById(`ol${i}`)?.value.trim();
    const p=parseInt(document.getElementById(`op${i}`)?.value||'0');
    if(l) opts.push({label:l,pontos:isNaN(p)?0:p});
  }
  if(opts.length<2){document.getElementById('nq-err').textContent='Adiciona pelo menos 2 opções.';return;}
  const {error}=await sb.from('capta_perguntas').insert({tenant_id:tid,ordem:parseInt(ordem)+1,texto:txt,opcoes:opts});
  if(error){document.getElementById('nq-err').textContent=error.message;return;}
  abrirPerguntas(tid);
};
window.delQ = async (qid,tid) => {
  if(!confirm('Apagar esta pergunta?'))return;
  await sb.from('capta_perguntas').delete().eq('id',qid);
  abrirPerguntas(tid);
};

window.salvarCliente = async id => {
  const nome=document.getElementById('c-nome').value.trim();
  const slug=document.getElementById('c-slug').value.trim();

  if(!slug){errEl.textContent='Slug obrigatório.';return;}

  const payload={nome,slug,whatsapp:wa,headline:hl||'Fale com a gente',msg_template:msg||'Oi! Sou {nome}, vim pelo formulário.',owner_email:email||null,plano,integracao:integ,ativo};

const FAPI = '/api/capta-forms', MAPI = '/api/capta-maya';

async function afLoad(){
  try{ const r = await fetch(FAPI+afQS(AF.tenant)); AF.data = r.ok ? await r.json() : {forms:[],limite:1,plano:AF.tenant.plano}; }

}
function afList(){
  const F=AF.data, forms=F.forms||[], limite=F.limite!=null?F.limite:1, usados=forms.length, cheio=usados>=limite;
  const limTxt = limite>=1000000000?`${usados} formulário${usados!==1?'s':''}`:`${usados} de ${limite}`;
  document.getElementById('af-body').innerHTML = `

      <span style="font-size:13px;color:var(--dm)">${limTxt}</span>

window.afCriar = async () => {
  const nome=document.getElementById('afn-nome').value.trim();

  const proposito=document.getElementById('afn-prop').value.trim(), pede_email=document.getElementById('afn-email').checked;

function afEditorList(){
  if(!AF.editPerguntas.length) return '<div class="empty" style="padding:16px">Nenhuma pergunta ainda. Adicione manual ou gere com a Maya.</div>';
  return AF.editPerguntas.map((q,i)=>`<div class="q-item">
    <div class="q-item-head"><span class="q-num">${i+1}</span><span class="q-txt">${esc(q.texto)}</span><button class="btn btn-danger btn-sm" onclick="afDelPergunta(${i})">✕</button></div>

}
function afRepaint(){ const f=(AF.data.forms||[]).find(x=>x.id===AF.editFormId)||{nome:''}; afPaintEditor(f); }
window.afAddPergunta = () => {
  const txt=document.getElementById('afq-txt').value.trim(), raw=document.getElementById('afq-ops').value.trim();
  if(!txt){document.getElementById('afq-err').textContent='Escreve a pergunta.';return;}
  const opcoes=raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|');return{label:(p[0]||'').trim(),pontos:parseInt((p[1]||'0').trim())||0};}).filter(o=>o.label);
  if(opcoes.length<2){document.getElementById('afq-err').textContent='Coloca pelo menos 2 opções.';return;}
  AF.editPerguntas.push({texto:txt,opcoes}); afRepaint();
};
window.afDelPergunta = (i) => { AF.editPerguntas.splice(i,1); afRepaint(); };
window.afSalvarPerguntas = async () => {
  try{
    const r=await fetch(FAPI+afQS(AF.tenant),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'salvar_perguntas',id:AF.editFormId,perguntas:AF.editPerguntas})});

    await afLoad(); afList();
  }catch(e){document.getElementById('afq-err').textContent=e.message;}
};

window.afMayaGerar = async () => {
  const nicho=document.getElementById('afm-nicho').value.trim();
  if(!nicho){document.getElementById('afm-err').textContent='Conta o que o negócio faz.';return;}
  const instagram=document.getElementById('afm-insta').value.trim();
  document.getElementById('af-maya').innerHTML='<div class="q-item" style="padding:16px;text-align:center;margin-bottom:12px"><p style="color:var(--dm);font-size:13px">Maya está montando as perguntas…</p></div>';
  try{
    const f=(AF.data.forms||[]).find(x=>x.id===AF.editFormId);
    const r=await fetch(MAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'gerar',slug:AF.tenant.slug,token:AF.tenant.dashboard_token,contexto:{nicho,instagram,pede_email:!!(f&&f.pede_email)}})});
    const d=await r.json();
    if(!r.ok){document.getElementById('af-maya').innerHTML=`<div class="q-item" style="padding:14px;margin-bottom:12px"><p style="color:var(--dm);font-size:13px">${esc(d.error||'Erro')}</p><button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="afMayaStart()">Tentar de novo</button></div>`;return;}
    (d.perguntas||[]).forEach(q=>AF.editPerguntas.push({texto:q.texto,opcoes:q.opcoes})); afRepaint();
  }catch(e){document.getElementById('af-maya').innerHTML=`<div class="q-item" style="padding:14px"><p style="color:var(--dm);font-size:13px">${esc(e.message)}</p></div>`;}
};

window.S = S;
init();
</script>
</body>
</html>
