<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajustes — Capta</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#2E5BFF;--brand-2:#5B8DEF;--brand-soft:rgba(46,91,255,.10);--brand-softer:rgba(46,91,255,.06);
--bg:#F4F6FB;--card:#FFFFFF;--line:#E9ECF3;--line-2:#F1F3F8;--ink:#141A2E;--muted:#697089;--faint:#9AA1B4;
--quente:#E03127;--morno:#C47A08;--verde:#16A34A;--verde-bg:rgba(22,163,74,.12);--r:16px;--shadow:0 1px 2px rgba(20,26,46,.04),0 6px 20px rgba(20,26,46,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select{font-family:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 26px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.voltar{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;padding:7px 13px;border-radius:10px;text-decoration:none}
.wrap{padding:20px 26px 48px;max-width:1000px}
.barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.abas{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:10px}
.abas button{border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:8px}
.abas button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px}
.btn.g{background:var(--card);color:var(--muted);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:12px}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.bloco h3{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.bloco .h{font-size:12.5px;color:var(--faint);margin-bottom:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}tr:last-child td{border-bottom:0}
.papel{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.papel.secretaria{background:rgba(224,147,15,.14);color:var(--morno)}.papel.leitura{background:var(--line-2);color:var(--muted)}.papel.atendente{background:var(--verde-bg);color:var(--verde)}
.off{opacity:.5}
.telas{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tl{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--line-2);color:var(--muted)}
.papeis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pc b{font-size:13px}.pc p{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.fundo{position:fixed;inset:0;background:rgba(20,26,46,.42);display:grid;place-items:center;padding:20px;z-index:50}
.janela{background:var(--card);border-radius:var(--r);padding:22px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(20,26,46,.2);max-height:92vh;overflow-y:auto}
.janela h3{font-size:16px;font-weight:700}.janela p{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
.campo{margin-top:12px}.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.campo input,.campo select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fim{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.aviso{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--faint);line-height:1.7}
.dica{font-size:12.5px;color:var(--muted);background:var(--line-2);border-radius:10px;padding:10px 12px;line-height:1.55;margin-top:10px}
</style>
<style>body.embed .voltar,body.embed .topbar{display:none}body.embed .wrap{padding-top:16px}</style>
<script>if(new URLSearchParams(location.search).get('embed')==='1'){document.documentElement.classList.add('embed');document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('embed'));}</script>
<style>@media(max-width:760px){body.embed .wrap{padding-bottom:80px}.grade,.corpo{grid-template-columns:1fr!important}.tally{gap:14px;padding:10px 12px}.tally b{font-size:19px}}</style>
</head>
<body>
<div class="topbar"><a class="voltar" id="voltar" href="/dashboard.html">← Painel</a><h1>Ajustes</h1></div>
<div class="wrap"><div class="barra"><div class="abas"><button class="on" id="ab-equipe" onclick="aba('equipe')">Equipe e permissões</button><button id="ab-recepcao" onclick="aba('recepcao')">Recepção</button><button id="ab-conta" onclick="aba('conta')">Conta</button></div>
  <button class="btn" style="margin-left:auto" id="btn-novo" onclick="editar(null)">+ Nova pessoa</button></div>
  <div id="raiz"><div class="aviso">Carregando…</div></div></div>
<div id="modal"></div>

<script>
const p = new URLSearchParams(location.search);
const SLUG = p.get('t') || '', TOKEN = p.get('k') || '';
document.getElementById('voltar').href = `/dashboard.html?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TELAS = [['atendimento','Atendimento'],['painel','Painel'],['pipeline','Pipeline'],['conversas','Conversas'],['leads','Leads'],['agenda','Agenda'],['aula','Aula experimental'],['alunos','Alunos'],['eventos','Eventos'],['ajustes','Ajustes']];
let ABA = 'equipe', EQ = [], PAPEIS = {}, EU = null, SEL = null;

async function api(acao, extra = {}) {
  const r = await fetch('/api/capta-whatsapp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ acao, slug:SLUG, token:TOKEN, email_atual: (window.CaptaUser && CaptaUser.email && CaptaUser.email()) || undefined, ...extra }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`); return d;
}
async function carregar(){
  try { const d = await api('equipe'); EQ = d.equipe || []; PAPEIS = d.papeis || {};
    EU = EQ.find(u => u.email === ((window.CaptaUser && CaptaUser.email && CaptaUser.email()) || '')) || null;
    desenhar(); } catch(e){ document.getElementById('raiz').innerHTML = `<div class="aviso">${esc(e.message)}</div>`; }
}
function aba(a){ ABA = a; ['equipe','recepcao','conta'].forEach(x => document.getElementById('ab-'+x).classList.toggle('on', x===a)); document.getElementById('btn-novo').style.display = a==='equipe' ? '' : 'none'; desenhar(); }
const telasDe = u => (u.telas && u.telas.length ? u.telas : (PAPEIS[u.papel] || {}).telas || []);

function desenhar(){
  if (ABA === 'conta') return desenharConta();
  if (ABA === 'recepcao') return desenharRecepcao();
  const gestor = !EU || EU.papel === 'gestor';
  document.getElementById('raiz').innerHTML = `
    <div class="bloco"><h3>Quem tem acesso</h3><div class="h">Cada pessoa entra com o próprio e-mail e senha em capta.riseagencia.com/login.html. O que ela pode ver e fazer vem do perfil — e dá pra ajustar tela a tela.</div>
      ${EQ.length ? `<table><tr><th>Pessoa</th><th>Perfil</th><th>Telas</th><th>Último acesso</th><th></th></tr>
      ${EQ.map(u => `<tr class="${u.ativo===false?'off':''}"><td><b>${esc(u.nome||'')}</b><br><span style="color:var(--faint);font-size:12px">${esc(u.email)}</span></td>
        <td><span class="papel ${esc(u.papel)}">${esc((PAPEIS[u.papel]||{}).nome || u.papel)}</span>${u.ativo===false?'<br><span style="font-size:11px;color:var(--quente);font-weight:700">desativado</span>':''}</td>
        <td><div class="telas">${telasDe(u).map(t => `<span class="tl">${esc((TELAS.find(x=>x[0]===t)||[])[1] || t)}</span>`).join('')}</div></td>
        <td style="color:var(--muted);font-size:12px">${u.ultimo_acesso ? new Date(u.ultimo_acesso).toLocaleDateString('pt-BR') : '—'}</td>
        <td style="text-align:right">${gestor ? `<button class="btn g sm" onclick="editar('${u.id}')">editar</button>` : ''}</td></tr>`).join('')}</table>`
      : '<div class="aviso">Ninguém cadastrado ainda.</div>'}
      ${gestor ? '' : '<div class="dica">Só um gestor pode alterar a equipe.</div>'}
    </div>
    <div class="bloco"><h3>Perfis</h3><div class="h">O perfil é o atalho; as telas marcadas na pessoa mandam mais que ele.</div>
      <div class="papeis">${Object.entries(PAPEIS).map(([k,v]) => `<div class="pc"><b>${esc(v.nome)}</b><p>${esc(v.desc)}</p><div class="telas" style="margin-top:8px">${(v.telas||[]).map(t=>`<span class="tl">${esc((TELAS.find(x=>x[0]===t)||[])[1]||t)}</span>`).join('')}</div></div>`).join('')}</div>
      <div class="dica"><b>Exemplo do dia a dia:</b> quem cuida da matrícula e do quadro de alunos (matriculados, cancelados, trancados) entra como <b>Secretaria</b> — vê Alunos, Agenda e Aula experimental, e não abre as conversas nem o Painel.</div>
    </div>`;
}
function desenharRecepcao(){
  const base = location.origin, qs = `?t=${encodeURIComponent(SLUG)}&k=${encodeURIComponent(TOKEN)}`;
  const link = (url, titulo, texto) => `<div class="bloco"><h3>${titulo}</h3><div class="h">${texto}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input readonly value="${url}" style="flex:1;min-width:260px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--muted)" onclick="this.select()">
    <button class="btn g" onclick="navigator.clipboard.writeText('${url}');toast('Link copiado')">copiar</button><a class="btn" style="text-decoration:none" href="${url}" target="_blank" rel="noopener">abrir</a></div></div>`;
  document.getElementById('raiz').innerHTML =
    link(base + '/checkin.html' + qs, 'Tablet de check-in', 'Deixe aberto no tablet da entrada. A pessoa toca no próprio nome ao chegar e ao sair; na saída da aula experimental, o tablet pergunta como foi, se vai matricular na hora e, se não, o motivo.') +
    link(base + '/monitor.html' + qs, 'Monitor da sala', 'Tela cheia na TV: turmas do dia, quem já chegou e os visitantes da aula experimental. Atualiza sozinho.') +
    `<div class="bloco"><h3>Como deixar em tela cheia</h3><div class="h">No tablet: abra o link no Chrome, toque em ⋮ → <b>Adicionar à tela inicial</b>. Na TV/monitor: abra no navegador e aperte <b>F11</b>. Os dois links não pedem senha — quem tiver o link entra, então use só nos aparelhos da escola.</div></div>`;
}
function desenharConta(){
  const eu = EU || {};
  document.getElementById('raiz').innerHTML = `
    <div class="bloco"><h3>Sua conta</h3>
      <div class="h">${eu.nome ? `Você está como <b>${esc(eu.nome)}</b> (${esc((PAPEIS[eu.papel]||{}).nome||eu.papel)}) · ${esc(eu.email)}` : 'Você entrou pelo link do painel, sem login pessoal.'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn g" style="text-decoration:none" href="/login.html">Trocar de conta</a><button class="btn g" onclick="CaptaUser.sair();try{localStorage.removeItem('capta_destino')}catch(e){};location.reload()">Esquecer neste navegador</button></div>
      <div class="dica">A senha é do próprio e-mail: mude em <b>login.html → esqueci minha senha</b>.</div></div>
    <div class="bloco"><h3>Negócio</h3><div class="h">Painel: <b>${esc(SLUG)}</b></div>
      <div class="dica">Para conectar ou trocar o WhatsApp da unidade, use o botão <b>Conectar WhatsApp</b> no topo do painel.</div></div>`;
}
function editar(id){
  const u = id ? EQ.find(x => x.id === id) : { papel:'atendente', ativo:true };
  const telas = telasDe(u);
  document.getElementById('modal').innerHTML = `<div class="fundo" id="fundo"><div class="janela">
    <h3>${id ? 'Editar pessoa' : 'Nova pessoa'}</h3><p>Ela entra com este e-mail em capta.riseagencia.com/login.html e cria a própria senha.</p>
    <div class="campo"><label>Nome</label><input id="f-nome" value="${esc(u.nome||'')}" placeholder="Ex.: Verônica"></div>
    <div class="campo"><label>E-mail</label><input id="f-email" type="email" value="${esc(u.email||'')}" ${id?'disabled':''} placeholder="pessoa@email.com"></div>
    <div class="campo"><label>Perfil</label><select id="f-papel" onchange="marcarPadrao(this.value)">${Object.entries(PAPEIS).map(([k,v]) => `<option value="${k}" ${u.papel===k?'selected':''}>${esc(v.nome)} — ${esc(v.desc)}</option>`).join('')}</select></div>
    <div class="campo"><label>Telas que essa pessoa vê</label><div class="chips" id="f-telas">${TELAS.map(([k,t]) => `<button type="button" class="chip ${telas.includes(k)?'on':''}" data-t="${k}" onclick="this.classList.toggle('on')">${t}</button>`).join('')}</div></div>
    <div class="campo"><label><input type="checkbox" id="f-ativo" ${u.ativo!==false?'checked':''} style="width:auto;margin-right:6px">Acesso ativo</label></div>
    <div class="fim">${id ? `<button class="btn g" style="margin-right:auto" onclick="apagar('${id}')">Remover</button>` : ''}<button class="btn g" onclick="fechar()">Cancelar</button><button class="btn" onclick="salvar('${id||''}')">Salvar</button></div></div></div>`;
  document.getElementById('fundo').onclick = e => { if (e.target.id === 'fundo') fechar(); };
}
function marcarPadrao(papel){ const t = (PAPEIS[papel]||{}).telas || []; document.querySelectorAll('#f-telas .chip').forEach(c => c.classList.toggle('on', t.includes(c.dataset.t))); }
function fechar(){ document.getElementById('modal').innerHTML = ''; }
async function salvar(id){
  const telas = [...document.querySelectorAll('#f-telas .chip.on')].map(c => c.dataset.t);
  const u = { id: id || undefined, nome: document.getElementById('f-nome').value.trim(), email: document.getElementById('f-email').value.trim(), papel: document.getElementById('f-papel').value, ativo: document.getElementById('f-ativo').checked, telas };
  if (!u.nome) return toast('Informe o nome.', { tipo:'erro' });
  try { const d = await api('equipe_salvar', { usuario: u }); EQ = d.equipe; fechar(); desenhar(); toast(`<b>${esc(u.nome)}</b> ${id ? 'atualizado' : 'adicionado'} · perfil ${esc((PAPEIS[u.papel]||{}).nome||u.papel)}`, { tipo:'ok' }); }
  catch(e){ toast(e.message, { tipo:'erro' }); }
}
async function apagar(id){ const u = EQ.find(x => x.id === id); if (!confirm(`Remover ${u?.nome||'esta pessoa'} da equipe?`)) return;
  try { const d = await api('equipe_salvar', { apagar: id }); EQ = d.equipe; fechar(); desenhar(); toast('Removido'); } catch(e){ toast(e.message, { tipo:'erro' }); } }
if (!SLUG || !TOKEN) document.getElementById('raiz').textContent = 'Abra esta página pelo painel do seu negócio.'; else carregar();
</script>
</body>
</html>
